name: Batch Korean pass 58

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-58.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Translate pistol UI strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/300 Pistols.ERB')
          raw = p.read_bytes()
          assert raw.startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM missing before edit'
          text = raw.decode('utf-8-sig')
          original = text

          rules = [
              (300, '描写', r'''A cheap, low quality \"saturday-night special\" kind of gun, Fairy Tactical promises the CC15 to be a Gensokyan-made pistol, comparable to weapons like the Tricorne CCW15 that its based off of and Deterrence Dispensed Model 17, however its outclassed by both of them. Despite the underwhelming performance, the CC15 is still widely used as a low cost weapon to arm non Danmaku capable humans without resorting to melee or makeshift weaponry.''', '값싸고 품질이 낮은 「새터데이 나이트 스페셜」류 권총이다. 페어리 택티컬은 CC15가 트라이코르네 CCW15를 기반으로 한 환상향제 권총이며 디터런스 디스펜스드 모델 17 같은 무기와 견줄 만하다고 선전하지만, 실제로는 두 제품 모두에 미치지 못한다. 성능은 기대 이하지만 저렴한 가격 덕분에 탄막을 다루지 못하는 인간들에게 근접무기나 급조 무기 대신 지급하는 저가 화기로 널리 쓰인다.'),

              (307, '名前', 'energy pistol', '에너지 권총'),
              (307, 'FullName', 'Cactus Company Energy Pistol「SideSTRAP」', '캑터스 컴퍼니 에너지 권총「SideSTRAP」'),
              (307, 'FullName', 'energy pistol', '에너지 권총'),

              (308, '名前', 'lunatic gun', '루나틱 건'),
              (308, 'FullName', 'LUNINCO Lunatic Gun「LAC666」', '루닌코 루나틱 건「LAC666」'),
              (308, 'FullName', 'lunatic gun', '루나틱 건'),

              (312, 'FullName', r'''Windurger \"S.Pistol\" No.2 Silent Pistol''', '윈더거 「S.Pistol」 No.2 소음 권총'),

              (314, '名前', 'ultratech pistol', '초첨단 권총'),
              (314, 'FullName', 'Gensou-chan Ultratech Pistol「BENCHY」', '겐소우짱 초첨단 권총「BENCHY」'),
              (314, 'FullName', 'ultratech pistol', '초첨단 권총'),
              (314, '描写', r'''The Makai soldier's sidearm with the acronym \"BENCHY Especially is Not a Charged Handgun sYstem\", based off the CC15 from Tricorne. Takes the Cactus Company's 7.62x20mm cartridge instead of the regular 9x19mm. However instead of being charged with electricity, they're propelled with Yojipowder and enhanced with Youjutsu essence (but is still compatible with regular Cactus ammunition). HUG-series grips and several receiver modifications allow for low-recoil automatic fire. Built in ALSA aiming system allows for fire and forget tactics. Devil-Match barrel doubles your bullet per bullet. Reject Cactus, embrace BENCHY. Youjutsu summoned by the Makai God and compatible with Tricorne CC15 parts.''', '마계 병사의 보조무기로, 「BENCHY Especially is Not a Charged Handgun sYstem」의 약자를 이름으로 쓴다. 트라이코르네 CC15를 기반으로 하며 일반적인 9x19mm 대신 캑터스 컴퍼니의 7.62x20mm 탄약을 사용한다. 전기로 충전하는 대신 요지파우더로 추진되고 요술 정수로 강화되지만 일반 캑터스 탄약과도 호환된다. HUG 계열 그립과 여러 리시버 개조로 저반동 자동사격이 가능하며, 내장 ALSA 조준 시스템이 표적 추적을 보조한다. 데빌 매치 총열은 한 번에 발사되는 탄환 수를 두 배로 늘린다. 캑터스를 거부하고 BENCHY를 받아들여라. 마계의 신이 소환한 요술 무기이며 트라이코르네 CC15 부품과 호환된다.'),

              (315, '名前', '.500 magnum', '.500 매그넘'),
              (315, 'FullName', 'Windurger .500 Revolver「S500」', '윈더거 .500 리볼버「S500」'),
              (315, 'FullName', '.500 magnum', '.500 매그넘'),
              (315, '描写', r'''Designed to feed the biggest cartridge known for a pistol, the S500 is both impractical and powerful. Just don't forget abbout the recoil. It bordered legality in the United States, as a bullet diameter larger than 0.5 inches (measured at the land of the bullet) can be classified as a \"destructive device\", according to the BATFE.''', '권총용으로 알려진 가장 큰 탄약을 사용하도록 설계된 S500은 비실용적이면서도 강력하다. 다만 반동은 잊어서는 안 된다. 미국에서는 합법성의 경계에 걸쳤는데, BATFE 기준상 탄두 직경이 0.5인치를 넘으면 「파괴 장치」로 분류될 수 있기 때문이다.'),

              (316, '名前', 'single shot pistol', '단발 권총'),
              (316, 'FullName', 'Deterrence Dispensed Single Shot Pistol「Liberator」', '디터런스 디스펜스드 단발 권총「Liberator」'),
              (316, 'FullName', 'single shot pistol', '단발 권총'),
          ]
          assert len(rules) == 19

          func_re = re.compile(r'^@Weapon(\d+)\(ARG, O_DATA, V_NAME\)\s*$', re.M)

          def function_span(src, weapon_id):
              matches = list(func_re.finditer(src))
              found = [(i, m) for i, m in enumerate(matches) if int(m.group(1)) == weapon_id]
              assert len(found) == 1, f'Weapon{weapon_id}: expected one active function, got {len(found)}'
              i, m = found[0]
              end = matches[i + 1].start() if i + 1 < len(matches) else len(src)
              return m.start(), end

          protected_keys = [
              '名前', 'FullName', '描写', '装備部位', 'Grade', 'Tech Level', 'Price',
              'Receiver Slot', 'Magazine Slot', 'Barrel Slot', 'Barrel Body Slot',
              'Tactical Slot', 'Sight Slot', 'Stock Slot', 'Grip Slot',
              'WeaponReceiver/Default', 'WeaponMag/Default', 'WeaponBarrelBody/Default',
              'WeaponBarrel/Default', 'WeaponGrip/Default', 'WeaponTactical/Default',
              'Research Required', 'Type', 'Class', 'Platform', 'Tags'
          ]
          before_counts = {k: original.count(f'CASE "{k}"') for k in protected_keys}
          protected_token_re = re.compile(r'%[^%\n]+%|\{[^{}\n]+\}|\\n|\\@')
          before_tokens = protected_token_re.findall(original)

          for weapon_id, field, old, new in rules:
              fstart, fend = function_span(text, weapon_id)
              block = text[fstart:fend]
              cases = list(re.finditer(r'^\s*CASE "([^"]+)"\s*$', block, re.M))
              target = None
              for ci, cm in enumerate(cases):
                  if cm.group(1) == field:
                      cend = cases[ci + 1].start() if ci + 1 < len(cases) else len(block)
                      target = (cm.end(), cend)
                      break
              assert target is not None, f'Weapon{weapon_id}: CASE {field} missing'
              cstart, cend = target
              cblock = block[cstart:cend]
              pat = re.compile(r'CALLF MAKE_STR\(V_NAME,\s*"' + re.escape(old) + r'"\)')
              active = []
              for mm in pat.finditer(cblock):
                  ls = cblock.rfind('\n', 0, mm.start()) + 1
                  line = cblock[ls:mm.end()]
                  if not line.lstrip().startswith(';'):
                      active.append(mm)
              assert len(active) == 1, f'Weapon{weapon_id} {field}: expected one active old value, got {len(active)}: {old!r}'
              mm = active[0]
              new_stmt = f'CALLF MAKE_STR(V_NAME, "{new}")'
              cblock = cblock[:mm.start()] + new_stmt + cblock[mm.end():]
              block = block[:cstart] + cblock + block[cend:]
              text = text[:fstart] + block + text[fend:]

          after_counts = {k: text.count(f'CASE "{k}"') for k in protected_keys}
          assert before_counts == after_counts, (before_counts, after_counts)
          assert before_tokens == protected_token_re.findall(text), 'protected interpolation/token sequence changed'

          eng = re.compile(r'[A-Za-z]{2,}')
          hangul = re.compile(r'[가-힣]')
          literal_re = re.compile(r'CALLF MAKE_STR\(V_NAME,\s*(?:@)?"((?:\\.|[^"\\])*)"\)')
          wanted = {'名前', 'FullName', '描写'}
          remaining = []
          funcs = list(func_re.finditer(text))
          for i, fm in enumerate(funcs):
              weapon_id = int(fm.group(1))
              fend = funcs[i + 1].start() if i + 1 < len(funcs) else len(text)
              block = text[fm.start():fend]
              cases = list(re.finditer(r'^\s*CASE "([^"]+)"\s*$', block, re.M))
              for ci, cm in enumerate(cases):
                  field = cm.group(1)
                  if field not in wanted:
                      continue
                  cend = cases[ci + 1].start() if ci + 1 < len(cases) else len(block)
                  cblock = block[cm.end():cend]
                  for sm in literal_re.finditer(cblock):
                      ls = cblock.rfind('\n', 0, sm.start()) + 1
                      line = cblock[ls:sm.end()]
                      if line.lstrip().startswith(';'):
                          continue
                      value = sm.group(1)
                      if eng.search(value) and not hangul.search(value):
                          remaining.append((weapon_id, field, value))

          expected_remaining = [
              (300, '名前', 'CC⑮'),
              (302, '名前', 'Sheriff'),
              (303, '名前', 'Youjyuu-P'),
              (304, '名前', 'ABP'),
              (305, '名前', 'Summers'),
              (306, '名前', 'LAC2'),
              (307, '名前', 'SideSTRAP'),
              (308, '名前', 'LAC666'),
              (309, '名前', 'Tanhiken'),
              (310, '名前', 'Ansatsu'),
              (311, '名前', 'Neutralizer'),
              (312, '名前', 'S.Pistol'),
              (313, '名前', 'Lolife'),
              (314, '名前', 'BENCHY'),
              (316, '名前', 'Liberator'),
          ]
          assert remaining == expected_remaining, f'unexpected English-only active UI remains: {remaining}'

          p.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          assert p.read_bytes().startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM missing after edit'
          print(f'replacements={len(rules)}')
          print(f'english_only_active_ui_remaining={len(remaining)} (model names only)')
          PY

      - name: Validate
        shell: bash
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/300 Pistols.ERB"
          read add del file <<EOF
          $(git diff --numstat -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/300 Pistols.ERB')
          EOF
          test "$add" -eq 19
          test "$del" -eq 19
          echo "validated +${add}/-${del} ${file}"

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/300 Pistols.ERB'
          git commit -m '권총 UI 이름 및 설명 1차 한글화 58차'
          git push origin korean

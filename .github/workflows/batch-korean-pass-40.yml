name: Batch Korean pass 40

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-40.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate remaining HTML and NAS help strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          TOKEN_RE = re.compile(r'%[^%\n]+%|\{[^{}\n]+\}|\\%')
          WORD_RE = re.compile(r'[A-Za-z]{3,}')
          ALLOW = {'RETURNF', 'LOCALS', 'STA', 'ENE', 'EXP', 'VIG', 'CVAB', 'CVABM', 'TSP', 'UI'}

          def read_lines(path):
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              return bom, raw.decode('utf-8-sig').splitlines(keepends=True)

          def write_lines(path, bom, lines):
              data = ''.join(lines).encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              path.write_bytes(data)

          def tokens(s):
              return sorted(TOKEN_RE.findall(s))

          def meaningful_words(s):
              return [w for w in WORD_RE.findall(s) if w.upper() not in ALLOW]

          def replace_case_return(lines, case_header, return_index, new_stmt, label):
              hits = [i for i, line in enumerate(lines) if line.rstrip('\r\n') == case_header]
              if len(hits) != 1:
                  raise SystemExit(f'{label}: case anchor count={len(hits)}: {case_header}')
              start = hits[0]
              end = len(lines)
              for j in range(start + 1, len(lines)):
                  raw = lines[j].rstrip('\r\n')
                  if raw == 'ENDSELECT' or raw.startswith('\tCASE '):
                      end = j
                      break
              returns = [j for j in range(start + 1, end) if lines[j].lstrip().startswith('RETURNF ')]
              if return_index >= len(returns):
                  raise SystemExit(f'{label}: return index {return_index} out of range for {case_header}; found {len(returns)}')
              idx = returns[return_index]
              old = lines[idx]
              if not meaningful_words(old):
                  raise SystemExit(f'{label}: selected line no longer has meaningful English: {case_header} #{return_index}')
              indent = old[:len(old) - len(old.lstrip())]
              newline = '\r\n' if old.endswith('\r\n') else '\n' if old.endswith('\n') else ''
              new_line = indent + new_stmt + newline
              if tokens(old) != tokens(new_line):
                  raise SystemExit(f'{label}: protected token mismatch: {case_header} #{return_index}\nOLD={tokens(old)}\nNEW={tokens(new_line)}')
              leftover = meaningful_words(new_line)
              if leftover:
                  raise SystemExit(f'{label}: unexpected English left in replacement {case_header} #{return_index}: {leftover}')
              lines[idx] = new_line
              print(f'{label}: {case_header} return#{return_index + 1}')
              return 1

          html = Path('ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB')
          nas = Path('ERB/TRANSLATION/OMOGATARI/NAS_TIPS_TR.ERB')
          html_bom, html_lines = read_lines(html)
          nas_bom, nas_lines = read_lines(nas)

          html_rules = [
              ('\tCASE 4', 0, r'''RETURNF "이 캐릭터는 자신의 욕망을 거리낌 없이 받아들이며 새로운 성적 성향을 즐기고 있습니다."'''),
              ('\tCASE 9', 0, r'''RETURNF "임신을 바라는 성향으로, 임신할 확률이 더 높아집니다."'''),
              ('\tCASE 27', 0, r'''RETURNF "이 캐릭터는 성에 관해 무지하며 임신에 대한 지식도 없어 피임을 요구하지 않습니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 처녀성을 잃으면 크게 두려워하며 적대도 더 많이 상승합니다. 자위 중독 이벤트 연쇄를 완료하거나 교육용 서적을 통해 가르치면 이 특성이 사라집니다.\n보석: 별도 변화 없음"'''),
              ('\tCASE 30', 0, r'''RETURNF "정조에 크게 신경 쓰지 않습니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 피임 없는 삽입 협상이 쉬워지고 플레이어에게 키스 자국이 있어도 적대 상승이 적습니다. 주도권을 잡아 플레이어를 덮칠 가능성도 높습니다.\n보석: 별도 변화 없음"'''),
              ('\tCASE 30', 1, r'''RETURNF "정조와 품행을 중요하게 생각합니다.\n플레이어일 때: 질 삽입을 시작하기 훨씬 어렵습니다.\n대상일 때: 연모 상태가 되기 전에 처녀성을 잃으면 적대가 크게 상승합니다. 피임 없는 삽입 협상이 어려워지고 플레이어의 키스 자국을 보면 적대가 더 많이 오르며 주도권을 잡을 가능성도 낮아집니다.\n보석: 별도 변화 없음"'''),
              ('\tCASE 31', 0, r'''RETURNF "성에 관해 매우 폐쇄적입니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 여러 성적 행동을 실행하기 어려워지고 성적 불만은 2배 빠르게 줄면서 더 느리게 쌓입니다. 대부분의 성적 행동에서 우울 원인을 얻으며 욕정 7 이상이 되면 사라집니다.\n보석: 우울↑ 적대↑ 욕구↓"'''),
              ('\tCASE 31', 1, r'''RETURNF "성에 관해 매우 개방적입니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: C/V/A/B 계열 쾌감과 애정 계열 원인이 더 많이 상승합니다.\n보석: 욕구↑ 복종↑"'''),
              ('\tCASE 32', 0, r'''RETURNF "무슨 일이든 선뜻 하려 하지 않는 성향입니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 행동 실행 난도가 올라가고 대부분의 성적 행동에서 우울 원인을 얻습니다. 피임 없는 삽입 협상도 훨씬 어려우며 복종 7 이상이 되면 사라집니다.\n보석: 호의↓ 신뢰↓ 우울↑ 적대↑ 충성↓"'''),
              ('\tCASE 33', 0, r'''RETURNF "부끄러운 상황에서도 당황이 적고 화장실에 들어온 모습을 보여도 반응이 덜합니다. 주도권을 잡거나 플레이어를 덮칠 가능성이 높습니다.\n수치스러운 상황에서 덜 당황하는 대신 노출 계열 행동의 효과는 약해집니다."'''),
              ('\tCASE 33', 1, r'''RETURNF "성적 행동을 실행하기 조금 어려워지고 주도권을 잡거나 플레이어를 덮칠 가능성이 낮아집니다.\n수치스러운 상황에서 더 쉽게 당황하지만 노출 계열 행동의 효과는 크게 증가합니다."'''),
              ('\tCASE 80', 0, r'''RETURNF "피임 없는 삽입 협상이 쉬워지고 복종과 수치심 수치가 더 빠르게 상승합니다. 풋잡·겨드랑이 자극을 받거나 플레이어를 대상으로 A계열 삽입 행동을 하기 쉬워집니다."'''),
              ('\tCASE 81', 0, r'''RETURNF "상대 성별과 관계없이 여러 행동을 실행하기 쉬워집니다. 동성애 및 관련 중독 능력도 더 쉽게 상승합니다."'''),
              ('\tCASE 81', 1, r'''RETURNF "플레이어를 먼저 덮치지 않습니다."'''),
              ('\tCASE 81', 2, r'''RETURNF "플레이어가 남성이면 페널티를 받습니다. 연모 상태가 되면 페널티가 사라집니다."'''),
              ('\tCASE 81', 3, r'''RETURNF "플레이어가 여성이면 페널티를 받습니다. 연모 상태가 되면 페널티가 사라집니다."'''),
              ('\tCASE 82', 0, r'''RETURNF "주도권을 잡을 가능성이 훨씬 높고 어떤 행동에서든 통증과 공포를 더 쉽게 유발합니다. 플레이어가 이 특성을 가지면 여러 행동을 실행하기 쉬우며 많은 행동에서 복종 판정을 무시합니다.\n가학 능력이 더 쉽게 오르고 플레이어나 대상 중 한쪽이라도 이 특성을 가지면 제압하기 쉬워집니다.\n우월 수치는 더 빠르게, 공포와 복종은 더 느리게 오릅니다. 통증 각인을 올리면 이상 경험을 얻습니다."'''),
              ('\tCASE 83', 0, r'''RETURNF "주도권을 잡을 가능성이 크게 낮아집니다. 피학 능력이 더 쉽게 오르고 공포와 복종 수치는 더 빠르게 상승합니다.\n우울은 더 느리게 오르며 플레이어가 이 특성을 가지면 상대에게 제압당할 가능성이 높아집니다."'''),
              ('\tCASE 86', 0, r'''RETURNF "요염하고 장난기 많은 소악마 같은 성향입니다.\n대상이 이 특성을 가지면 풋잡·겨드랑이 자극을 받거나 플레이어에게 A계열 삽입 행동을 하기 쉬워집니다. 플레이어를 먼저 덮칠 가능성도 높아집니다."'''),
              ('\tCASE 120', 0, r'''RETURNF "사정한 정액의 효과가 훨씬 강해지고 임신 확률도 증가합니다."'''),
              ('\tCASE 142', 0, r'''RETURNF "상대를 제압하려는 시도가 항상 성공합니다. 욕구는 더 빠르게, 적대는 더 느리게 상승합니다.\n호감도 더 빠르게 오르지만 친밀도가 지나치게 높으면 상승량이 크게 줄어듭니다."'''),
              ('\tCASE 143', 0, r'''RETURNF "발정 상태가 될 수 있고 물이나 씻는 것을 좋아하지 않습니다. 후배위 체위를 선호합니다.\n대응하는 운세 효과가 있으면 호의와 신뢰가 더 빠르게 상승합니다."'''),
              ('\tCASE 144', 0, r'''RETURNF "특수 아이템을 구매하고 특수 행동을 실행할 수 있습니다. 조임 1단계의 제한을 무시하며 해당 부위 EXP가 50 이상이면 조임 2단계에서도 삽입할 수 있습니다."'''),
          ]

          nas_rules = [
              ('\tCASE "ATW.sex.weLoveLube"', 0, r'''RETURNF "사정 직전에 밖으로 빼겠다고 약속하면 상대가 피임 없이 관계하는 데 동의하도록 설득할 수 있습니다. 약속을 지키지 못하면 결과는 감수해야 합니다."'''),
              ('\tCASE "ATW.sex.ovulationDrugsAreJustLikeThat"', 0, r'''RETURNF "위험일에 배란 촉진제를 사용하면 오히려 임신 확률이 낮아집니다."'''),
              ('\tCASE "ATW.sex.pleasureMarksNeedMultiple"', 0, r'''RETURNF "쾌락의 각인은 강한 절정이나 동시 절정을 통해서만 얻을 수 있습니다."'''),
              ('\tCASE "ATW.char.151.funnyTitle"', 0, r'''RETURNF "이아! 이아! 유겐마간 프타근!"'''),
              ('\tCASE "levelCurve"', 0, r'''RETURNF @"쿼드울트라(QU/50) > 트라이울트라(TU/40) > 오버드라이브(OD/30) > 판타즘(Ph/20) > 엑스트라(Ex/17) > SS(16) > S(14) > A(11) > B(8) > C(5) > D(3)"'''),
              ('\tCASE "NAS.trivia.gryzov.SVG49"', 0, r'''RETURNF "레노브 에스브이지-49는 브로튼 모델 600, 암테크 에스피에이와 함께 미드월드 자동소총의 세 축 중 하나입니다. 7.62x39mm 탄을 장전하는 장행정 가스 피스톤 방식을 사용하며 악천후에서도 신뢰성이 매우 높아 여러 국가에서 채택되었습니다."'''),
              ('\tCASE "NAS.trivia.freax"', 0, r'''RETURNF "프리액스는 1978년 전기전자기술자협회가 개발한 포직스 호환 컴퓨터 운영체제로, 전체 컴퓨터의 약 90%에서 사용됩니다. 씨피엠이나 디오에스 같은 경쟁 운영체제는 더 발전된 포직스 계열 시스템보다 기능이 부족해 널리 자리 잡지 못했습니다."'''),
          ]

          html_count = sum(replace_case_return(html_lines, *rule, 'HTML40') for rule in html_rules)
          nas_count = sum(replace_case_return(nas_lines, *rule, 'NAS40') for rule in nas_rules)
          if html_count != 22 or nas_count != 7:
              raise SystemExit(f'wrong replacement count: html={html_count}, nas={nas_count}')

          write_lines(html, html_bom, html_lines)
          write_lines(nas, nas_bom, nas_lines)
          print(f'PASS40_REPLACEMENTS html={html_count} nas={nas_count} total={html_count + nas_count}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          targets = [
              Path('ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB'),
              Path('ERB/TRANSLATION/OMOGATARI/NAS_TIPS_TR.ERB'),
          ]
          for path in targets:
              raw = path.read_bytes()
              if not raw.startswith(b'\xef\xbb\xbf'):
                  raise SystemExit(f'BOM lost: {path}')
              text = raw.decode('utf-8-sig')
              for lineno, line in enumerate(text.splitlines(), 1):
                  if line.rstrip(' \t') != line:
                      raise SystemExit(f'trailing whitespace: {path}:{lineno}')
          html = targets[0].read_text(encoding='utf-8-sig')
          nas = targets[1].read_text(encoding='utf-8-sig')
          for anchor in ('@TALENT_INFO(ARG,ARG:1,nChara)', '\tCASE 27', '\tCASE 81', '\tCASE 144', '@RACE_INFO(ARG)'):
              if anchor not in html:
                  raise SystemExit(f'missing HTML anchor: {anchor}')
          for anchor in ('@TIPS_TYPES_TR_ATW(ARGS)', '@TIPS_TYPES_TR_NAS(ARGS)', '\tCASE "levelCurve"', '\tCASE "NAS.trivia.freax"'):
              if anchor not in nas:
                  raise SystemExit(f'missing NAS anchor: {anchor}')
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          expected=(
            'ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB'
            'ERB/TRANSLATION/OMOGATARI/NAS_TIPS_TR.ERB'
          )
          if [ "${#changed[@]}" -ne 2 ]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          for i in 0 1; do
            if [ "${changed[$i]}" != "${expected[$i]}" ]; then
              printf 'Changed file mismatch at %s: got=%s expected=%s\n' "$i" "${changed[$i]}" "${expected[$i]}"
              exit 1
            fi
          done
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            'ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB' \
            'ERB/TRANSLATION/OMOGATARI/NAS_TIPS_TR.ERB'
          git commit -m 'HTML 및 NAS 잔여 도움말 한글화 40차'
          git push origin HEAD:korean

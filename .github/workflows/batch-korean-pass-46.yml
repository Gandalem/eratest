name: Batch Korean pass 46

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-46.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Translate clothing display strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB')
          raw = path.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('UTF-8 BOM missing before edit')
          text = raw.decode('utf-8-sig')

          rules = [
              (r'''CALLF MAKE_STR(V_NAME, "sporty crop top")''', r'''CALLF MAKE_STR(V_NAME, "스포티 크롭 탑")'''),
              (r'''CALLF MAKE_STR(V_NAME, "Gensou-chan crop top")''', r'''CALLF MAKE_STR(V_NAME, "겐소우짱 크롭 탑")'''),
              (r'''CALLF MAKE_STR(V_NAME, "rugged crop top")''', r'''CALLF MAKE_STR(V_NAME, "튼튼한 크롭 탑")'''),
              (r'''CALLF MAKE_STR(V_NAME, "flight attendant crop top")''', r'''CALLF MAKE_STR(V_NAME, "승무원 크롭 탑")'''),
              (r'''CALLF MAKE_STR(V_NAME, "plaid tank top")''', r'''CALLF MAKE_STR(V_NAME, "체크무늬 탱크톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "cyan tube top")''', r'''CALLF MAKE_STR(V_NAME, "청록색 튜브톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "silver tube top")''', r'''CALLF MAKE_STR(V_NAME, "은색 튜브톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "rubber tube top")''', r'''CALLF MAKE_STR(V_NAME, "고무 튜브톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "tartan tube top")''', r'''CALLF MAKE_STR(V_NAME, "타탄 체크 튜브톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "red tube top")''', r'''CALLF MAKE_STR(V_NAME, "빨간 튜브톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "pink tube top")''', r'''CALLF MAKE_STR(V_NAME, "분홍 튜브톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "yellow exposing tube top")''', r'''CALLF MAKE_STR(V_NAME, "노출형 노란 튜브톱")'''),
              (r'''CALLF MAKE_STR(V_NAME, "white tube top")''', r'''CALLF MAKE_STR(V_NAME, "흰색 튜브톱")'''),

              (r'''CALLF MAKE_STR(V_NAME, "coffin")''', r'''CALLF MAKE_STR(V_NAME, "관")'''),
              (r'''CALLF MAKE_STR(V_NAME, @"A big, heavy coffin designed to conceal a body. Harder for someone to find a body if buried properly.")''', r'''CALLF MAKE_STR(V_NAME, @"시신을 감추도록 설계된 크고 무거운 관이다. 제대로 매장하면 다른 사람이 시신을 찾기 더 어려워진다.")'''),
              (r'''CALLF MAKE_STR(V_NAME, "flower")''', r'''CALLF MAKE_STR(V_NAME, "꽃")'''),
              (r'''CALLF MAKE_STR(V_NAME, @"A cute looking flower that improves the wearer's looks.")''', r'''CALLF MAKE_STR(V_NAME, @"착용자의 외모를 돋보이게 하는 귀여운 꽃이다.")'''),
              (r'''CALLF MAKE_STR(V_NAME, "coin purse")''', r'''CALLF MAKE_STR(V_NAME, "동전 주머니")'''),
              (r'''CALLF MAKE_STR(V_NAME, @"A coin purse generally worn during funerals.")''', r'''CALLF MAKE_STR(V_NAME, @"장례식 때 흔히 착용하는 동전 주머니다.")'''),
              (r'''CALLF MAKE_STR(V_NAME, "Darwin award")''', r'''CALLF MAKE_STR(V_NAME, "다윈상")'''),
              (r'''CALLF MAKE_STR(V_NAME, @"An award that proves you showed a high amount of idiocy when entering the afterlife.")''', r'''CALLF MAKE_STR(V_NAME, @"저승에 들어갈 때 얼마나 어리석은 행동을 했는지 증명하는 상이다.")'''),
              (r'''CALLF MAKE_STR(V_NAME, "diaper slippers")''', r'''CALLF MAKE_STR(V_NAME, "기저귀 슬리퍼")'''),
              (r'''CALLF MAKE_STR(V_NAME, @"A pair of adult diapers converted into slippers. Even your feet need protection sometimes.")''', r'''CALLF MAKE_STR(V_NAME, @"성인용 기저귀 한 쌍을 슬리퍼로 개조했다. 발도 때로는 보호가 필요하다.")'''),
              (r'''CALLF MAKE_STR(V_NAME, "JESUIT knight metal boots")''', r'''CALLF MAKE_STR(V_NAME, "예수회 기사 금속 부츠")'''),
              (r'''CALLF MAKE_STR(V_NAME, @"Metal boots for JESUIT knights, crusaders, and valkyries. Valkyries don't mind the slightly mismatching shoes as it doesn't horrendously counter the set.")''', r'''CALLF MAKE_STR(V_NAME, @"예수회 기사와 십자군, 발키리를 위한 금속 부츠다. 발키리는 세트와 조금 어울리지 않는 정도의 신발은 크게 신경 쓰지 않는다.")'''),
              (r'''CALLF MAKE_STR(V_NAME, "Burial Outfit")''', r'''CALLF MAKE_STR(V_NAME, "장례복")'''),

              (r'''LOCALS '= "A pair of eyeglasses to correct vision"''', r'''LOCALS '= "시력을 교정하기 위한 안경 한 쌍이다."'''),
              (r'''LOCALS '= "Sleeves to cover up the wearer's arms."''', r'''LOCALS '= "착용자의 팔을 덮는 소매다."'''),
              (r'''LOCALS '= "Jewelry that is worn around the neck."''', r'''LOCALS '= "목에 착용하는 장신구다."'''),
              (r'''LOCALS '= "A pair of eyeglasses to resist the Sun."''', r'''LOCALS '= "햇빛을 막기 위한 선글라스 한 쌍이다."'''),
              (r'''LOCALS '= "A chain. Place on your neck as a status symbol."''', r'''LOCALS '= "목에 걸어 지위를 드러내는 장식용 사슬이다."'''),
              (r'''LOCALS '= "Short skirt made for sleeping in."''', r'''LOCALS '= "잠잘 때 입도록 만든 짧은 스커트다."'''),
              (r'''LOCALS '= "A skirt with some suspending straps that wrap over the wearer. Helps keep the waist high."''', r'''LOCALS '= "착용자의 몸을 감싸는 멜빵끈이 달린 스커트다. 허리선을 높게 유지하는 데 도움이 된다."'''),
              (r'''LOCALS '= "A long shirt. Perhaps, a bit too long, now that it's a dress and not a shirt."''', r'''LOCALS '= "아주 긴 셔츠 같은 옷이다. 셔츠라기보다는 드레스라고 부를 정도로 길다."'''),
              (r'''LOCALS '= "A simple set of pants. Covers your legs and has pockets for stuff. No risk of upskirts here."''', r'''LOCALS '= "다리를 덮고 물건을 넣을 주머니가 달린 평범한 바지다. 치마가 들릴 걱정은 없다."'''),
              (r'''LOCALS '= "Pants. But short. Perfect for summer."''', r'''LOCALS '= "짧은 바지다. 여름에 입기 딱 좋다."'''),
              (r'''LOCALS '= "A pair of comfy pajama pants. Often victims of nighttime accidents."''', r'''LOCALS '= "편안한 잠옷 바지다. 밤사이 실수의 흔적이 남는 경우도 종종 있다."'''),
              (r'''LOCALS '= "Tightly bound, high waisted, and shows off the wearer's curves."''', r'''LOCALS '= "몸에 꼭 맞는 하이웨이스트 디자인으로 착용자의 몸매를 강조한다."'''),
              (r'''LOCALS '= "Cover's the wearer's legs and chest in one piece. Just that going to the potty might be a bit of a hassle."''', r'''LOCALS '= "한 벌로 착용자의 다리와 가슴을 덮는다. 다만 화장실을 갈 때는 조금 번거로울 수 있다."'''),
              (r'''LOCALS '= "A long traditional skirt. Worn over a kimono designed with hakama in mind."''', r'''LOCALS '= "긴 전통 치마다. 하카마 착용을 고려해 만든 기모노 위에 입는다."'''),
              (r'''LOCALS '= "Designed for laborers. Has lots of deep pockets. And deep is an understatement."''', r'''LOCALS '= "작업자를 위해 만든 바지다. 깊은 주머니가 아주 많이 달려 있으며 정말 깊다."'''),
              (r'''LOCALS '= "A set of tight fitting gym shorts."''', r'''LOCALS '= "몸에 딱 맞는 체육용 반바지다."'''),
              (r'''LOCALS = "Puffy orange pants designed to look like a pumpkin"''', r'''LOCALS = "호박처럼 보이도록 만든 풍성한 주황색 바지"'''),
              (r'''LOCALS '= "Used to cover a damaged or destroyed eye."''', r'''LOCALS '= "다치거나 잃은 눈을 가리는 데 사용한다."'''),
              (r'''LOCALS '= "Helps keep your pants up, tools organized, and weapons holstered."''', r'''LOCALS '= "바지가 흘러내리지 않게 하고 도구를 정리하며 무기를 휴대하는 데 도움을 주는 벨트다."'''),
              (r'''LOCALS '= "Purely decorative, still very cute."''', r'''LOCALS '= "순전히 장식용이지만 그래도 아주 귀엽다."'''),
              (r'''LOCALS = "A shirt formed from many links of steel, also known as mail. Provides basic ballistic protection."''', r'''LOCALS = "수많은 강철 고리를 연결해 만든 셔츠로 체인메일이라고도 한다. 기본적인 탄도 방호 성능을 제공한다."'''),
              (r'''LOCALS '= "IS REAL\nDress that combines a top and a bottom, as well as sleeves. Easy to wear and the usual garb for a Gensokyan."''', r'''LOCALS '= "실존한다\n상의와 하의, 소매가 하나로 이어진 드레스다. 입기 편하며 환상향에서 흔히 볼 수 있는 복장이다."'''),
              (r'''LOCALS = "A one-piece dress that is explicitly colored white, compared to the many other nondescript one-piece dresses."''', r'''LOCALS = "다른 평범한 원피스 드레스와 달리 색상이 명확하게 흰색인 원피스 드레스다."'''),
          ]

          def tokens(s):
              return re.findall(r'%[^%\n]+%|\{[^{}\n]+\}|\\n|\\@', s)

          lines = text.splitlines(keepends=True)
          problems = []
          for old, new in rules:
              hits = [i for i, line in enumerate(lines) if line.rstrip('\r\n').lstrip() == old]
              if len(hits) != 1:
                  problems.append((old, len(hits)))
              if tokens(old) != tokens(new):
                  raise SystemExit(f'token mismatch: {old!r}')
          if problems:
              for old, count in problems:
                  print(f'MISMATCH count={count}: {old}')
              raise SystemExit(f'{len(problems)} rule(s) did not match exactly once')

          for old, new in rules:
              for i, line in enumerate(lines):
                  body = line.rstrip('\r\n')
                  if body.lstrip() != old:
                      continue
                  indent = body[:len(body) - len(body.lstrip())]
                  newline = line[len(body):]
                  lines[i] = indent + new + newline
                  break

          out = ''.join(lines)
          for old, new in rules:
              if any(line.rstrip('\r\n').lstrip() == old for line in out.splitlines(keepends=True)):
                  raise SystemExit(f'old statement remains: {old}')
              if sum(line.rstrip('\r\n').lstrip() == new for line in out.splitlines(keepends=True)) != 1:
                  raise SystemExit(f'new statement count mismatch: {new}')

          path.write_bytes(b'\xef\xbb\xbf' + out.encode('utf-8'))
          print(f'[clothing] translated {len(rules)} display strings')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          target='ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB')
          data = p.read_bytes()
          if not data.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('UTF-8 BOM missing after edit')
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          [[ ${#changed[@]} -eq 1 ]]
          [[ "${changed[0]}" == "$target" ]]
          numstat="$(git diff --numstat -- "$target")"
          echo "$numstat"
          [[ "$numstat" == $'49\t49\t'"$target" ]]

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB'
          git commit -m '의류 UI 일반 표시명 및 설명 4차 한글화 46차'
          git push origin korean

          changed = 0
          for old, new, expected in rules:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'anchor count mismatch for {old!r}: expected {expected}, got {count}')
              text = text.replace(old, new)
              changed += count

          if changed != 51:
              raise SystemExit(f'expected 51 replacements, got {changed}')

          after_counts = {s: text.count(s) for s in protected}
          if before_counts != after_counts:
              raise SystemExit(f'protected schema/token counts changed: before={before_counts} after={after_counts}')

          if 'CALLF MAKE_STR(V_NAME, "fetish baby dress")' not in text:
              raise SystemExit('intentionally skipped age-coded display string changed unexpectedly')

          data = text.encode('utf-8')
          if bom:
              data = b'\xef\xbb\xbf' + data
          target.write_bytes(data)
          print(f'replacements: {changed}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          target='ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB'
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$target" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          read -r additions deletions filename < <(git diff --numstat)
          if [[ "$additions" != "51" || "$deletions" != "51" || "$filename" != "$target" ]]; then
            echo "Unexpected numstat: +$additions -$deletions $filename"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB')
          raw = p.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('BOM was not preserved')
          text = raw.decode('utf-8-sig')
          required = [
              '빨간 반투명 라텍스 페티시 드레스', '백리스 네글리제',
              '분홍 고무 『플라스틱은 환상적이야』 드레스', '여사제 의상',
              '체인메일 상의', '크롭 탑', '방탄 셔츠', '중간 수준의 탄도 방호 성능을 제공한다.',
              '당당한 기저귀 애호가라는 사실을 세상에 보여 준다.',
              '엉덩이 노출형 바지', '테디베어 팬티스타킹', '방탄 바지',
              '라텍스 스커트', '도발적인 가죽 스커트'
          ]
          for s in required:
              if s not in text:
                  raise SystemExit(f'missing translated anchor: {s}')
          forbidden = [
              'CALLF MAKE_STR(V_NAME, "red translucent latex fetish dress")',
              'CALLF MAKE_STR(V_NAME, "backless negligee")',
              'CALLF MAKE_STR(V_NAME, "crop top")',

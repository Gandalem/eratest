              ('CALLF MAKE_STR(V_NAME, "black fetish hobble dress")', 'CALLF MAKE_STR(V_NAME, "검정 페티시 호블 드레스")', 1),
              ('CALLF MAKE_STR(V_NAME, "purple fetish hobble dress")', 'CALLF MAKE_STR(V_NAME, "보라색 페티시 호블 드레스")', 1),
              ('CALLF MAKE_STR(V_NAME, "assless fetish hobble dress")', 'CALLF MAKE_STR(V_NAME, "엉덩이 노출형 페티시 호블 드레스")', 1),
              ('CALLF MAKE_STR(V_NAME, "assless fetish dress")', 'CALLF MAKE_STR(V_NAME, "엉덩이 노출형 페티시 드레스")', 1),
              ('CALLF MAKE_STR(V_NAME, "pink translucent fetish dress")', 'CALLF MAKE_STR(V_NAME, "분홍 반투명 페티시 드레스")', 1),

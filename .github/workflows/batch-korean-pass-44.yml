              ('CALLF MAKE_STR(V_NAME, "latex bunny waitress outfit")', 'CALLF MAKE_STR(V_NAME, "라텍스 바니 웨이트리스 의상")', 1),
              ('CALLF MAKE_STR(V_NAME, "pink latex royal dress")', 'CALLF MAKE_STR(V_NAME, "분홍 라텍스 왕실 드레스")', 1),
              ('CALLF MAKE_STR(V_NAME, "priestess outfit")', 'CALLF MAKE_STR(V_NAME, "여사제 의상")', 1),
              ('CALLF MAKE_STR(V_NAME, "slave dress")', 'CALLF MAKE_STR(V_NAME, "노예 드레스")', 1),


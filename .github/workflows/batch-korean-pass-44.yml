              ('CALLF MAKE_STR(V_NAME, "flimsy pink nightie")', 'CALLF MAKE_STR(V_NAME, "얇은 분홍 잠옷")', 1),
              ('CALLF MAKE_STR(V_NAME, "hook and loop onesie")', 'CALLF MAKE_STR(V_NAME, "벨크로 원지")', 1),
              ('CALLF MAKE_STR(V_NAME, "elephant onesie")', 'CALLF MAKE_STR(V_NAME, "코끼리 원지")', 1),
              ('CALLF MAKE_STR(V_NAME, "cupcake onesie")', 'CALLF MAKE_STR(V_NAME, "컵케이크 원지")', 1),
              ('CALLF MAKE_STR(V_NAME, "open front dress")', 'CALLF MAKE_STR(V_NAME, "앞트임 드레스")', 1),

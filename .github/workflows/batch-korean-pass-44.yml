              ('CALLF MAKE_STR(V_NAME, "jeans")', 'CALLF MAKE_STR(V_NAME, "청바지")', 1),
              ('CALLF MAKE_STR(V_NAME, "latex pants")', 'CALLF MAKE_STR(V_NAME, "라텍스 바지")', 1),
              ('CALLF MAKE_STR(V_NAME, "nylon leggings")', 'CALLF MAKE_STR(V_NAME, "나일론 레깅스")', 1),
              ('CALLF MAKE_STR(V_NAME, "yoga pants")', 'CALLF MAKE_STR(V_NAME, "요가 바지")', 1),
              ('CALLF MAKE_STR(V_NAME, "V-crotch jeans")', 'CALLF MAKE_STR(V_NAME, "V크로치 청바지")', 1),
              ('CALLF MAKE_STR(V_NAME, "teddy bear pantyhose")', 'CALLF MAKE_STR(V_NAME, "테디베어 팬티스타킹")', 1),
              ('CALLF MAKE_STR(V_NAME, "sweat pants")', 'CALLF MAKE_STR(V_NAME, "스웨트팬츠")', 1),
              ('CALLF MAKE_STR(V_NAME, "ballistic pants")', 'CALLF MAKE_STR(V_NAME, "방탄 바지")', 1),

              ('CALLF MAKE_STR(V_NAME, "latex skirt")', 'CALLF MAKE_STR(V_NAME, "라텍스 스커트")', 1),
              ('CALLF MAKE_STR(V_NAME, "micro skirt")', 'CALLF MAKE_STR(V_NAME, "마이크로 스커트")', 1),
              ('CALLF MAKE_STR(V_NAME, "naughty leather skirt")', 'CALLF MAKE_STR(V_NAME, "도발적인 가죽 스커트")', 1),

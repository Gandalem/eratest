              ('CALLF MAKE_STR(V_NAME, "LUNINCO Ballistic Shirt「PlasShirt」")', 'CALLF MAKE_STR(V_NAME, "LUNINCO 방탄 셔츠「PlasShirt」")', 1),
              ('CALLF MAKE_STR(V_NAME, @"A long-sleeved shirt made with a ballistic plasteel weave, keeping style while also acting as intermediate ballistic protection.")', 'CALLF MAKE_STR(V_NAME, @"방탄 플라스틸 직조 소재로 만든 긴팔 셔츠로, 스타일을 유지하면서 중간 수준의 탄도 방호 성능을 제공한다.")', 1),

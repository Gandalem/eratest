              (84, 'OSP-81 Nizhny Novgorod 9.8in (249mm) Smoothbore Single-Shot 23x75mmR Barrel', 'OSP-81 니즈니 노브고로드 9.8인치 (249mm) 23x75mmR 활강 단발 총열'),
              (85, 'Broughton Automatic Rifle 24in (610mm) Barrel', '브라우턴 자동소총 24인치 (610mm) 총열'),
              (86, 'Youjyuu-P Keiga 6 in (152 mm) Youjutsu energy amplifier', '요주-P 케이가 6인치 (152mm) 요술 에너지 증폭기'),
              (87, 'LAC2 LUNINCO 6 in (152 mm) Flash Tube', 'LAC2 루닌코 6인치 (152mm) 플래시 튜브'),
              (88, 'Summers AImthropic 4in (102mm) Barrel', '서머스 에임스로픽 4인치 (102mm) 총열'),
              (89, 'LAC666 LUNINCO 4in (102mm) Youjutsu energy amplifier', 'LAC666 루닌코 4인치 (102mm) 요술 에너지 증폭기'),
              (90, 'LAC666 LUNINCO 10.5in (266mm) Youjutsu energy amplifier', 'LAC666 루닌코 10.5인치 (266mm) 요술 에너지 증폭기'),
              (91, 'Tanhiken Akatsuki 8in (203mm) barrel', '탄히켄 아카츠키 8인치 (203mm) 총열'),

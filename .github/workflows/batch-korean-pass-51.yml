              (95, 'Lolife 10.5in (265mm) barrel', '로라이프 10.5인치 (265mm) 총열'),
              (96, 'GH31 Gabe Hubert 17.7in (450mm) Barrel', 'GH31 게이브 휴버트 17.7인치 (450mm) 총열'),
              (97, 'GH21 Gabe Hubert Heavy 17.7in (450mm) Barrel', 'GH21 게이브 휴버트 헤비 17.7인치 (450mm) 총열'),
              (98, 'GH91/SG1 Gabe Hubert precision 25.6in (650mm) Barrel', 'GH91/SG1 게이브 휴버트 정밀형 25.6인치 (650mm) 총열'),
              (99, 'Vandal Kappa Armory 14.5in (368mm) Barrel', '밴달 캇파 아머리 14.5인치 (368mm) 총열'),
              (100, 'Youjyuu-R Keiga 14.5in (368mm) Youjutsu energy amplifier', '요주-R 케이가 14.5인치 (368mm) 요술 에너지 증폭기'),
              (101, 'Stinger KappaArmory 8.5in (216mm) Barrel', '스팅어 캇파 아머리 8.5인치 (216mm) 총열'),
              (102, 'Shaman AImthropic 8in (204mm) Barrel', '샤먼 에임스로픽 8인치 (204mm) 총열'),
              (103, 'Xavier AImthropic 12in (305mm) Barrel', '자비에르 에임스로픽 12인치 (305mm) 총열'),
          ]
          if len(rules) != 50:
              raise SystemExit(f'expected 50 rules, got {len(rules)}')

          protected = ['名前', '描写', 'ShortName', '装備部位', 'Barrel', 'Damage', 'Accuracy', 'Burst', 'Length', 'Platform', 'Price']
          before_counts = {k: before.count(f'CASE "{k}"') for k in protected}

          func_re = re.compile(r'^@WeaponBarrelBody(\d+)\(ARG, O_DATA, V_NAME\)\s*$', re.M)

          for barrel_id, old, new in rules:
              matches = list(func_re.finditer(text))
              target = None
              for i, m in enumerate(matches):
                  if int(m.group(1)) == barrel_id:
                      end = matches[i + 1].start() if i + 1 < len(matches) else len(text)
                      target = (m.start(), end)
                      break
              if target is None:
                  raise SystemExit(f'WeaponBarrelBody{barrel_id} not found')
              start, end = target
              block = text[start:end]
              old_line = f'CALLF MAKE_STR(V_NAME, "{old}")'
              new_line = f'CALLF MAKE_STR(V_NAME, "{new}")'
              count = block.count(old_line)
              if count != 1:
                  raise SystemExit(f'ID {barrel_id}: expected old name once, got {count}: {old}')
              block = block.replace(old_line, new_line, 1)
              if old_line in block or block.count(new_line) != 1:
                  raise SystemExit(f'ID {barrel_id}: replacement verification failed')
              text = text[:start] + block + text[end:]

          after_counts = {k: text.count(f'CASE "{k}"') for k in protected}
          if before_counts != after_counts:
              raise SystemExit(f'protected CASE counts changed: {before_counts} -> {after_counts}')

          p.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          print(f'[barrels] translated {len(rules)} display names')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          TARGET='ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrels.ERB'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrels.ERB')
          raw = p.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('UTF-8 BOM missing after edit')
          PY
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$TARGET" ]; then
            printf 'unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          read -r add del file < <(git diff --numstat -- "$TARGET")
          if [ "$add" != '50' ] || [ "$del" != '50' ] || [ "$file" != "$TARGET" ]; then
            echo "unexpected numstat: $add $del $file"
            exit 1
          fi
          echo '[validate] single file +50/-50, BOM and diff-check OK'

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrels.ERB'
          git commit -m '총열 UI 표시명 2차 한글화 51차'
          git push origin HEAD:korean

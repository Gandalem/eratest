              (66, 'SVB Gryzov 24.4 in (620 mm) Barrel', 'SVB 그리즈보프 24.4인치 (620mm) 총열'),
              (67, 'Rasp TB Maestro 26in (660mm) Smoothbore Side-By-Side Double-Shot Barrel', '라스프 TB 마에스트로 26인치 (660mm) 수평쌍대 활강 2연발 총열'),
              (68, 'LAC1 LUNINCO 25.9 in (657 mm) Flash Tube', 'LAC1 루닌코 25.9인치 (657mm) 플래시 튜브'),
              (69, 'LAC17 LUNINCO 25.9 in (657 mm) Barrel', 'LAC17 루닌코 25.9인치 (657mm) 총열'),
              (70, 'Harlot BLC 1.5in (38 mm) Barrel', '할롯 BLC 1.5인치 (38mm) 총열'),
              (71, 'S2000 Broughton 7.62x51mm 26 in (660 mm) Barrel', 'S2000 브라우턴 7.62x51mm 26인치 (660mm) 총열'),
              (72, 'M2000 Broughton 7.62x51mm 26 in (660 mm) HBAR Barrel', 'M2000 브라우턴 7.62x51mm 26인치 (660mm) HBAR 총열'),
              (73, 'M2010 Broughton 7.62x67mmRB 26 in (660 mm) HBAR Barrel', 'M2010 브라우턴 7.62x67mmRB 26인치 (660mm) HBAR 총열'),
              (74, 'Minisa High-Ground 18.3in (465mm) Barrel', '미니사 하이그라운드 18.3인치 (465mm) 총열'),

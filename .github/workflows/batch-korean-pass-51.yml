              (78, 'S333 Windurger 6.5in (170mm) Barrel', 'S333 윈더거 6.5인치 (170mm) 총열'),
              (79, 'RRS Super Point 1.87in (48mm) Barrel', 'RRS 슈퍼 포인트 1.87인치 (48mm) 총열'),
              (80, 'M692 Broughton 6.5in (165mm) Barrel', 'M692 브라우턴 6.5인치 (165mm) 총열'),
              (81, 'RTFM Tricorne 6in (152mm) Barrel', 'RTFM 트라이코르네 6인치 (152mm) 총열'),

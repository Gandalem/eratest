              (61, 'SLR High Ground 18in (458mm) Barrel', 'SLR 하이그라운드 18인치 (458mm) 총열'),
              (62, 'SLR High Ground 17.2in (436mm) Barrel', 'SLR 하이그라운드 17.2인치 (436mm) 총열'),

name: Batch Korean pass 56

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-56.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Translate weapon preset UI strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_WeaponPresets.ERB')
          raw = p.read_bytes()
          assert raw.startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM missing before edit'
          text = raw.decode('utf-8-sig')
          original = text

          rules = [
              (12, 'Name', "Nue's trident", '누에의 삼지창'),
              (12, 'FullName', 'Tatara Trident「Trishula Kai-Ni」', '타타라 삼지창「Trishula Kai-Ni」'),
              (12, 'FullName', "Nue's trident", '누에의 삼지창'),
              (12, 'Description', "Nue's personal melee weapon, enhanced by Karakasa obake. It's sharper and more accurate than regular ones. Does radiation damage thanks to it.", '카라카사 오바케의 손으로 강화된 누에의 개인 근접무기다. 일반적인 삼지창보다 더 날카롭고 정밀하며, 강화의 영향으로 방사선 피해를 준다.'),

              (13, 'Name', '.30-cal musket', '.30구경 머스킷'),
              (13, 'FullName', 'Rika\'s Arms \\"Breach-Hiken .30\\" musket', '리카 암즈 「Breach-Hiken .30」 머스킷'),
              (13, 'FullName', '.30-cal musket', '.30구경 머스킷'),
              (13, 'Description', 'The Breach-Hiken is a retrofit of the musket that turns it into a bolt-action that loads at the breach. It feeds .308 Windurger catridges and is easilly reloaded.', 'Breach-Hiken은 머스킷을 약실에서 장전하는 볼트액션식으로 개조한 모델이다. .308 윈더거 탄약을 사용하며 재장전이 쉽다.'),

              (14, 'Name', '.50-cal musket', '.50구경 머스킷'),
              (14, 'FullName', 'Rika\'s Arms \\"Breach-Hiken .50\\" musket', '리카 암즈 「Breach-Hiken .50」 머스킷'),
              (14, 'FullName', '.50-cal musket', '.50구경 머스킷'),
              (14, 'Description', "The Breach-Hiken is a retrofit of the musket that turns it into a bolt-action that loads at the breach. Unlike it's little brother, this uses 12.7x99mm catridges and has quite the recoil. It however does much more damage.", 'Breach-Hiken은 머스킷을 약실에서 장전하는 볼트액션식으로 개조한 모델이다. 동생 격인 .30형과 달리 12.7x99mm 탄약을 사용해 반동이 상당히 크지만, 그만큼 피해량도 훨씬 높다.'),

              (15, 'Name', "Yorihime's sword", '요리히메의 검'),
              (15, 'FullName', 'Tatara Youkai Katana「Cut-Brush Kai-Ni」', '타타라 요괴 카타나「Cut-Brush Kai-Ni」'),
              (15, 'FullName', "Yorihime's sword", '요리히메의 검'),
              (15, 'Description', "Yorihime's personal melee weapon, enhanced by Karakasa obake. Yorihime asked for a sharper, easier to control blade that didn't just do conventional damage. This blade delivers .", '카라카사 오바케의 손으로 강화된 요리히메의 개인 근접무기다. 요리히메는 단순한 물리 피해에 그치지 않으면서 더 날카롭고 다루기 쉬운 칼날을 원했다.'),

              (103, 'Name', 'double-barrel shotgun', '쌍열 산탄총'),
              (103, 'FullName', 'Kappa Armory \\"Defender-Duo\\" double-barrel shotgun', '캇파 아머리 「Defender-Duo」 쌍열 산탄총'),
              (103, 'FullName', 'double-barrel shotgun', '쌍열 산탄총'),
              (103, 'Description', 'The YKMA Defender-Duo is a break-action shotgun manufactured by the Youkai Mountain Kappa Armory, based on the Windurger B7 system. Like the regular Defender, but has two barrels instead of one, meaning double the shots before having to reload.', 'YKMA Defender-Duo는 윈더거 B7 시스템을 기반으로 요괴의 산 캇파 아머리에서 제작한 중절식 산탄총이다. 일반 Defender와 비슷하지만 총열이 두 개라 재장전 전까지 두 발을 연속으로 쏠 수 있다.'),

              (104, 'Name', 'triple-barrel shotgun', '삼열 산탄총'),
              (104, 'FullName', 'Kappa Armory \\"Defender-Trio\\" triple-barrel shotgun', '캇파 아머리 「Defender-Trio」 삼열 산탄총'),
              (104, 'FullName', 'triople-barrel shotgun', '삼열 산탄총'),
              (104, 'Description', 'The YKMA Defender-Trio is a break-action shotgun manufactured by the Youkai Mountain Kappa Armory, based on the Windurger B7 system. Like the regular Defender, but has three barrels instead of one, meaning triple the shots before having to reload.', 'YKMA Defender-Trio는 윈더거 B7 시스템을 기반으로 요괴의 산 캇파 아머리에서 제작한 중절식 산탄총이다. 일반 Defender와 비슷하지만 총열이 세 개라 재장전 전까지 세 발을 연속으로 쏠 수 있다.'),

              (105, 'Name', 'repeating break-action shotgun', '연발 중절식 산탄총'),
              (105, 'FullName', 'Windurger \\"Model B714\\" Break-Action Shotgun', '윈더거 「B714」 중절식 산탄총'),
              (105, 'FullName', 'repeating break-action shotgun', '연발 중절식 산탄총'),
              (105, 'Description', 'The B714 is a conversion for the Windurger B7 single shot shotgun that converts it into a 4+1 repeating break-action shotgun. While inferrior compared to more advanced solutions like the Broughton S1000 shotgun, the B714 was cheap and reliable, however wasnt very popular.', 'B714는 윈더거 B7 단발 산탄총을 4+1발 연발 중절식으로 개조한 형식이다. 브라우턴 S1000 같은 더 발전된 방식보다는 뒤떨어졌지만 저렴하고 신뢰성이 높았다. 다만 큰 인기를 얻지는 못했다.'),

              (106, 'Name', 'cryolator', '극저온 방사기'),
              (106, 'FullName', 'Rika\'s Arms \\"Vafthruthnir\\" cryolator', '리카 암즈 「Vafthruthnir」 극저온 방사기'),
              (106, 'FullName', 'cryolator', '극저온 방사기'),
              (106, 'Description', 'The Vafthruthnir is a variation of the Loki, carrying cold liquid nitrogen instead of gasoline. ', 'Vafthruthnir는 Loki의 변형으로, 휘발유 대신 차가운 액체 질소를 탑재한다. '),

              (107, 'Name', 'CQB pistol', 'CQB 권총'),
              (107, 'FullName', 'Tricorne \\"CQB25-A\\" machine pistol', '트라이코르네 「CQB25-A」 기관권총'),
              (107, 'FullName', 'CQB pistol', 'CQB 권총'),
              (107, 'Description', 'Law enforcement model of the CCW15, complete with extended magazine and full-auto capibility. While the CCW15 was focused on concealability and thinness, the CQB25-A focuses on packing as much firepower while still fitting in a open-carry CCW15 holster. Because it is designed to be open carried, the CCW designation was dropped for a more combat purposed CQB designation. There is also a mount at the rear of the grip for a regular M600-series buffer tube and stock.', 'CCW15의 법집행기관용 모델로, 연장 탄창과 완전자동 기능을 갖췄다. CCW15가 은닉성과 얇은 두께에 중점을 뒀다면 CQB25-A는 개방형 CCW15 홀스터에 들어가는 범위에서 최대한의 화력을 확보하는 데 초점을 맞췄다. 공개 휴대를 전제로 설계되어 CCW 명칭 대신 전투 목적의 CQB 명칭을 사용한다. 그립 후면에는 일반 M600 계열 버퍼 튜브와 개머리판을 장착할 수 있는 마운트도 있다.'),
          ]
          assert len(rules) == 36

          func_re = re.compile(r'^@WeaponPreset(\d+)\(ARG, O_DATA, V_NAME\)\s*$', re.M)

          def function_span(src, item_id):
              matches = list(func_re.finditer(src))
              for i, m in enumerate(matches):
                  if int(m.group(1)) == item_id:
                      end = matches[i + 1].start() if i + 1 < len(matches) else len(src)
                      return m.start(), end
              raise AssertionError(f'function not found: WeaponPreset{item_id}')

          protected_keys = [
              '装備部位', 'Tags', 'Platform', 'Manufacturer', 'Base Weapon',
              'WeaponReceiver/Required', 'WeaponReceiver/Default',
              'WeaponBarrelBody/Required', 'WeaponBarrelBody/Default',
              'WeaponBlade/Required', 'WeaponGrip/Default', 'WeaponGrip/Required',
              'WeaponMag/Required', 'WeaponMag/Default', 'WeaponStock/Default',
              'Quest Only'
          ]
          before_counts = {k: original.count(f'CASE "{k}"') for k in protected_keys}

          for item_id, field, old, new in rules:
              fstart, fend = function_span(text, item_id)
              block = text[fstart:fend]
              case_matches = list(re.finditer(r'^\s*CASE "([^"]+)"\s*$', block, re.M))
              target = None
              for i, cm in enumerate(case_matches):
                  if cm.group(1) == field:
                      cend = case_matches[i + 1].start() if i + 1 < len(case_matches) else len(block)
                      target = (cm.end(), cend)
                      break
              assert target is not None, f'CASE {field} not found in WeaponPreset{item_id}'
              cstart, cend = target
              cblock = block[cstart:cend]
              old_stmt = f'CALLF MAKE_STR(V_NAME, "{old}")'
              new_stmt = f'CALLF MAKE_STR(V_NAME, "{new}")'
              count = cblock.count(old_stmt)
              assert count == 1, f'WeaponPreset{item_id} {field}: expected 1 old value, got {count}: {old!r}'
              cblock = cblock.replace(old_stmt, new_stmt, 1)
              block = block[:cstart] + cblock + block[cend:]
              text = text[:fstart] + block + text[fend:]

          after_counts = {k: text.count(f'CASE "{k}"') for k in protected_keys}
          assert before_counts == after_counts, (before_counts, after_counts)

          eng = re.compile(r'[A-Za-z]{2,}')
          hangul = re.compile(r'[가-힣]')
          wanted = {'Name', 'FullName', 'Description'}
          remaining = []
          starts = list(func_re.finditer(text))
          for idx, m in enumerate(starts):
              item_id = int(m.group(1))
              end = starts[idx + 1].start() if idx + 1 < len(starts) else len(text)
              block = text[m.start():end]
              case_matches = list(re.finditer(r'^\s*CASE "([^"]+)"\s*$', block, re.M))
              for ci, cm in enumerate(case_matches):
                  field = cm.group(1)
                  if field not in wanted:
                      continue
                  cend = case_matches[ci + 1].start() if ci + 1 < len(case_matches) else len(block)
                  cblock = block[cm.end():cend]
                  for sm in re.finditer(r'CALLF MAKE_STR\(V_NAME,\s*(?:@)?"((?:\\.|[^"\\])*)"\)', cblock):
                      value = sm.group(1)
                      if eng.search(value) and not hangul.search(value):
                          remaining.append((item_id, field, value))

          expected_remaining = [
              (1, 'Name', 'HK33'), (1, 'Name', 'GH33'),
              (2, 'Name', 'HK54'), (2, 'Name', 'GH54'),
              (3, 'Name', 'PSG-1'), (3, 'Name', 'GH91/SG1'),
              (4, 'Name', 'LAC36'),
              (5, 'Name', 'Machinma-G'), (6, 'Name', 'Machinma-D'),
              (7, 'Name', 'Machinma-C'), (8, 'Name', 'Machinma-B'),
              (9, 'Name', 'Machinma-A'), (10, 'Name', 'Machinma-S'),
              (11, 'Name', 'EX-Machinma'),
              (12, 'Name', 'Trishula Kai-Ni'),
              (13, 'Name', 'Breach-Hiken .30'),
              (14, 'Name', 'Breach-Hiken .50'),
              (15, 'Name', 'Cut-Brush Kai-Ni'),
              (103, 'Name', 'Defender-Duo'),
              (104, 'Name', 'Defender-Trio'),
              (106, 'Name', 'Vafthruthnir'),
              (107, 'Name', 'CQB25-A'),
          ]
          assert sorted(remaining) == sorted(expected_remaining), f'unexpected untranslated UI: {remaining}'

          p.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          assert p.read_bytes().startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM missing after edit'
          print(f'REPLACEMENTS={len(rules)}')
          print(f'REMAINING_MODEL_ONLY={len(remaining)}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_WeaponPresets.ERB"
          read -r add del < <(git diff --numstat -- "${changed[0]}" | awk '{print $1, $2}')
          test "$add" -eq 36
          test "$del" -eq 36
          echo "validated: one file +36/-36"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_WeaponPresets.ERB"
          git commit -m "무기 프리셋 UI 이름 및 설명 2차 한글화 56차"
          git push origin HEAD:korean

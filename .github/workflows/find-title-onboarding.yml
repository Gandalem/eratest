name: Find title onboarding strings

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/find-title-onboarding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false
      - name: Find title and onboarding strings
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MATCHES ==='
          grep -RIn --include='*.ERB' --include='*.ERH' -E 'NAS_NewGame_Onboarding|Sexual Content|Excretion Content|Physical Harm|Additional Features|Live your life in the World of Fantasy|DEV QUICKTEST|Start Game|Load Save' ERB || true
          echo '=== ONBOARDING FUNCTION CONTEXT ==='
          MATCH=$(grep -RIl --include='*.ERB' --include='*.ERH' 'NAS_NewGame_Onboarding' ERB | head -n 20 || true)
          for f in $MATCH; do
            echo "--- $f ---"
            grep -n -A220 -B20 'NAS_NewGame_Onboarding' "$f" || true
          done

name: Batch Korean pass 04

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate Be Free visible text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Be Free.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          reps = [
            ('Next stage license', '다음 스테이지 라이선스'),
            ('How can I get a license to move on to the next stage?', '다음 스테이지로 넘어가는 라이선스는 어떻게 얻어?'),
            ('Practicing against rivals?', '라이벌 상대로 연습하기?'),
            ("I keep getting my ass kicked by this one dude and the other rivals are too easy to the point I don't learn anything out of them. Is there a better way to get experience?", '한 녀석한테는 계속 박살 나고, 다른 라이벌들은 너무 쉬워서 경험이 안 쌓여. 더 좋은 연습 방법 없어?'),
            ('Ammo', '탄약'),
            ("You think I should change what ammo I'm using...?", '쓰는 탄약을 바꿔 보는 게 좋을까...?'),
            ('Well maybe go get yourself a rifle that can go through those ballistic vests instead.', '그 방탄조끼를 뚫을 수 있는 소총을 구하는 것도 방법이겠네.'),
            ('Holding it in a fight?', '전투 중 참는 게 좋아?'),
            ('Someone suggested that I should drink lots of water and hold my pee in when I battle. Has anybody ever tried this?', '물을 잔뜩 마시고 소변을 참은 채 싸우면 좋다는 얘길 들었는데, 해 본 사람 있어?'),
            ("You'll deal more damage if you fight when your bladder's (and/or bowels) bursting, but don't get hit! You'll utterly soil yourself!", '방광이나 장이 한계에 가까울 때 싸우면 더 큰 피해를 줄 수 있어. 하지만 맞지 마! 그러다 실수할 수 있어!'),
            ("The rival that I'm fighting keeps chanting this and it keeps making me pee myself! I can't focus and it hurts afterwards! How do I stop this from happening!", '지금 싸우는 라이벌이 계속 이 주문을 외우는데 그때마다 소변을 지리게 돼! 집중도 안 되고 끝나고 나면 아파! 이걸 어떻게 막아?'),
            ('I wear ComfiDrys to bed to deal with my bedwetting issues, do you think those will be enough? Even the ComfiDrys feel thick compared to the pull-ups that I use during the day.', '야뇨 때문에 잘 때 ComfiDrys를 쓰는데 이걸로 충분할까? 낮에 쓰는 풀업에 비하면 ComfiDrys도 꽤 두껍게 느껴져.'),
            ("I never had the best experience with regular ComfiDrys, they always seem to leak when I use them at night. From what I've seen they can absorb an Oureindyne, but you're better with the Good Nighter model or a Gensou-chan.", '일반 ComfiDrys는 밤에 쓰면 자꾸 새서 별로였어. Oureindyne 정도는 버틸 수 있어 보이지만 Good Nighter 모델이나 Gensou-chan 쪽이 더 나아.'),
            ('My bed...', '내 침대...'),
            ('So... uh. I woke up with my clothes soaked and bed smelling like pee. What happened? Did I pee in my sleep?', '그러니까... 일어났더니 옷은 젖어 있고 침대에서는 소변 냄새가 나. 무슨 일이 있었던 거지? 자다가 실수한 건가?'),
            ('Yes. You did wet your bed. Sometimes that just happens, especially after a lucid dream or YumeDance. Take a bath, clean the sleets, and empty the rest of your bladder in a toilet.', '응. 자다가 실수한 거야. 가끔 그럴 수 있어. 특히 자각몽이나 YumeDance 뒤에는 더 그렇고. 목욕하고 침구를 정리한 다음 화장실에서 남은 소변도 비워.'),
            ("Well that's embarrassing. Is there a way to keep my bed dry. My sheets have a faint yellow stain and it makes me blush so hard.", '부끄럽네... 침대를 젖지 않게 할 방법은 없어? 시트에 옅은 노란 얼룩까지 생겨서 너무 민망해.'),
            ("Do you think a Panman would be fine? They're cute and look comfortable.", 'Panman이면 괜찮을까? 귀엽고 편해 보이던데.'),
            ("So according to this list I would be best with the ComfiDrys? They look comfortable but I haven't worn tape-ons since I was a toddler.", '이 목록대로면 나한테는 ComfiDrys가 가장 맞는 거야? 편해 보이긴 하는데 테이프형은 아주 어릴 때 이후로 써 본 적이 없어.'),
            ("Yep. The ComfiDrys should be fine for your amount of leakage. The GNs have the nice crinkly backing but they aren't necessary.", '응. 네 정도의 누출량이면 ComfiDrys로 충분해. GN은 바스락거리는 외피가 좋긴 하지만 꼭 필요하진 않아.'),
            ('Power and nothing else', '화력만 좋고 나머진 별로'),
            ("My Operator's powerful, that's all. It can't hit the side of a barn... ", '내 Operator는 위력만 좋아. 명중률은 정말 형편없어... '),
            ('SPA Fan Club', 'SPA 팬클럽'),
            ('Anyone else love their ArmTeck SPAs, or well, at least this \\"Youkai Mountain Kappa Armory Vandal\\" copy that I have? I find mine useful and prefer it over Danmaku since I can take shots at way farther distances. Turns out .223 Broughton is also better at penetrating armor too, which becomes an issue at higher Stages.', 'ArmTeck SPA 좋아하는 사람 또 있어? 적어도 내가 가진 \\"Youkai Mountain Kappa Armory Vandal\\" 복제품은 꽤 마음에 들어. 탄막보다 훨씬 먼 거리에서 사격할 수 있어서 더 자주 쓰게 돼. .223 Broughton은 방어구 관통력도 더 좋아서 높은 스테이지에서 특히 유용하고.'),
            ("I tried a Vandal but I couldn't stand the constant need to reload. Too used to my LAC1 where I can just hold the trigger.", 'Vandal도 써 봤는데 계속 재장전해야 하는 게 너무 답답했어. 방아쇠만 계속 당기면 되는 LAC1에 너무 익숙해졌나 봐.'),
            ('Get the YouMag for STANAG magazines. It allows you to use Youjutsu essence instead of conventional bullets.', 'STANAG 탄창용 YouMag을 구해. 일반 탄환 대신 요술 에센스를 사용할 수 있어.'),
            ("Maybe I should get one. These laser guns work great on LUNA but not on ERTH, so I'm looking into something more conventional. The LAC17s that the Lunar Capital give us for ERTH deployments absolutely suck.", '하나 구해 봐야겠네. 레이저 무기는 LUNA에서는 잘 통하지만 ERTH에서는 별로라서 좀 더 일반적인 무기를 알아보는 중이야. 월면 도시가 ERTH 배치용으로 주는 LAC17은 정말 형편없고.'),
            ("I tried to get one but they're locked until Stage 3! So frustrating since there's barely anything modern for Stage 1.", '구해 보려고 했는데 스테이지 3까지 잠겨 있더라! 스테이지 1에서 쓸 만한 현대식 장비가 거의 없어서 답답해.'),
            ('I AM BROKE', '나 완전 빈털터리야'),
            ('Please come to my shrine and donate me some money :c', '내 신사에 와서 돈 좀 기부해 줘 :c'),
            ("Just sell some cinnabar to Eientei or something! It's not that hard to find! Or go gamble at the Scarlet Casino! With your luck, you'll probably win nothing but jackpots..", '진사 좀 구해서 영원정에 팔면 되잖아! 찾기 그렇게 어렵지도 않아! 아니면 홍마 카지노에서 도박을 하든가. 네 운이면 잭팟만 터질지도 모르지..'),
            ("Sir, you're shrine is in Stage 6. I would be glad to dump a ton on your shrine but I'm a lone stage 2 peasant. Anyway, go beat up some rivals. They give some decent money.", '당신 신사는 스테이지 6에 있잖아요. 갈 수만 있다면 잔뜩 기부하고 싶지만 전 혼자 다니는 스테이지 2 평민이라고요. 아무튼 라이벌을 좀 쓰러뜨려 봐요. 돈을 꽤 줍니다.'),
            ('Did you go and get your money by selling those dumped weapons from the ravine? YMKA is so wasteful.', '협곡에 버려진 무기를 주워 팔아서 돈을 마련해 보는 건 어때? YMKA는 정말 낭비가 심해.'),
            ('I also harvest the organs off my downed enemies. Don\'t worry, they come back after the day perfectly fine.', '난 쓰러뜨린 적에게서 장기도 회수해. 걱정 마, 하루가 지나면 멀쩡하게 돌아오니까.'),
            ('Is that a threat?', '그거 협박이야?'),
            ('Need healing', '치료가 필요해'),
            ('I got in a fight and got hurt quite badly. Is there a way to patch myself up?', '싸우다가 꽤 심하게 다쳤어. 치료할 방법이 있을까?'),
            ("Wow, that's a lot. Is there a way to learn how to do healing magic though?", '와, 알아둘 게 많네. 그런데 회복 마법은 어떻게 배우지?'),
            ('What about that Marketeers insurance thing, did they shut down?', '그 Marketeers 보험은 어떻게 됐어? 문 닫았나?'),
            ("Chimata says that she isn't going to insure fighters, even though she would be making a killing in medical fees and keeping up alive.", '치마타가 파이터는 보험 가입을 안 받아 준대. 의료비로 큰돈을 벌면서 사람들을 살려 둘 수도 있을 텐데 말이야.'),
            ('Clothing store diaper question', '의류점 상품 사용 횟수 질문'),
            ('If I buy a diaper from the clothing store, how times can I use it?', '의류점에서 산 상품은 몇 번이나 사용할 수 있어?'),
            ('Infinitely. Buying a diaper from the clothing store allows you to use infinite copies of it.<br>This also applies to all other types of clothing too.', '무제한이야. 의류점에서 한 번 구매하면 같은 상품을 계속 사용할 수 있어.<br>다른 종류의 의류도 마찬가지야.'),
            ('Trash can stinks', '쓰레기통 냄새가 너무 심해'),
            ("And what if my diaper pail hits it's limit? What do I do then?", '전용 수거통이 꽉 차면 어떡해?'),
            ('Buy another! Or you can upgrade them too. Nitori sells upgrades for the diaper pails.', '하나 더 사! 아니면 업그레이드해도 돼. 니토리가 전용 수거통 업그레이드를 팔아.')
          ]

          total = 0
          for old, new in reps:
              count = text.count(old)
              if count:
                  text = text.replace(old, new)
                  total += count
                  print('REPLACED', count, old[:70])

          if total < 25:
              raise SystemExit(f'Too few replacements: {total}')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          print('TOTAL', total)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git diff -U0 | grep -E '^[-+].*@DanmakuWorldEntry_' || { echo 'Function declaration changed'; exit 1; }
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Be Free.ERB'
          git commit -m 'Be Free 단어 및 게시글 한글화 4차'
          git push origin HEAD:korean

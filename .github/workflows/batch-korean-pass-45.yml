name: Batch Korean pass 45

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-45.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate clothing display strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB')
          raw = target.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          protected = [
              'CASE "名前"', 'CASE "FullName"', 'CASE "FullDesc"',
              'CASE "装備部位"', 'CASE "Price"', 'CASE "Tags"',
              'CASE "Grade"', 'CASE "Armor"', 'CASE "Armor Health"',
              'CASE "Armor Coverage"', 'CASE "Shows Panties"',
              'PlasSkirt', 'PlasShirt', 'PlasShort'
          ]
          before_counts = {s: text.count(s) for s in protected}

          rules = [
              ('''CALLF MAKE_STR(V_NAME, "『5318008』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『5318008』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『Gender Bender』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『젠더 벤더』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『I love my wet nappies』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『젖은 기저귀가 좋아』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『I wish these were brains』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『이게 뇌였으면 좋겠어』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『Birth Control is for Sissies』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『피임은 겁쟁이나 하는 거야』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『Oh to be a Sissy』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『시시가 되고 싶어』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『I'm not fat, I'm knocked up』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『살찐 게 아니라 임신한 거야』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "ahegao T-shirt")''', '''CALLF MAKE_STR(V_NAME, "아헤가오 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『No bra, No panties.』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『브라 없음, 팬티 없음.』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『High Maintenance』 T-shirt")''', '''CALLF MAKE_STR(V_NAME, "『손이 많이 가요』 티셔츠")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "Gensou-chan T-shirt")''', '''CALLF MAKE_STR(V_NAME, "겐소우짱 티셔츠")''', 1),
              ('''LOCALS '= "A T-shirt with a design of a demon. The art is cutesy and makes you want to coo."''', '''LOCALS '= "악마 그림이 그려진 티셔츠다. 그림이 무척 귀여워 절로 감탄이 나온다."''', 1),
              ('''CALLF MAKE_STR(V_NAME, "underboob sweater")''', '''CALLF MAKE_STR(V_NAME, "밑가슴 노출 스웨터")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "『Bitch』 top")''', '''CALLF MAKE_STR(V_NAME, "『비치』 탑")''', 1),

              ('''CALLF MAKE_STR(V_NAME, "sequin belt")''', '''CALLF MAKE_STR(V_NAME, "스팽글 벨트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "chainmail skirt")''', '''CALLF MAKE_STR(V_NAME, "체인메일 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "chequered skirt")''', '''CALLF MAKE_STR(V_NAME, "체크무늬 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "flowing skirt")''', '''CALLF MAKE_STR(V_NAME, "플레어 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "full zip skirt")''', '''CALLF MAKE_STR(V_NAME, "전면 지퍼 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "tight black latex skirt")''', '''CALLF MAKE_STR(V_NAME, "타이트한 검정 라텍스 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "blue latex hobble skirt")''', '''CALLF MAKE_STR(V_NAME, "파란 라텍스 호블 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "office skirt")''', '''CALLF MAKE_STR(V_NAME, "오피스 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "latex backless hobble skirt")''', '''CALLF MAKE_STR(V_NAME, "라텍스 백리스 호블 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "assless latex skirt")''', '''CALLF MAKE_STR(V_NAME, "엉덩이 노출형 라텍스 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "open front skirt")''', '''CALLF MAKE_STR(V_NAME, "앞트임 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "sheer open front skirt")''', '''CALLF MAKE_STR(V_NAME, "시스루 앞트임 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "fetish window skirt")''', '''CALLF MAKE_STR(V_NAME, "페티시 윈도 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "flight attendant skirt")''', '''CALLF MAKE_STR(V_NAME, "승무원 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "queen of spades skirt")''', '''CALLF MAKE_STR(V_NAME, "스페이드 퀸 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "milkmaid apron skirt")''', '''CALLF MAKE_STR(V_NAME, "밀크메이드 앞치마 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "ballistic skirt")''', '''CALLF MAKE_STR(V_NAME, "방탄 스커트")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "LUNINCO Ballistic Skirt「PlasSkirt」")''', '''CALLF MAKE_STR(V_NAME, "LUNINCO 방탄 스커트「PlasSkirt」")''', 1),
              ('''CALLF MAKE_STR(V_NAME, @"A knee-length skirt made with a ballistic plasteel weave, keeping style while also acting as intermediate ballistic protection.")''', '''CALLF MAKE_STR(V_NAME, @"방탄 플라스틸 직조 소재로 만든 무릎 길이 스커트로, 스타일을 유지하면서 중간 수준의 탄도 방호 성능을 제공한다.")''', 1),

              ('''CALLF MAKE_STR(V_NAME, "minimalist swimsuit")''', '''CALLF MAKE_STR(V_NAME, "미니멀 수영복")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "white monokini")''', '''CALLF MAKE_STR(V_NAME, "흰색 모노키니")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "green monokini")''', '''CALLF MAKE_STR(V_NAME, "초록색 모노키니")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "navy monokini")''', '''CALLF MAKE_STR(V_NAME, "남색 모노키니")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "turtle swimsuit")''', '''CALLF MAKE_STR(V_NAME, "거북이 수영복")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "queen of hearts monokini")''', '''CALLF MAKE_STR(V_NAME, "하트 퀸 모노키니")''', 1),
              ('''CALLF MAKE_STR(V_NAME, "queen of spades monokini")''', '''CALLF MAKE_STR(V_NAME, "스페이드 퀸 모노키니")''', 1),
          ]

          mismatches = []
          for old, new, expected in rules:
              count = text.count(old)
              if count != expected:
                  mismatches.append((old, expected, count))
          if mismatches:
              for old, expected, count in mismatches:
                  print(f'anchor mismatch: expected {expected}, got {count}: {old!r}')
              raise SystemExit(f'{len(mismatches)} anchor mismatch(es)')

          changed = 0
          for old, new, expected in rules:
              text = text.replace(old, new)
              changed += expected

          if changed != 40:
              raise SystemExit(f'expected 40 replacements, got {changed}')

          after_counts = {s: text.count(s) for s in protected}
          if before_counts != after_counts:
              raise SystemExit(f'protected schema/token counts changed: before={before_counts} after={after_counts}')

          intentionally_skipped = [
              'CALLF MAKE_STR(V_NAME, "lolita monokini")',
              'CALLF MAKE_STR(V_NAME, "『Gang Bang Girl』 T-shirt")',
              'CALLF MAKE_STR(V_NAME, "『Sissy Faggot』 T-shirt")',
              'CALLF MAKE_STR(V_NAME, @"『I %UNICODE(0x2764)% cum』 shirt")',
          ]
          for s in intentionally_skipped:
              if s not in text:
                  raise SystemExit(f'intentionally skipped string changed unexpectedly: {s}')

          data = text.encode('utf-8')
          if bom:
              data = b'\xef\xbb\xbf' + data
          target.write_bytes(data)
          print(f'replacements: {changed}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          target='ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB'
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$target" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          read -r additions deletions filename < <(git diff --numstat)
          if [[ "$additions" != "40" || "$deletions" != "40" || "$filename" != "$target" ]]; then
            echo "Unexpected numstat: +$additions -$deletions $filename"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB')
          raw = p.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('BOM was not preserved')
          text = raw.decode('utf-8-sig')
          required = [
              '『젠더 벤더』 티셔츠', '『젖은 기저귀가 좋아』 티셔츠',
              '겐소우짱 티셔츠', '밑가슴 노출 스웨터',
              '체인메일 스커트', '파란 라텍스 호블 스커트',
              'LUNINCO 방탄 스커트「PlasSkirt」', '중간 수준의 탄도 방호 성능을 제공한다.',
              '흰색 모노키니', '스페이드 퀸 모노키니'
          ]
          for s in required:
              if s not in text:
                  raise SystemExit(f'missing translated anchor: {s}')
          forbidden = [
              'CALLF MAKE_STR(V_NAME, "underboob sweater")',
              'CALLF MAKE_STR(V_NAME, "chainmail skirt")',
              'LUNINCO Ballistic Skirt「PlasSkirt」',
              'A knee-length skirt made with a ballistic plasteel weave',
              'CALLF MAKE_STR(V_NAME, "white monokini")',
          ]
          for s in forbidden:
              if s in text:
                  raise SystemExit(f'old display string remains: {s}')
          print('validation: ok')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB'
          git diff --cached --quiet && { echo 'No staged changes'; exit 1; }
          git commit -m '의류 UI 표시명 3차 한글화 45차'
          git push origin korean

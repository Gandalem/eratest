name: Batch Korean pass 64 diagnostic

on:
  push:
    paths:
      - '.github/scripts/batch_korean_pass64_diag.py'
      - '.github/workflows/batch-korean-pass-64-diag.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean target
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false
      - name: Fetch diagnostic script from main
        shell: bash
        run: |
          git show origin/main:.github/scripts/batch_korean_pass64_diag.py > /tmp/pass64_diag.py || {
            git fetch origin main --depth=1
            git show origin/main:.github/scripts/batch_korean_pass64_diag.py > /tmp/pass64_diag.py
          }
      - name: Diagnose pass 64 candidates
        shell: bash
        run: python3 /tmp/pass64_diag.py

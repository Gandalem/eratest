name: Batch Korean pass 57

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-57.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Translate rifle UI strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/400 Rifles.ERB')
          raw = p.read_bytes()
          assert raw.startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM missing before edit'
          text = raw.decode('utf-8-sig')
          original = text

          rules = [
              (72, '名前', 'bolt-action railgun', '볼트액션 레일건'),
              (400, '名前', 'handmade rifle', '수제 소총'),
              (401, '名前', 'outsider BR', '외부 세계 전투소총'),
              (402, '名前', 'MMG', '중형 기관총'),
              (403, '名前', 'assault rifle', '돌격소총'),
              (404, '名前', 'recharger rifle', '재충전 소총'),
              (405, '名前', 'submachine gun', '기관단총'),
              (406, '名前', 'smart SMG', '스마트 기관단총'),
              (407, '名前', 'smart rifle', '스마트 소총'),
              (408, '名前', 'energy rifle', '에너지 소총'),
              (409, '名前', 'ultratech rifle', '초첨단 소총'),
              (410, '名前', 'rifle', '소총'),
              (411, '名前', 'bolt-action rifle', '볼트액션 소총'),

              (412, '名前', 'anti material rifle', '대물 소총'),
              (412, 'FullName', 'YMKA Anti-Material Rifle「Operator」', 'YMKA 대물 소총「Operator」'),
              (412, 'FullName', 'anti material rifle', '대물 소총'),

              (413, '名前', 'self loading rifle', '자동장전 소총'),
              (413, 'FullName', 'LUNINCO Semi-Automatic Rifle「LAC33」', '루닌코 반자동 소총「LAC33」'),
              (413, 'FullName', 'self loading rifle', '자동장전 소총'),

              (414, '名前', 'tanegashima', '다네가시마'),
              (414, 'FullName', 'Akatsuki Tanegashima「Banhiken」', '아카츠키 다네가시마「Banhiken」'),
              (414, 'FullName', 'tanegashima', '다네가시마'),

              (415, '名前', 'flintlock repeater', '플린트록 연발소총'),
              (415, 'FullName', 'Akatsuki Revolving Flintlock Rifle「Eihei」', '아카츠키 회전식 플린트록 소총「Eihei」'),
              (415, 'FullName', 'flintlock repeater', '플린트록 연발소총'),

              (416, '名前', 'Recharger charge rifle', '재충전식 충전 소총'),
              (416, 'FullName', 'Keiga Youjutsu Series Charge Rifle「Youjyuu-C」', '케이가 요술 계열 충전 소총「Youjyuu-C」'),
              (416, 'FullName', 'Recharger charge rifle', '재충전식 충전 소총'),

              (417, '名前', 'charge lance', '충전 랜스'),
              (417, 'FullName', 'LUNINCO Charge Lance「LAC141」', '루닌코 충전 랜스「LAC141」'),
              (417, 'FullName', 'charge lance', '충전 랜스'),
              (417, '描写', r'''Designed as a personal \"anti-spaceship\" weapon, the LAC141 fires a supercharged beam of light that can fire and hit from kilometers away. Infamous for shooting down many Seihou craft during its still active tenure. As an anti-personal weapon, it is devistating against those with and without armor.''', '개인용 「대우주선」 무기로 설계된 LAC141은 수 km 밖의 표적에도 명중할 수 있는 과충전 광선을 발사한다. 현역 운용 기간 동안 수많은 세이호우 기체를 격추한 것으로 악명이 높다. 대인 무기로 사용해도 장갑 유무와 관계없이 파괴적인 위력을 발휘한다.'),

              (418, '名前', 'less-lethal launcher', '비살상 발사기'),
              (418, 'FullName', 'High-Ground Less Lethal Rifle「LLR」', '하이그라운드 비살상 소총「LLR」'),
              (418, 'FullName', 'less-lethal launcher', '비살상 발사기'),

              (419, '名前', 'railgun', '레일건'),
              (419, 'FullName', 'Cactus Company Railgun「RAIL-IT」', '캑터스 컴퍼니 레일건「RAIL-IT」'),
              (419, 'FullName', 'railgun', '레일건'),
              (419, '描写', r'''The Rail Assisted Item Launcher (the IT part doesn't mean anything other than its the sniper model) launches 20mm spikes from a rail using electromagnetic force. It is breach loaded and requires the operator to open the breach, drop the spike in, and close the breech to load the weapon. Commonly referred to as a \"railgun\", the RAIL-IT can drive its 20mm projectile at over 3 km/s accurately. Combined with its cheap to manufacture ammunition and it only requiring Midworld-era electronics to build-resulting in a low cost for a Seihou weapon, the RAIL-IT is one of the main sniper rifles used throughout the Seihou World.''', 'RAIL-IT는 전자기력으로 레일 위의 20mm 스파이크를 발사하는 Rail Assisted Item Launcher의 저격형이다. 후장식이라 약실을 열고 스파이크를 넣은 뒤 약실을 닫아 장전한다. 흔히 「레일건」이라 불리며 20mm 발사체를 3km/s가 넘는 속도로 정확하게 가속할 수 있다. 탄약 제조비가 저렴하고 미드월드 시대 전자기술만으로도 제작할 수 있어 세이호우 무기치고 비용이 낮으며, 세이호우 세계 전역에서 주력 저격소총 중 하나로 사용된다.'),

              (420, '名前', 'Chicago typewriter', '시카고 타자기'),
              (420, 'FullName', 'Broughton Chicago Typewriter「M281」', '브라우턴 시카고 타자기「M281」'),
              (420, 'FullName', 'Chicago typewriter', '시카고 타자기'),
              (420, '描写', r'''The M280 series of sub-machine guns, also known as the \"Chicago typewriter\", are legendary sub-machine guns used in the innerwar period. The M281 is a millitary contracted version of the M210 with a slight amount of simplfications for broader military use such as the lack of vetical grip. A further simplified version of the M281 would be used as the basis for the M1 sub-machine gun. The M281 fires at a steady 600 rounds of .45 ABP per minute, providing sufficient stopping power and trench clearing ability. Ironicly marketed as \"The gun that safeguards the innocent!\", a fully automatic weapon with a good amount of recoil isn't exactly the safest way to ensure no innocent bystanders are hurt.''', '「시카고 타자기」라고도 불리는 M280 계열 기관단총은 전간기에 사용된 전설적인 무기다. M281은 M210을 군용 계약에 맞춰 수직 손잡이를 없애는 등 일부를 단순화한 형식이며, 더 단순화된 M281 계열은 훗날 M1 기관단총의 기반이 되었다. M281은 .45 ABP탄을 분당 600발의 안정적인 속도로 발사해 충분한 저지력과 참호 소탕 능력을 제공한다. 「무고한 이를 지키는 총!」이라는 광고 문구와 달리, 반동이 큰 완전자동 화기가 민간인 피해를 막는 가장 안전한 수단인지는 의문이다.'),

              (421, '名前', 'ultratech railgun', '초첨단 레일건'),
              (421, 'FullName', 'Gensou-chan Railgun「Ender」', '겐소우짱 레일건「Ender」'),
              (421, 'FullName', 'ultratech railgun', '초첨단 레일건'),
              (421, '描写', r'''The \"Ender\" is a nickname to Gensou-chan Global's ultratech railgun. A Youjutsu-ification of the Cactus Company RAIL system, the Ender uses Youjutsu energy to drive spikes down kilometers away, penetrating any and every kind of armor avaliable. The NAIVE targeting computer and ALSA aim assist are also installed on the weapon, allowing for accurate shots from very far away. Anyone who gets on the wrong side of an Ender is most likely going to end up as a pin cushion.''', '「Ender」는 겐소우짱 글로벌의 초첨단 레일건에 붙은 별명이다. 캑터스 컴퍼니 RAIL 시스템을 요술화한 무기로, 요술 에너지로 스파이크를 수 km 밖까지 날려 보내 현존하는 거의 모든 장갑을 관통한다. NAIVE 표적 컴퓨터와 ALSA 조준 보조도 탑재되어 매우 먼 거리에서도 정밀 사격이 가능하다. Ender의 표적이 된 상대는 십중팔구 바늘꽂이 신세가 된다.'),

              (422, '名前', 'laser rifle', '레이저 소총'),
              (422, 'FullName', 'LUNINCO Laser Rifle「LAC1」', '루닌코 레이저 소총「LAC1」'),
              (422, 'FullName', 'laser rifle', '레이저 소총'),

              (423, '名前', 'arm-mounted energy rifle', '팔 장착형 에너지 소총'),
              (423, 'FullName', 'Cactus Company Arm-Mounted Energy Rifle「LILAC-ARM」', '캑터스 컴퍼니 팔 장착형 에너지 소총「LILAC-ARM」'),
              (423, 'FullName', 'arm-mounted energy rifle', '팔 장착형 에너지 소총'),
              (423, '描写', r'''The LILAC-ARM, an abbreviation of \"Light Infantry Loaded Accelerator Carbine - Arm Rail Mount\", is an assault rifle mounted and concealed on the arms of VIVIT androids. Shots are automatically charged by a battery in the magazine and use cactus energy powder and primers that are punctured to release and propel the projectile faster than regular gunpowder. It is capable of piercing even advanced armor systems such as their own Scout power armor.''', 'LILAC-ARM은 「Light Infantry Loaded Accelerator Carbine - Arm Rail Mount」의 약자로, VIVIT 안드로이드의 팔에 장착해 숨길 수 있는 돌격소총이다. 탄창 내 배터리가 발사체를 자동으로 충전하며, 캑터스 에너지 분말과 천공식 뇌관을 사용해 일반 화약보다 더 빠르게 발사체를 가속한다. 자사의 Scout 파워 아머 같은 고급 장갑 체계도 관통할 수 있다.'),

              (424, '名前', 'auto railgun', '자동 레일건'),
              (424, 'FullName', 'Gryzov Group Assault Railgun「AG-15 BIS」', '그리즈보프 그룹 돌격 레일건「AG-15 BIS」'),
              (424, 'FullName', 'auto railgun', '자동 레일건'),

              (425, '名前', 'handgonne', '핸드 캐넌'),
              (425, 'FullName', 'handgonne', '핸드 캐넌'),

              (426, '名前', 'machine railgun', '기관 레일건'),
              (426, 'FullName', 'Gensou-chan Machine Railgun「Ender+」', '겐소우짱 기관 레일건「Ender+」'),
              (426, 'FullName', 'machine railgun', '기관 레일건'),
          ]
          assert len(rules) == 62

          func_re = re.compile(r'^@Weapon(\d+)\(ARG, O_DATA, V_NAME\)\s*$', re.M)

          def function_span(src, weapon_id):
              matches = list(func_re.finditer(src))
              found = [(i, m) for i, m in enumerate(matches) if int(m.group(1)) == weapon_id]
              assert len(found) == 1, f'Weapon{weapon_id}: expected one active function, got {len(found)}'
              i, m = found[0]
              end = matches[i + 1].start() if i + 1 < len(matches) else len(src)
              return m.start(), end

          protected_keys = [
              '名前', 'FullName', '描写', '装備部位', 'Grade', 'Tech Level',
              'Research Required', 'Grip Slot', 'Foregrip Slot', 'Receiver Slot',
              'Barrel Slot', 'Barrel Body Slot', 'Tactical Slot', 'Sight Slot',
              'Stock Slot', 'Magazine Slot', 'Quest Only', 'Price',
              'WeaponReceiver/Default', 'WeaponBarrelBody/Default', 'WeaponSight/Default',
              'WeaponStock/Default', 'WeaponMag/Default', 'WeaponGrip/Default',
              'Two-Handed', 'Platform', 'Type', 'Class', 'Tags'
          ]
          before_counts = {k: original.count(f'CASE "{k}"') for k in protected_keys}
          protected_token_re = re.compile(r'%[^%\n]+%|\{[^{}\n]+\}|\\n|\\@')
          before_tokens = protected_token_re.findall(original)

          for weapon_id, field, old, new in rules:
              fstart, fend = function_span(text, weapon_id)
              block = text[fstart:fend]
              cases = list(re.finditer(r'^\s*CASE "([^"]+)"\s*$', block, re.M))
              target = None
              for ci, cm in enumerate(cases):
                  if cm.group(1) == field:
                      cend = cases[ci + 1].start() if ci + 1 < len(cases) else len(block)
                      target = (cm.end(), cend)
                      break
              assert target is not None, f'Weapon{weapon_id}: CASE {field} missing'
              cstart, cend = target
              cblock = block[cstart:cend]
              old_stmt = f'CALLF MAKE_STR(V_NAME, "{old}")'
              new_stmt = f'CALLF MAKE_STR(V_NAME, "{new}")'
              active_matches = []
              for mm in re.finditer(re.escape(old_stmt), cblock):
                  ls = cblock.rfind('\n', 0, mm.start()) + 1
                  line = cblock[ls:mm.end()]
                  if not line.lstrip().startswith(';'):
                      active_matches.append(mm)
              assert len(active_matches) == 1, f'Weapon{weapon_id} {field}: expected one active old value, got {len(active_matches)}: {old!r}'
              mm = active_matches[0]
              cblock = cblock[:mm.start()] + new_stmt + cblock[mm.end():]
              block = block[:cstart] + cblock + block[cend:]
              text = text[:fstart] + block + text[fend:]

          after_counts = {k: text.count(f'CASE "{k}"') for k in protected_keys}
          assert before_counts == after_counts, (before_counts, after_counts)
          assert before_tokens == protected_token_re.findall(text), 'protected interpolation/token sequence changed'

          eng = re.compile(r'[A-Za-z]{2,}')
          hangul = re.compile(r'[가-힣]')
          literal_re = re.compile(r'CALLF MAKE_STR\(V_NAME,\s*(?:@)?"((?:\\.|[^"\\])*)"\)')
          wanted = {'名前', 'FullName', '描写'}
          remaining = []
          funcs = list(func_re.finditer(text))
          for i, fm in enumerate(funcs):
              weapon_id = int(fm.group(1))
              fend = funcs[i + 1].start() if i + 1 < len(funcs) else len(text)
              block = text[fm.start():fend]
              cases = list(re.finditer(r'^\s*CASE "([^"]+)"\s*$', block, re.M))
              for ci, cm in enumerate(cases):
                  field = cm.group(1)
                  if field not in wanted:
                      continue
                  cend = cases[ci + 1].start() if ci + 1 < len(cases) else len(block)
                  cblock = block[cm.end():cend]
                  for sm in literal_re.finditer(cblock):
                      ls = cblock.rfind('\n', 0, sm.start()) + 1
                      line = cblock[ls:sm.end()]
                      if line.lstrip().startswith(';'):
                          continue
                      value = sm.group(1)
                      if eng.search(value) and not hangul.search(value):
                          remaining.append((weapon_id, field, value))

          expected_remaining = [
              (72, '名前', 'VR-ICKX BIS'),
              (400, '名前', 'Bastard'),
              (401, '名前', 'GH31'),
              (402, '名前', 'GH21'),
              (403, '名前', 'Vandal'),
              (404, '名前', 'Youjyuu-R'),
              (405, '名前', 'Stinger'),
              (406, '名前', 'Shaman'),
              (407, '名前', 'Xavier'),
              (408, '名前', 'LILAC'),
              (409, '名前', 'MARLin'),
              (410, '名前', 'LAC13'),
              (411, '名前', 'LAC17'),
              (412, '名前', 'Operator'),
              (413, '名前', 'LAC33'),
              (414, '名前', 'Banhiken'),
              (415, '名前', 'Eihei'),
              (416, '名前', 'Youjyuu-C'),
              (417, '名前', 'LAC141'),
              (418, '名前', 'LLR'),
              (419, '名前', 'RAIL-IT'),
              (421, '名前', 'Ender'),
              (422, '名前', 'LAC1'),
              (423, '名前', 'LILAC-ARM'),
              (424, '名前', 'AG-15 BIS'),
              (426, '名前', 'Ender+'),
          ]
          assert remaining == expected_remaining, f'unexpected English-only active UI remains: {remaining}'

          p.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          assert p.read_bytes().startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM missing after edit'
          print(f'replacements={len(rules)}')
          print(f'english_only_active_ui_remaining={len(remaining)} (model names only)')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/400 Rifles.ERB'
          test "$(git diff --numstat | awk '{print $1}')" -eq 62
          test "$(git diff --numstat | awk '{print $2}')" -eq 62
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/400 Rifles.ERB')
          assert p.read_bytes().startswith(b'\xef\xbb\xbf')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/400 Rifles.ERB'
          git commit -m '소총 UI 이름 및 설명 1차 한글화 57차'
          git push origin HEAD:korean

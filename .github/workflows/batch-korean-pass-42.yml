name: Batch Korean pass 42

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-42.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate receiver display names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB')
          raw = target.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          protected = [
              'CASE "名前"', 'CASE "ShortName"', 'CASE "描写"', 'CASE "装備部位"',
              'CASE "Platform"', 'CASE "Base Weapon"', 'CASE "Ammo"',
              'CASE "Accuracy"', 'CASE "Accuracy/Set"', 'CASE "Burst/Set"',
              'CASE "Price"', '「WeaponReceiver」'
          ]
          before_counts = {s: text.count(s) for s in protected}

          rules = [
              ('Stock Receiver', '기본 리시버', 2),
              ('AR-15 Magpul Custom Upper 5.56x45mm Receiver', 'AR-15 매그펄 커스텀 상부 5.56x45mm 리시버', 1),
              ('MR-70 Custom Upper 5.56x45mm Receiver', 'MR-70 커스텀 상부 5.56x45mm 리시버', 1),
              ('M16A2 Colt Semi/3-Round Burst Lower and Upper 5.56x45mm Receiver', 'M16A2 콜트 반자동/3점사 하부·상부 5.56x45mm 리시버', 1),
              ('M705 Broughton Semi/3-Round Burst Lower and Upper 5.56x45mm Receiver', 'M705 브라우턴 반자동/3점사 하부·상부 5.56x45mm 리시버', 1),
              ('M16 Colt Semi/Full Lower and Upper 5.56x45mm Receiver', 'M16 콜트 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('M602 Broughton Semi/Full Lower and Upper 5.56x45mm Receiver', 'M602 브라우턴 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('SVG-67 Gryzov Semi/Full 7.62x39mm Receiver', 'SVG-67 그리즈보프 반자동/완전자동 7.62x39mm 리시버', 1),
              ('PG-69 Gryzov Machine Gun Full-Auto 7.62x54mmR Receiver', 'PG-69 그리즈보프 기관총 완전자동 7.62x54mmR 리시버', 1),
              ('M630 Broughton Semi/Full Lower and Upper 7.62x51mm Receiver', 'M630 브라우턴 반자동/완전자동 하부·상부 7.62x51mm 리시버', 1),
              ('M631 Broughton Semi-Auto Lower and Upper 7.62x51mm Receiver', 'M631 브라우턴 반자동 하부·상부 7.62x51mm 리시버', 1),
              ('M903 Broughton Semi/Full Lower and Upper 5.56x45mm Receiver', 'M903 브라우턴 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('M900 Broughton Semi/3-Round Burst Lower and Upper 5.56x45mm Receiver', 'M900 브라우턴 반자동/3점사 하부·상부 5.56x45mm 리시버', 1),
              ('OW1 Zoi Motive Semi/Full Lower and Upper 5.56x45mm Receiver', 'OW1 조이 모티브 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('OW2 Zoi Motive Semi/Full Lower and Upper 5.56x45mm Receiver', 'OW2 조이 모티브 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('BSASS (Broughton Semi Automatic Sniper System) Lower and Upper 7.62x51mm Receiver', 'BSASS(브라우턴 반자동 저격 시스템) 하부·상부 7.62x51mm 리시버', 1),
              ('CETME Model 58 Semi/Full Lower and Upper 7.62x51mm Receiver', 'CETME 모델 58 반자동/완전자동 하부·상부 7.62x51mm 리시버', 1),
              ('CETME Model L Semi/Full Lower and Upper 5.56x45mm Receiver', 'CETME 모델 L 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('CETME Sporter Semi-Auto Lower and Upper 7.62x51mm Receiver', 'CETME 스포터 반자동 하부·상부 7.62x51mm 리시버', 1),
              ('GH31 Gabe Hubert Semi/Full Lower and Upper 7.62x51mm Receiver', 'GH31 게이브 휴버트 반자동/완전자동 하부·상부 7.62x51mm 리시버', 1),
              ('GH54 Gabe Hubert Semi/Full Lower and Upper 9x19mm Receiver', 'GH54 게이브 휴버트 반자동/완전자동 하부·상부 9x19mm 리시버', 1),
              ('GH94 Gabe Hubert Semi-Auto Lower and Upper 9x19mm Receiver', 'GH94 게이브 휴버트 반자동 하부·상부 9x19mm 리시버', 1),
              ('GH54A Gabe Hubert Semi/Full Lower and Upper 9x19mm Receiver', 'GH54A 게이브 휴버트 반자동/완전자동 하부·상부 9x19mm 리시버', 1),
              ('MARLin Gensou-chan Semi/Full Lower and Upper 5.56x45mm Receiver', 'MARLin 겐소우짱 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('Vandal KappaArmory Semi/Full 5.56x45mm Receiver', '밴달 캇파 아머리 반자동/완전자동 5.56x45mm 리시버', 1),
              ('SVG-76 Gryzov Semi/Full 5.45x39mm Receiver', 'SVG-76 그리즈보프 반자동/완전자동 5.45x39mm 리시버', 1),
              ('AG-6 Gryzov Semi/Full 5.45x39mm Receiver', 'AG-6 그리즈보프 반자동/완전자동 5.45x39mm 리시버', 1),
              ('QBZ-56 CONIG Semi/Full 7.62x39mm Receiver', 'QBZ-56 CONIG 반자동/완전자동 7.62x39mm 리시버', 1),
              ('AG-1 Gryzov Semi/Full 5.56x45mm Receiver', 'AG-1 그리즈보프 반자동/완전자동 5.56x45mm 리시버', 1),
              ('AK-103 Izhmash Semi/Full 7.62x39mm Receiver', 'AK-103 이즈마시 반자동/완전자동 7.62x39mm 리시버', 1),
              ('AG-3 Gryzov Semi/Full 7.62x39mm Receiver', 'AG-3 그리즈보프 반자동/완전자동 7.62x39mm 리시버', 1),
              ('ALS-75 Averdeen Full-Auto Lower and Upper 5.56x45mm Receiver', 'ALS-75 애버딘 완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('AAR-75 Averdeen Semi/Full Lower and Upper 5.56x45mm Receiver', 'AAR-75 애버딘 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('QBZ-HB CONIG Semi/Full Lower and Upper 5.56x45mm Receiver', 'QBZ-HB CONIG 반자동/완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('Stormer Full-Auto Lower and Upper 5.56x45mm Receiver', '스토머 완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('Bastard Full-Auto Lower and Upper 5.56x45mm Receiver', '바스타드 완전자동 하부·상부 5.56x45mm 리시버', 1),
              ('B7 Windurger 18.5x70mm Receiver', 'B7 빈두르거 18.5x70mm 리시버', 1),
              ('TM-4 Umarex CO2 Semi/Full Lower and Upper .43 Receiver', 'TM-4 우마렉스 CO2 반자동/완전자동 하부·상부 .43 리시버', 1),
              ('FT-70 Phantom Dynamics CO2 Semi/Full Lower and Upper .43 Receiver', 'FT-70 팬텀 다이내믹스 CO2 반자동/완전자동 하부·상부 .43 리시버', 1),
              ('DD17 Deterrence Dispensed 9x19mm Receiver', 'DD17 디터런스 디스펜스드 9x19mm 리시버', 1),
              ('TB 68 Umarex CO2 Semi-Auto .68 Receiver', 'TB 68 우마렉스 CO2 반자동 .68 리시버', 1),
              ('FS-6 Phantom Dynamics CO2 Semi-Auto .68 Receiver', 'FS-6 팬텀 다이내믹스 CO2 반자동 .68 리시버', 1),
              ('FD-17 Phantom Dynamics CO2 .43 Receiver', 'FD-17 팬텀 다이내믹스 CO2 .43 리시버', 1),
              ('HP Tertiary Arms 9x19mm Receiver', 'HP 터셔리 암즈 9x19mm 리시버', 1),
              ('BENCHY Gensou-chan Semi/Full 7.62x20mm Receiver', 'BENCHY 겐소우짱 반자동/완전자동 7.62x20mm 리시버', 1),
          ]

          changed = 0
          for old, new, expected in rules:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'anchor count mismatch for {old!r}: expected {expected}, got {count}')
              text = text.replace(old, new)
              changed += count

          if changed != 46:
              raise SystemExit(f'expected 46 replacements, got {changed}')

          after_counts = {s: text.count(s) for s in protected}
          if before_counts != after_counts:
              raise SystemExit(f'protected schema counts changed: before={before_counts} after={after_counts}')

          data = text.encode('utf-8')
          if bom:
              data = b'\xef\xbb\xbf' + data
          target.write_bytes(data)
          print(f'replacements: {changed}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          target='ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB'
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$target" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          read -r additions deletions filename < <(git diff --numstat)
          if [[ "$additions" != "46" || "$deletions" != "46" || "$filename" != "$target" ]]; then
            echo "Unexpected numstat: +$additions -$deletions $filename"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB')
          raw = p.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('BOM was not preserved')
          text = raw.decode('utf-8-sig')
          required = [
              'AR-15 매그펄 커스텀 상부 5.56x45mm 리시버',
              'M16A2 콜트 반자동/3점사 하부·상부 5.56x45mm 리시버',
              'PG-69 그리즈보프 기관총 완전자동 7.62x54mmR 리시버',
              'BSASS(브라우턴 반자동 저격 시스템) 하부·상부 7.62x51mm 리시버',
              'GH54A 게이브 휴버트 반자동/완전자동 하부·상부 9x19mm 리시버',
              'MARLin 겐소우짱 반자동/완전자동 하부·상부 5.56x45mm 리시버',
              'TM-4 우마렉스 CO2 반자동/완전자동 하부·상부 .43 리시버',
              'DD17 디터런스 디스펜스드 9x19mm 리시버',
              'BENCHY 겐소우짱 반자동/완전자동 7.62x20mm 리시버',
          ]
          for s in required:
              if s not in text:
                  raise SystemExit(f'missing translated anchor: {s}')
          forbidden = [
              'M16A2 Colt Semi/3-Round Burst Lower and Upper 5.56x45mm Receiver',
              'GH54 Gabe Hubert Semi/Full Lower and Upper 9x19mm Receiver',
              'Stormer Full-Auto Lower and Upper 5.56x45mm Receiver',
          ]
          for s in forbidden:
              if s in text:
                  raise SystemExit(f'old display string remains: {s}')
          print('validation: ok')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB'
          git diff --cached --quiet && { echo 'No staged changes'; exit 1; }
          git commit -m '리시버 표시 이름 한글화 42차'
          git push origin HEAD:korean

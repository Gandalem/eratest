name: Patch Korean title and onboarding

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/patch-title-onboarding-korean.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0
          lfs: false

      - name: Translate title and onboarding UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path

          def read_text(path):
              raw = path.read_bytes()
              for enc in ('utf-8-sig','utf-8','cp932'):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      pass
              raise RuntimeError(f'Cannot decode {path}')

          def patch(path, replacements):
              p=Path(path)
              text=read_text(p)
              before=text
              missed=[]
              for old,new in replacements:
                  if old not in text:
                      missed.append(old)
                  text=text.replace(old,new)
              if text != before:
                  p.write_text(text, encoding='utf-8-sig', newline='')
              print(f'{path}: changed={text != before}, missed={len(missed)}')
              for m in missed:
                  print('  MISS:',repr(m))

          patch('ERB/TRANSLATION/OMOGATARI/Title.ERB', [
              ('RETURNF "Continue"','RETURNF "계속하기"'),
              ('RETURNF "The World"','RETURNF "더 월드"'),
              ('RETURNF "Legend of Gensokyo"','RETURNF "환상향의 전설"'),
              ('RETURNF "Lunatic Survival"','RETURNF "루나틱 서바이벌"'),
              ('RETURNF "Free H"','RETURNF "프리 H"'),
              ('RETURNF "Custom Characters"','RETURNF "커스텀 캐릭터"'),
              ('RETURNF "Save Data Transfer"','RETURNF "세이브 데이터 전송"'),
              ('RETURNF "Settings"','RETURNF "설정"'),
              ('RETURNF "DEBUG"','RETURNF "디버그"'),
              ('RETURNF "Start Game"','RETURNF "게임 시작"'),
              ('RETURNF "Load Save"','RETURNF "세이브 불러오기"'),
              ('RETURNF "DEV QUICKTEST"','RETURNF "개발자 빠른 테스트"'),
              ('RETURNF "Lucid Dream Test"','RETURNF "자각몽 테스트"'),
              ('RETURNF "Map Path Test"','RETURNF "맵 경로 테스트"'),
              ('RETURNF "Reload Game"','RETURNF "게임 다시 시작"'),
              ('RETURNF "Use Legacy Title Screen"','RETURNF "기존 타이틀 화면 사용"'),
              ('RETURNF "Load your most recent save."','RETURNF "가장 최근 세이브를 불러옵니다."'),
              ('RETURNF "Live your life in the World of Fantasy. This is the main mode of eraNAS."','RETURNF "환상향에서 자유롭게 살아가는 eraNAS의 메인 모드입니다."'),
              ('RETURNF "Start as a nobody and work your way to to godhood by beating rivals throughout the World of Fantasy."','RETURNF "이름 없는 존재로 시작해 환상향 곳곳의 라이벌을 쓰러뜨리며 정상에 오르는 모드입니다."'),
              ('RETURNF "Have sex with any character of your choosing in eraNAS. You will be thrusted directly into an H scene"','RETURNF "원하는 캐릭터를 선택해 바로 H 장면으로 들어가는 자유 플레이 모드입니다."'),
              ('RETURNF "Work as a servant for the Scarlet Devil Mansion and avoid getting assaulted by the mansion\'s inhabitants."','RETURNF "홍마관의 하인으로 일하면서 관의 주민들에게 습격당하지 않도록 살아남는 모드입니다."'),
              ('RETURNF "Create a custom character that you can play as or add to a The World or Legend of Gensokyo playthrough"','RETURNF "더 월드 또는 환상향의 전설에서 플레이하거나 등장시킬 커스텀 캐릭터를 만듭니다."'),
              ('RETURNF "Transfer your save data from and to other forks of eraTW such as AnonTW, eraTW Neodev, and more."','RETURNF "AnonTW, eraTW Neodev 등 다른 eraTW 파생판과 세이브 데이터를 주고받습니다."'),
              ('RETURNF "Configure game settings to your liking. This is where fetishes are enabled and disabled"','RETURNF "게임 설정을 원하는 대로 조정합니다. 각종 콘텐츠 옵션도 여기서 켜고 끌 수 있습니다."'),
              ('RETURNF "Special developer features"','RETURNF "개발자용 특수 기능입니다."'),
              ('RETURNF "Click this button to reload the game since Ctrl+R doesn\'t work"','RETURNF "Ctrl+R이 작동하지 않을 때 이 버튼으로 게임을 다시 불러옵니다."'),
              ('RETURNF "Return to the legacy title screen"','RETURNF "기존 방식의 타이틀 화면으로 돌아갑니다."'),
              ('RETURNF "Return to the title screen"','RETURNF "타이틀 화면으로 돌아갑니다."'),
              ('RETURNF "Start a new playthrough"','RETURNF "새 게임을 시작합니다."'),
              ('RETURNF "Load a saved playthrough"','RETURNF "저장된 게임을 불러옵니다."'),
              ('RETURNF "Start a new playthrough using the dev quicktest settings"','RETURNF "개발자 빠른 테스트 설정으로 새 게임을 시작합니다."'),
          ])

          patch('ERB/TRANSLATION/OMOGATARI/REVERSE CHARAMAKE/Onboarding.ERB', [
              ('#DIMS OB_OPTIONS = "", "Sexual Content", "Excretion Content", "Physical Harm", "Combat", "Additional Features"',
               '#DIMS OB_OPTIONS = "", "성적 콘텐츠", "배설 콘텐츠", "신체 피해", "전투", "추가 기능"'),
              ('【Onboarding 초기화】','【온보딩 초기화】'),
              ('@"No"','@"아니요"'),
              ('"Finished"','"완료"'),
              ('"Scat은 네 가지 옵션으로 나뉜다. 관장, 완하제 놀이, 더럽히기, 그리고 배설물 놀이다"','"배설물 콘텐츠는 네 가지 옵션으로 나뉜다. 관장, 완하제 놀이, 더럽히기, 그리고 배설물 놀이다"'),
          ])

          patch('ERB/TRANSLATION/OMOGATARI/TOGGLES/TooManyToggles.ERB', [
              ('RETURNF "Yes"','RETURNF "예"'),
              ('RETURNF "No"','RETURNF "아니요"'),
              ('#DIMS CONST DISP_NAME = "General", "Excretion", "Physical Harm", "Non-consent", "Pregnancy", "Additions", "Vanilla", "Other", "Debug"',
               '#DIMS CONST DISP_NAME = "일반", "배설", "신체 피해", "비동의", "임신", "추가 기능", "기본 게임", "기타", "디버그"'),
          ])
          PY

          git add 'ERB/TRANSLATION/OMOGATARI/Title.ERB' \
                  'ERB/TRANSLATION/OMOGATARI/REVERSE CHARAMAKE/Onboarding.ERB' \
                  'ERB/TRANSLATION/OMOGATARI/TOGGLES/TooManyToggles.ERB'
          git commit -m '타이틀과 초반 온보딩 한글화' || true
          git push origin korean

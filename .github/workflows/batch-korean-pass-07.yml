name: Batch Korean pass 07

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate tips and safe talent tooltips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          targets = {
            Path('ERB/TRANSLATION/OMOGATARI/NAS_TIPS_TR.ERB'): [
              ('RETURNF "Total"', 'RETURNF "전체"'),
              ('RETURNF "General"', 'RETURNF "일반"'),
              ('RETURNF "Sexual"', 'RETURNF "성적"'),
              ('RETURNF "Funny"', 'RETURNF "유머"'),
              ('RETURNF "Characters"', 'RETURNF "캐릭터"'),
              ('RETURNF "Combat"', 'RETURNF "전투"'),
              ('RETURNF "Excretion"', 'RETURNF "배설"'),
              ('RETURNF "A good date can take care of hate marks."', 'RETURNF "좋은 데이트는 증오 마크를 줄이는 데 도움이 된다."'),
            ],
            Path('ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB'): [
              ('RETURNF "Indicates that this character is a man."', 'RETURNF "이 캐릭터가 남성임을 나타냅니다."'),
              ('RETURNF "This character has developed a romantic bond with you. You can call yourself a couple now.\\nMakes it much easier to execute commands. More likely to obey you overall."', 'RETURNF "이 캐릭터는 당신과 연인 관계가 되었습니다. 이제 둘을 연인이라고 불러도 됩니다.\\n여러 행동을 시도하기 쉬워지고, 전반적으로 당신의 요청을 더 잘 받아들입니다."'),
              ('RETURNF "This character submitted themselves at your mercy. You can truly call yourself a master now."', 'RETURNF "이 캐릭터는 당신에게 완전히 복종했습니다. 이제 정말로 주인이라 부를 만한 관계입니다."'),
              ('RETURNF "This character has never experienced kissing before."', 'RETURNF "이 캐릭터는 아직 키스를 해 본 적이 없습니다."'),
              ('RETURNF "You and this character have formed a couple. You can only be in one relationship like this."', 'RETURNF "당신과 이 캐릭터는 연인 관계를 맺었습니다. 이런 관계는 한 번에 하나만 유지할 수 있습니다."'),
              ('RETURNF "This character feels a strange yearning for you. If you keep working on your relationship, they may truly fall in love with you.\\nMakes it easier to execute commands. Also more likely to obey you overall."', 'RETURNF "이 캐릭터는 당신에게 특별한 그리움을 느끼고 있습니다. 관계를 계속 발전시키면 진심으로 사랑하게 될 수도 있습니다.\\n여러 행동을 시도하기 쉬워지고 전반적으로 당신의 요청을 더 잘 받아들입니다."'),
              ('RETURNF "Shows whether this character is in a good or bad mood. Bad Mood makes them angry faster and their Favor raise slower. Good Mood makes them raise Favor faster instead."', 'RETURNF "이 캐릭터의 기분이 좋은지 나쁜지를 나타냅니다. 기분이 나쁘면 더 쉽게 화를 내고 호감도 상승이 느려지며, 기분이 좋으면 호감도가 더 빠르게 오릅니다."'),
              ('RETURNF "This character is physically unattractive."', 'RETURNF "이 캐릭터는 외모 매력이 낮은 편입니다."'),
              ('RETURNF "This character is physically attractive.\\nIf player: Characters will like you more. Easier to get good date results. Easier to perform special judgment checks."', 'RETURNF "이 캐릭터는 외모가 매력적입니다.\\n플레이어가 이 특성을 가지면 다른 캐릭터의 호감을 얻기 쉬워지고, 데이트 결과와 일부 특수 판정에도 유리합니다."'),
              ('RETURNF "Shows the physical age of the character."', 'RETURNF "이 캐릭터의 육체적 나이를 나타냅니다."'),
              ('RETURNF "Makes character’s private room dirty faster, showing that their Cleaning Skill is pretty bad."', 'RETURNF "개인실이 더 빨리 더러워집니다. 청소 실력이 좋지 않음을 나타냅니다."'),
              ('RETURNF "Easier to change the mood. Doesn’t do anything."', 'RETURNF "기분이 더 쉽게 변합니다. 현재는 별도의 추가 효과가 없습니다."'),
              ('RETURNF "Makes it much easier to execute commands."', 'RETURNF "여러 행동을 훨씬 쉽게 시도할 수 있게 합니다."'),
              ('RETURNF "This character is resistant to pain\\nGems: Pain↓"', 'RETURNF "이 캐릭터는 통증에 강합니다.\\n보석: 통증↓"'),
              ('RETURNF "This character is sensitive to pain\\nGems: Pain↑"', 'RETURNF "이 캐릭터는 통증에 민감합니다.\\n보석: 통증↑"'),
              ('RETURNF "How good the character is at synthesizing items."', 'RETURNF "이 캐릭터의 아이템 조합 실력을 나타냅니다."'),
              ('RETURNF "How good the character is at logging."', 'RETURNF "이 캐릭터의 벌목 실력을 나타냅니다."'),
              ('RETURNF "How good the character is at fishing."', 'RETURNF "이 캐릭터의 낚시 실력을 나타냅니다."'),
              ('RETURNF "How good the character is at foraging and finding ingredients."', 'RETURNF "이 캐릭터의 채집 및 재료 탐색 실력을 나타냅니다."'),
              ('RETURNF "(Not implemented)"', 'RETURNF "(미구현)"'),
              ('RETURNF "Easier to execute commands. Submission parameter raises faster. Hostility parameter raises slower."', 'RETURNF "여러 행동을 시도하기 쉬워집니다. 복종 수치는 더 빠르게 오르고 적대 수치는 더 느리게 오릅니다."'),
              ('RETURNF "A Kitsune, a fox Youkai.\\nThe more tails the have the stronger they are.\\nThey are also alluring by nature."', 'RETURNF "여우 요괴인 키츠네입니다.\\n꼬리가 많을수록 더 강합니다.\\n본래 사람을 끄는 매력을 지닌 존재이기도 합니다."'),
              ('RETURNF "A Youko (fox spirit), differs from a Kitsune in mythology."', 'RETURNF "요호라 불리는 여우 정령입니다. 신화상 키츠네와는 구분됩니다."'),
              ('RETURNF "Favor raises faster."', 'RETURNF "호감도가 더 빠르게 오릅니다."'),
              ('RETURNF "Favor raises faster. Easier to execute commands and parameters raise faster if player has it."', 'RETURNF "호감도가 더 빠르게 오릅니다. 플레이어가 이 특성을 가지면 여러 행동을 시도하기 쉬워지고 관련 수치도 더 빨리 상승합니다."'),
              ('RETURNF "Favor raises faster. Easier to execute commands and more parameters raise faster if player has it."', 'RETURNF "호감도가 더 빠르게 오릅니다. 플레이어가 이 특성을 가지면 여러 행동을 시도하기 쉬워지고 더 많은 관련 수치가 빠르게 상승합니다."'),
              ('RETURNF "Affects recovery speed of STA and ENE from every action that restores them (Resting, Sleeping, Pillow Talk, etc.)"', 'RETURNF "휴식, 수면 등 STA와 ENE를 회복하는 모든 행동의 회복량에 영향을 줍니다."'),
              ('RETURNF "Increases amount of restored STA and ENE when resting at Noon time."', 'RETURNF "낮 시간에 휴식할 때 회복되는 STA와 ENE가 증가합니다."'),
              ('RETURNF "Increases amount of restored STA and ENE when resting at Night time."', 'RETURNF "밤 시간에 휴식할 때 회복되는 STA와 ENE가 증가합니다."'),
              ('RETURNF "Increases amount of restored STA and ENE if assistant has it. Doesn’t do anything."', 'RETURNF "보조자가 이 특성을 가지고 있으면 회복되는 STA와 ENE가 증가합니다. 현재는 별도의 추가 효과가 없습니다."'),
              ('RETURNF "Easier to execute commands if assistant has it."', 'RETURNF "보조자가 이 특성을 가지고 있으면 여러 행동을 시도하기 쉬워집니다."'),
              ('RETURNF "Increases pleasure from eating, gets hungry faster, and eats faster."', 'RETURNF "음식에서 얻는 만족감이 커지고, 더 빨리 배고파지며, 식사 속도도 빨라집니다."'),
              ('RETURNF "Can disguise their looks and transform into other people."', 'RETURNF "외모를 위장하고 다른 사람의 모습으로 변신할 수 있습니다."'),
              ('RETURNF "Lowers the cost when selling, Lowers the reward when working. Doesn’t do anything."', 'RETURNF "판매 시 가격과 작업 보상이 낮아집니다. 현재는 별도의 추가 효과가 없습니다."'),
              ('RETURNF "You may avoid losing pilfered panties if others try to confiscate them when you didn’t add them to the collection yet."', 'RETURNF "아직 수집품에 등록하지 않은 훔친 속옷을 다른 사람이 압수하려 할 때 잃지 않을 가능성이 생깁니다."'),
              ('RETURNF "Can sense everyone’s position on a current map. Special command becomes available."', 'RETURNF "현재 지도에서 모든 사람의 위치를 감지할 수 있습니다. 전용 행동이 해금됩니다."'),
              ('RETURNF "Can sense dirtiness of each room on a current map. Special command becomes available."', 'RETURNF "현재 지도에서 각 방의 오염도를 감지할 수 있습니다. 전용 행동이 해금됩니다."'),
              ('RETURNF "Indicates a deep musical or singing knowledge. Musical commands become more effective."', 'RETURNF "음악이나 노래에 대한 깊은 지식을 나타냅니다. 음악 관련 행동의 효과가 증가합니다."'),
              ('RETURNF "Indicates a musical sensitivity. Gets bonus or penalty to musical activities depending on the state of this talent."', 'RETURNF "음악적 감수성을 나타냅니다. 이 특성의 상태에 따라 음악 활동에 보너스 또는 페널티가 적용됩니다."'),
              ('RETURNF "Recovers STA and ENE under rain, gets exhausted under the blazing sun."', 'RETURNF "비가 올 때 STA와 ENE를 회복하지만, 강한 햇빛 아래에서는 더 쉽게 지칩니다."'),
              ('RETURNF "An ice fairy.\\nThey recover in cold places but become exhausted in warm places.\\nWhile stronger than a human, they are weaker than most Youkai."', 'RETURNF "얼음 요정입니다.\\n추운 장소에서는 회복하지만 따뜻한 장소에서는 쉽게 지칩니다.\\n인간보다는 강하지만 대부분의 요괴보다는 약합니다."'),
              ('RETURNF "A seasonal Youkai that only appears during winter.\\nHas the ability to reinforce the natural cold that is in nature.\\nThus, it is the strongest during winter and weakest during summer."', 'RETURNF "겨울에만 나타나는 계절성 요괴입니다.\\n자연에 존재하는 추위를 더욱 강화하는 능력을 지닙니다.\\n따라서 겨울에 가장 강하고 여름에 가장 약합니다."'),
              ('RETURNF "This character is obsessed with cleaning. Bonus to cleaning activities."', 'RETURNF "이 캐릭터는 청소에 집착합니다. 청소 활동에 보너스를 받습니다."'),
              ('RETURNF "Increases probability of visitors appearing on the map."', 'RETURNF "지도에 방문객이 나타날 확률이 증가합니다."'),
              ('RETURNF "Does nothing right now."', 'RETURNF "현재는 효과가 없습니다."'),
              ('RETURNF "Chance to permanently increase affinity between Player and Target during dates."', 'RETURNF "데이트 중 플레이어와 대상 사이의 친밀도가 영구적으로 상승할 확률이 생깁니다."'),
              ('RETURNF "Get notified about unobtained panties. Special command becomes available."', 'RETURNF "아직 얻지 못한 속옷에 대한 알림을 받을 수 있습니다. 전용 행동이 해금됩니다."'),
              ('RETURNF "Cleans up their location"', 'RETURNF "현재 위치를 청소합니다."'),
              ('RETURNF "Not a real person, just an imagination. Everything that will happen between you is just a lie."', 'RETURNF "실제 인물이 아니라 상상 속 존재입니다. 둘 사이에서 일어나는 모든 일은 현실이 아닙니다."'),
            ],
          }

          total = 0
          changed_files = 0
          for path, reps in targets.items():
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig')
              before = text
              count_file = 0
              for old, new in reps:
                  c = text.count(old)
                  if c:
                      text = text.replace(old, new)
                      total += c
                      count_file += c
                      print('REPLACED', c, path, old[:70])
              if text != before:
                  out = text.encode('utf-8')
                  if bom:
                      out = b'\xef\xbb\xbf' + out
                  path.write_bytes(out)
                  changed_files += 1
                  print('CHANGED FILE', path, count_file)

          if total < 25:
              raise SystemExit(f'Too few replacements: {total}')
          print('TOTAL REPLACEMENTS', total)
          print('CHANGED FILES', changed_files)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git diff -U0 | grep -E '^[-+].*@(TALENT_INFO|TIPS_TYPES_TR|TIPS_TR)' || { echo 'Function declaration changed'; exit 1; }
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/NAS_TIPS_TR.ERB' 'ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB'
          git commit -m '팁 분류 및 일반 툴팁 한글화 7차'
          git push origin HEAD:korean

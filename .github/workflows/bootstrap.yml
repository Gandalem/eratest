name: Bootstrap eraNAS sources

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import PopsTW source into main
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch dev/omogatari-kai https://gitgud.io/mrpopsalot/pops-tw.git "$tmp/pops"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --exclude='.git/' --exclude='.gitlab/' --exclude='.github/' "$tmp/pops/" ./
          git add -A
          git commit -m "원본 eraNAS 소스 가져오기" || true
          git push origin main

      - name: Import existing Korean translation as reference branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          if git clone --depth 1 https://gitgud.io/TakenTextbung/eranaskr.git "$tmp/kr"; then
            :
          else
            curl -fL --retry 3 -o "$tmp/kr.zip" "https://gitgud.io/TakenTextbung/eranaskr/-/archive/master/eranaskr-master.zip"
            mkdir -p "$tmp/kro"
            unzip -q "$tmp/kr.zip" -d "$tmp/kro"
            mv "$(find "$tmp/kro" -mindepth 1 -maxdepth 1 -type d | head -1)" "$tmp/kr"
          fi
          git checkout --orphan kr-reference
          git rm -rf . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git/' "$tmp/kr/" ./
          git add -A
          git commit -m "기존 eraNASKR 번역 참고본 가져오기"
          git push -f origin kr-reference
          git checkout main

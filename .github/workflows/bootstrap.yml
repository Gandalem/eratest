name: Bootstrap eraNAS sources

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Import PopsTW source into main
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          git clone --depth 1 --branch dev/omogatari-kai https://gitgud.io/mrpopsalot/pops-tw.git "$tmp/pops"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$tmp/pops/." .
          rm -rf .gitlab
          rm -rf .git
        continue-on-error: true

      - name: Fallback import PopsTW archive
        shell: bash
        run: |
          if [ ! -d ERB ]; then
            tmp="$(mktemp -d)"
            curl -fL --retry 3 -o "$tmp/pops.zip" "https://gitgud.io/mrpopsalot/pops-tw/-/archive/dev/omogatari-kai/pops-tw-dev-omogatari-kai.zip"
            unzip -q "$tmp/pops.zip" -d "$tmp/out"
            root="$(find "$tmp/out" -mindepth 1 -maxdepth 1 -type d | head -1)"
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
            cp -a "$root/." .
          fi

      - name: Restore repository metadata and commit main
        shell: bash
        run: |
          git init
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" || true
          git fetch origin main
          git checkout -B main origin/main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "원본 eraNAS 소스 가져오기" || true
          git push origin main

      - name: Import existing Korean translation as reference branch
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          if git clone --depth 1 https://gitgud.io/TakenTextbung/eranaskr.git "$tmp/kr"; then
            :
          else
            curl -fL --retry 3 -o "$tmp/kr.zip" "https://gitgud.io/TakenTextbung/eranaskr/-/archive/master/eranaskr-master.zip"
            mkdir -p "$tmp/kro"
            unzip -q "$tmp/kr.zip" -d "$tmp/kro"
            mv "$(find "$tmp/kro" -mindepth 1 -maxdepth 1 -type d | head -1)" "$tmp/kr"
          fi
          git checkout --orphan kr-reference
          git rm -rf . || true
          cp -a "$tmp/kr/." .
          rm -rf .git
          git add -A
          git commit -m "기존 eraNASKR 번역 참고본 가져오기"
          git push -f origin kr-reference
          git checkout main

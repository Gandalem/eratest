name: Batch Korean pass 19

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-19.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate armor display names and descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_Armors.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          full = {
              'Cactus Company Power Armor Helmet「Powerlibre」': 'Cactus Company 파워 아머 헬멧「Powerlibre」',
              'power armor helmet': '파워 아머 헬멧',
              'Cactus Company Extravehicular Activity Helmet「Libreair」': 'Cactus Company 선외활동 헬멧「Libreair」',
              'extravehicular activity helmet': '선외활동 헬멧',
              'Gensou-chan Ground Protection Top Headdress「GPT-H 72B」': 'Gensou-chan 지상 방호 헤드드레스「GPT-H 72B」',
              'ultratech headdress': '울트라테크 헤드드레스',
              'ArmTeck Soft Armor「SFA-08」': 'ArmTeck 소프트 아머「SFA-08」',
              'anti-stab vest': '방검 조끼',
              'ArmTeck Armor Carrier「AC-11ARS」': 'ArmTeck 아머 캐리어「AC-11ARS」',
              'ballistic vest': '방탄 조끼',
              'ArmTeck Heavy Armor Carrier「AC-15ARS」': 'ArmTeck 중형 아머 캐리어「AC-15ARS」',
              'heavy plate carrier': '중형 플레이트 캐리어',
              'Cactus Company Light Powered Armor「Frontline」': 'Cactus Company 경량 파워 아머「Frontline」',
              'light power armor': '경량 파워 아머',
              'Cactus Company Powered Armor「Aegis」': 'Cactus Company 파워 아머「Aegis」',
              'power armor': '파워 아머',
              'Nizhny Novgorod Anti-Shrapnel Vest「6B2」': 'Nizhny Novgorod 방편 조끼「6B2」',
              'anti-shrapnel vest': '방편 조끼',
              'ArmTeck UN Body Armor「AC-UNTAR」': 'ArmTeck UN 방탄복「AC-UNTAR」',
              'UN body armor': 'UN 방탄복',
              'Nizhny Novgorod Ballistic Vest「ZhP」': 'Nizhny Novgorod 방탄 조끼「ZhP」',
              'Russian light ballistic vest': '러시아 경량 방탄 조끼',
              'Nizhny Novgorod Ballistic Vest「Zh-3」': 'Nizhny Novgorod 방탄 조끼「Zh-3」',
              'Russian ballistic vest': '러시아 방탄 조끼',
              '11.2 Tactical Concealable Reinforced Vest「CRV」': '11.2 Tactical 은닉형 강화 조끼「CRV」',
              'concealable reinforced vest': '은닉형 강화 조끼',
              '11.2 Tactical Minimal Plate Carrier「MPC」': '11.2 Tactical 경량 플레이트 캐리어「MPC」',
              'minimal plate carrier': '경량 플레이트 캐리어',
              '「Improved Outer Tactical Vest Gen IV」 (high mobility kit)': '「Improved Outer Tactical Vest Gen IV」 (고기동 키트)',
              'Nizhny Novgorod Plate Carrier「Zh-14」': 'Nizhny Novgorod 플레이트 캐리어「Zh-14」',
              'Ceramic plate carrier': '세라믹 플레이트 캐리어',
              '「Improved Outer Tactical Vest Gen IV」 (assault kit)': '「Improved Outer Tactical Vest Gen IV」 (돌격 키트)',
              '「Improved Outer Tactical Vest Gen IV」 (full protection)': '「Improved Outer Tactical Vest Gen IV」 (완전 방호)',
          }

          desc = {
              'A heavily-armored high-tech helmet with AR screen, it also includes a laser range finder coupled to a ballistic computer linked to the sights to ensure that the user aims the weapon accurately.':
                  'AR 화면을 갖춘 중장갑 첨단 헬멧이다. 조준경과 연동되는 탄도 컴퓨터 및 레이저 거리 측정기가 포함되어 있어 사용자가 무기를 더 정확하게 조준할 수 있다.',
              'The Libreair is a vacuum sealed helmet made for extravehicular activities. It is intended to be used with an EVA suit for protection against sealed and unsafe atmospheres. It can also provide basic ballistic protection.':
                  'Libreair는 선외활동용으로 제작된 진공 밀폐 헬멧이다. EVA 슈트와 함께 사용해 진공이나 위험한 대기로부터 사용자를 보호하며, 기본적인 탄도 방호 기능도 제공한다.',
              "Ground Protection Tops are the Federation's primary protection against damage to its infantry. The H top may look like an average maid headdress, but once you put it on, it provides a full heads-up display displaying vitals, health, location, and much more, all with the power of Youjutsu (and MakAI). A shield provides protection to the head and neck, equivalent to the regular GPT 72B":
                  'Ground Protection Top은 연방 보병의 주력 방호 장비다. H형은 평범한 메이드 헤드드레스처럼 보이지만 착용하면 생체 정보, 건강 상태, 위치 등을 표시하는 완전한 HUD를 제공하며 요술과 MakAI 기술로 구동된다. 방어막은 일반 GPT 72B와 동급의 머리와 목 보호 성능을 제공한다.',
              'Light but durable and reliable body armor protecting only the vital areas, fitted with Class 3 armor weaving.':
                  '가볍지만 튼튼하고 신뢰성이 높은 방탄복으로, 주요 급소만 보호하며 3등급 방탄 직조 소재가 적용되어 있다.',
              'The ArmTeck AC-11ARS (Abrasion Resistant Steel) is plate armor vest, popular among AIA agents and mercinaries amoung the outside world. The lightweight AR500 class 7 (European VPAM) protection plates cover only the chest and back areas.':
                  'ArmTeck AC-11ARS(Abrasion Resistant Steel)는 외부 세계의 AIA 요원과 용병들이 자주 사용하는 플레이트 방탄 조끼다. 경량 AR500 7등급(유럽 VPAM 기준) 방호판이 가슴과 등 부위만 보호한다.',
              'A simple yet effective plate carrier by ArmTeck Incorporated. The most minimalistic design intended for use with chest rigs. ARS means Abrasion Resistant Steel plates and helps keep trauma to a minimum. Comes in black, tan and olive.':
                  'ArmTeck Incorporated가 만든 단순하지만 효과적인 플레이트 캐리어다. 체스트 리그와 함께 쓰도록 최소한의 구조로 설계되었다. ARS는 Abrasion Resistant Steel 방호판을 뜻하며 충격을 줄이는 데 도움을 준다. 검정, 탄색, 올리브색으로 제공된다.',
              "The Frontline is the golden standard of Seihou power armor. As a topper to Cactus' own Librebody extravehicular activity (EVA) suits, it is covered in moderately thick Seihou-grade plasteel. It alone can stop high caliber Outsider Earth bullets such as .300 Windurger Magnum and low caliber Spacer projectiles like 5.8x62mm AImthropic, while also not affecting movement":
                  'Frontline은 세이호 파워 아머의 표준으로 여겨지는 장비다. Cactus의 Librebody 선외활동(EVA) 슈트 위에 착용하며, 중간 두께의 세이호 등급 플라스틸 장갑으로 덮여 있다. 움직임을 크게 제한하지 않으면서 .300 Windurger Magnum 같은 외부 지구의 대구경 탄과 5.8x62mm AImthropic 같은 스페이서 소구경 탄을 막아낼 수 있다.',
              'The Aegis powered armor is a heavy powered armor designed for long-range combat, its force shield with high recharge speed can provide sufficient protection for ranged weapon users.':
                  'Aegis는 장거리 전투용으로 설계된 중형 파워 아머다. 재충전 속도가 빠른 역장 방패가 원거리 무기 사용자에게 충분한 방호력을 제공한다.',
              'An old army body armor from Afghanistan war times, mainly designed to protect against pistol bullets and explosion fragments. It fulfilled its mission, but was soon replaced by bulletproof vests with differentiated protection.':
                  '아프가니스탄 전쟁 시기에 사용된 구형 군용 방탄복으로, 주로 권총탄과 폭발 파편을 막도록 설계되었다. 제 역할은 했지만 이후 부위별 방호 성능을 강화한 신형 방탄 조끼로 빠르게 대체되었다.',
              '5-class body armor used by UN soldiers during a UNTAR mission. Manufactured by ArmTeck Incorporated.':
                  'UNTAR 임무 중 UN 병력이 사용하는 5등급 방탄복이다. ArmTeck Incorporated에서 제조했다.',
              'The "ZhP" body armor is designed for the police special forces. The bulletproof vest provides circular protection of the human torso. Elements of the damper provide ventilation of the under armor space and reduce the blunt damage.':
                  'ZhP 방탄복은 경찰 특수부대를 위해 설계되었다. 상체를 둘러싸는 전방위 방호를 제공하며, 완충 구조가 방탄복 내부의 통풍을 돕고 둔상 피해를 줄여 준다.',
              'The "Zh-3" main armored vest for personnel of combat units of the ground forces, airborne troops, marines, etc. The vest is designed to protect vital organs from being hit by firearms, shell fragments, mines, grenades, and cold weapons, reducing the severity of armor contusion injury when performing combat missions.':
                  'Zh-3은 지상군 전투부대, 공수부대, 해병대 등에서 사용하는 주력 방탄 조끼다. 총탄, 포탄 파편, 지뢰, 수류탄, 냉병기로부터 주요 장기를 보호하고 전투 임무 중 발생하는 장갑 충격 손상의 정도를 줄이도록 설계되었다.',
              'The Concealable Reinforced Vest enables the overt or covert carrying of soft ballistic panels providing 360 degrees protection against high-speed fragments and handgun ammunition. Adding hard ballistic plates enables protection against rifle ammunition for the vital organs. The ergonomic shape of the soft ballistic panels and the position of the back plate combined with the integrated lumbar support belt provides comfort and stability close to the body’s center of mass. Manufactured by 11.2 Tactical.':
                  '은닉형 강화 조끼는 연질 방탄 패널을 겉으로 드러내거나 옷 안에 숨겨 착용할 수 있으며, 고속 파편과 권총탄에 대해 360도 방호를 제공한다. 경질 방탄판을 추가하면 주요 장기를 소총탄으로부터 보호할 수 있다. 인체공학적으로 설계된 연질 패널과 등판, 일체형 허리 지지 벨트가 몸의 중심 가까이에서 편안함과 안정성을 제공한다. 11.2 Tactical에서 제조했다.',
              'A plate carrier by 11.2 Tactical. A minimalistic version designed to be used with chest rigs. Multicam Black version.':
                  '11.2 Tactical에서 만든 플레이트 캐리어다. 체스트 리그와 함께 사용하도록 최소한의 구조로 설계되었으며, 멀티캠 블랙 버전이다.',
              'The Improved Outer Tactical Vest (IOTV) Gen IV is designed to permit maximum freedom of movement required to assume correct firing positions with the agility to execute and maneuver tasks. Optimal design characteristics ensure the best possible weight distribution of both the ballistic body armor system as well as additional load bearing equipment, thus providing enhanced comfort, wear duration, and mobility.':
                  'Improved Outer Tactical Vest(IOTV) Gen IV는 정확한 사격 자세를 취하면서도 기동 임무를 수행할 수 있도록 최대한의 움직임 자유를 제공하도록 설계되었다. 방탄 체계와 추가 휴대 장비의 무게를 효율적으로 분산해 착용감, 장시간 착용성, 기동성을 높인다.',
              'The Zh-14 assault bulletproof vest is designed for assault units of the Ministry of Internal Affairs and other law enforcement agencies. A special variant of Zh-14 armor is equipped with ceramic armored panels based on corundum (5th GOST class protection).':
                  'Zh-14 돌격용 방탄 조끼는 내무부 및 기타 법집행기관의 돌격 부대를 위해 설계되었다. 특수형 Zh-14에는 코런덤 기반 세라믹 방탄판이 장착되며 GOST 5등급 방호 성능을 제공한다.',
          }

          # Only FullName and FullDesc are localized. Internal 名前 fields are intentionally untouched.
          lines = text.splitlines(True)
          mode = None
          total = 0
          rx = re.compile(r'^(\s*CALLF MAKE_STR\(V_NAME,\s*@?)"((?:\\.|[^"\\])*)"(\)\s*)$')
          for i, line in enumerate(lines):
              nl = '\r\n' if line.endswith('\r\n') else ('\n' if line.endswith('\n') else '')
              core = line[:-len(nl)] if nl else line
              s = core.strip()
              if s == 'CASE "FullName"':
                  mode = 'FullName'
                  continue
              if s == 'CASE "FullDesc"':
                  mode = 'FullDesc'
                  continue
              if s.startswith('CASE '):
                  mode = None
                  continue
              if mode not in ('FullName','FullDesc'):
                  continue
              m = rx.match(core)
              if not m:
                  continue
              val = m.group(2)
              mapping = full if mode == 'FullName' else desc
              if val in mapping:
                  lines[i] = m.group(1) + '"' + mapping[val] + '"' + m.group(3) + nl
                  total += 1
                  print(mode, val[:90], '->', mapping[val][:90])

          text2 = ''.join(lines)
          if total < 35:
              raise SystemExit(f'Too few replacements: {total}')

          out = text2.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          print('TOTAL_REPLACEMENTS', total)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff -U0 -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_Armors.ERB' | grep -E '^[+-][[:space:]]*CASE "名前"|^[+-].*@.*_ID'; then
            echo 'Internal armor identifier structure changed'; exit 1
          fi
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_Armors.ERB'
          git commit -m '방어구 표시명 및 설명 한글화 19차'
          git push origin HEAD:korean

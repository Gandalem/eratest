name: Batch Korean pass 62 bulk mode

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-62.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Diagnose multiple structured UI files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = [
              'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB',
              'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Magazines.ERB',
              'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Ammunition.ERB',
          ]
          eng = re.compile(r'[A-Za-z]{2,}')
          hangul = re.compile(r'[가-힣]')
          literal = re.compile(r'CALLF MAKE_STR\(V_NAME,\s*(?:@)?"((?:\\.|[^"\\])*)"\)')
          case_re = re.compile(r'^\s*CASE "([^"]+)"\s*$')

          for path in files:
              p = Path(path)
              raw = p.read_bytes()
              assert raw.startswith(b'\xef\xbb\xbf'), f'BOM missing: {path}'
              lines = raw.decode('utf-8-sig').splitlines()
              field = None
              rows = []
              for lineno, line in enumerate(lines, 1):
                  stripped = line.lstrip()
                  if stripped.startswith(';'):
                      continue
                  cm = case_re.match(line)
                  if cm:
                      v = cm.group(1)
                      field = v if v in {'名前','描写'} else None
                      continue
                  if field:
                      sm = literal.search(line)
                      if sm:
                          value = sm.group(1)
                          if eng.search(value) and not hangul.search(value):
                              rows.append((lineno, field, value))
              print(f'=== {path} ===')
              print(f'ENGLISH_ONLY_ACTIVE_VISIBLE={len(rows)}')
              print(f'NAMES={sum(1 for _,f,_ in rows if f == "名前")} DESCS={sum(1 for _,f,_ in rows if f == "描写")}')
              for lineno, field, value in rows:
                  print(f'{lineno}\t{field}\t{value}')
          PY

name: Batch Korean pass 11

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-11.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate pistol display names and description
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/300 Pistols.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          reps = [
            ('Fairy Tactical Semi-Automatic Pistol「CC⑮」', '요정 택티컬 반자동 권총「CC⑮」'),
            ('Fairy Tactical Machine Pistol「⑨」', '요정 택티컬 기관권총「⑨」'),
            ('YMKA .44 Revolver 「Sheriff」', 'YMKA .44 리볼버 「Sheriff」'),
            ('Keiga Youjutsu-Series Pistol「Youjyuu-P」', '케이가 요술 시리즈 권총「Youjyuu-P」'),
            ('Broughton .45 Automatic Broughton Pistol「ABP」', 'Broughton .45 자동권총「ABP」'),
            ('AImthropic Smart Pistol「Summers」', 'AImthropic 스마트 권총「Summers」'),
            ('LUNINCO Laser Pistol「LAC2」', 'LUNINCO 레이저 권총「LAC2」'),
            ('Akatsuki Tanegashima Pistol「Tanhiken」', '아카츠키 타네가시마 권총「Tanhiken」'),
            ('Akatsuki Filntlock Revolver「Ansatsu」', '아카츠키 플린트록 리볼버「Ansatsu」'),
            ('EFun Electroshock Pistol「Neutralizer」', 'EFun 전기충격 권총「Neutralizer」'),
            ('Windurger "S.Pistol" No.2 Silent Pistol', 'Windurger "S.Pistol" No.2 소음 권총'),
            ('Makeshift Semi-Automatic Pistol「Lolife」', '급조 반자동 권총「Lolife」'),

            ('CALLF MAKE_STR(V_NAME, "autopistol")', 'CALLF MAKE_STR(V_NAME, "자동권총")'),
            ('CALLF MAKE_STR(V_NAME, "machine pistol")', 'CALLF MAKE_STR(V_NAME, "기관권총")'),
            ('CALLF MAKE_STR(V_NAME, ".44 magnum")', 'CALLF MAKE_STR(V_NAME, ".44 매그넘")'),
            ('CALLF MAKE_STR(V_NAME, "Recharger pistol")', 'CALLF MAKE_STR(V_NAME, "충전식 권총")'),
            ('CALLF MAKE_STR(V_NAME, "classic autopistol")', 'CALLF MAKE_STR(V_NAME, "클래식 자동권총")'),
            ('CALLF MAKE_STR(V_NAME, "smart pistol")', 'CALLF MAKE_STR(V_NAME, "스마트 권총")'),
            ('CALLF MAKE_STR(V_NAME, "laser pistol")', 'CALLF MAKE_STR(V_NAME, "레이저 권총")'),
            ('CALLF MAKE_STR(V_NAME, "Tanegashima pistol")', 'CALLF MAKE_STR(V_NAME, "타네가시마 권총")'),
            ('CALLF MAKE_STR(V_NAME, "Flintlock revolver pistol")', 'CALLF MAKE_STR(V_NAME, "플린트록 리볼버 권총")'),
            ('CALLF MAKE_STR(V_NAME, "stun gun")', 'CALLF MAKE_STR(V_NAME, "전기충격기")'),
            ('CALLF MAKE_STR(V_NAME, "tranquilizer pistol")', 'CALLF MAKE_STR(V_NAME, "진정제 권총")'),
            ('CALLF MAKE_STR(V_NAME, "makeshift pistol")', 'CALLF MAKE_STR(V_NAME, "급조 권총")'),

            ('A cheap, low quality "saturday-night special" kind of gun, Fairy Tactical promises the CC15 to be a Gensokyan-made pistol, comparable to weapons like the Tricorne CCW15 that its based off of and Deterrence Dispensed Model 17, however its outclassed by both of them. Despite the underwhelming performance, the CC15 is still widely used as a low cost weapon to arm non Danmaku capable humans without resorting to melee or makeshift weaponry.',
             '값싸고 품질이 낮은 이른바 "새터데이 나이트 스페셜" 계열의 권총이다. Fairy Tactical은 CC15가 기반이 된 Tricorne CCW15나 Deterrence Dispensed Model 17과 비슷한 환상향산 권총이라고 홍보하지만, 실제 성능은 두 무기보다 떨어진다. 그래도 저렴한 가격 덕분에 탄막을 사용할 수 없는 인간에게 근접 무기나 급조 무기 대신 지급하는 용도로 널리 사용된다.'),
          ]

          total = 0
          for old, new in reps:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  total += c
                  print('REPLACED', c, old[:90])

          if total < 20:
              raise SystemExit(f'Too few replacements: {total}')

          out = text.encode('utf-8')
          p.write_bytes((b'\xef\xbb\xbf' + out) if bom else out)
          print('TOTAL_REPLACEMENTS', total)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          # Do not change internal lookup fields or weapon mechanics keys.
          ! git diff -U0 -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/300 Pistols.ERB' | grep -E '^[-+][[:space:]]*CASE "(名前|Type|Class|Platform|Ammo|Tags|Weapon[^\"]*/Default|Research Required)"' || { echo 'Internal weapon field changed'; exit 1; }
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/300 Firearms/300 Pistols.ERB'
          git commit -m '권총 표시명 및 설명 한글화 11차'
          git push origin HEAD:korean

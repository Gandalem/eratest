name: Batch Korean pass 22

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-22.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate more spell cards and weapon selection UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          spell = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB')
          raw = spell.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          anchor = '\tCASE "Scattered Spirit 「Dream Seal -Worn-」"\n\t\tRETURNF "산령 「몽상봉인 -마모-」"\nENDSELECT\nRETURNF RawName'
          if anchor not in text:
              raise SystemExit('SpellCardDisplayName anchor not found')

          extra_cases = '\n'.join([
              '\tCASE "Flower Sign 「Gorgeous Sweet Flower」"', '\t\tRETURNF "화부 「화려한 스위트 플라워」"',
              '\tCASE "Otherworld 「Oumagatoki」"', '\t\tRETURNF "이계 「오우마가토키」"',
              '\tCASE "Generic Bomb"', '\t\tRETURNF "범용 봄"',
              '\tCASE "「Chaos Skip」"', '\t\tRETURNF "「카오스 스킵」"',
              '\tCASE "Dream Land 「Great Duplex Barrier」"', '\t\tRETURNF "몽경 「대이중결계」"',
              '\tCASE "Night Sign 「Night Bird」"', '\t\tRETURNF "야부 「나이트 버드」"',
              '\tCASE "Hail Sign 「Hailstorm」"', '\t\tRETURNF "박부 「헤일스톰」"',
              '\tCASE "Conjuring 「Misdirection」"', '\t\tRETURNF "기예 「미스디렉션」"',
              '\tCASE "Water Sign 「Princess Undine」"', '\t\tRETURNF "수부 「프린세스 운디네」"',
              '\tCASE "Flower Sign 「Selaginella 9」"', '\t\tRETURNF "화부 「셀라기넬라 9」"',
              '\tCASE "Impossible Request 「Jewel from the Dragon\'s Neck -Five-Colored Shots-」"', '\t\tRETURNF "난제 「용의 목의 구슬 -오색의 탄환-」"',
              '\tCASE "Earth 「Impurity Within One\'s Body」"', '\t\tRETURNF "대지 「몸속의 부정」"',
          ])
          text = text.replace(anchor, anchor.replace('\nENDSELECT\nRETURNF RawName', '\n' + extra_cases + '\nENDSELECT\nRETURNF RawName'), 1)

          descs = [
              ('Meiling makes an expanding flower pattern with yellow crystal shard-like bullets at a random starting point, as she shoots slow rings of red shard-like bullets aimed at the player.',
               'Meiling이 임의의 지점에서 노란 수정 파편 같은 탄환으로 확장되는 꽃무늬를 만들고, 동시에 플레이어를 노리는 느린 붉은 파편 탄환 고리를 발사한다.'),
              ('A generic bomb. Maxes out your dodge.',
               '범용 폭탄이다. 회피 능력을 최대치로 끌어올린다.'),
              ('Slow the target for a short time by suppressing motor activity in the brain',
               '뇌의 운동 활동을 억제해 짧은 시간 동안 대상의 움직임을 느리게 만든다.'),
              ("No matter how hard you run after Reimu, she just gets further away. Have you ever had an experience like this? That's the power of Duplex Barrier.",
               '아무리 Reimu를 뒤쫓아도 거리는 오히려 더 벌어진다. 이런 경험을 해 본 적 있는가? 그것이 이중결계의 힘이다.'),
              ('Wielder shoots arcs of bullets, one of the bullets in the arc being aimed at the target.',
               '사용자가 호를 그리는 탄막을 발사하며, 그중 한 발은 목표를 직접 조준한다.'),
              ('Cirno shoots multiple lines of shard-like bullets in a wave of circles around her that stop, then each circle takes a seemingly ordered direction in an arc below herself.',
               'Cirno가 자신을 둘러싼 여러 겹의 원형 파동으로 파편 같은 탄환을 연속 발사한다. 탄환은 잠시 멈춘 뒤 각 원이 일정한 순서를 따르는 듯 아래쪽 호를 그리며 이동한다.'),
              ('Sakuya launches a flurry of aimed, kunai-shaped red bullets while she dashes to the side, then shortly appears on the other side and throws aimed knives.',
               'Sakuya가 옆으로 빠르게 이동하며 목표를 노린 붉은 쿠나이형 탄막을 퍼붓고, 곧 반대편에 나타나 다시 조준한 나이프를 던진다.'),
              ('She shoots 3-way thin lasers aimed at the player while expeding blue bullets from above herself. Then she shoots multiple lines of large aimed bullets, as she shoots a 3-way pattern of slow, medium sized blue bullets that also aim at the player.',
               '플레이어를 조준하는 3방향 가느다란 레이저를 쏘는 동시에 자신의 위쪽에서 파란 탄환을 퍼뜨린다. 이어서 큰 조준탄을 여러 줄 발사하고, 플레이어를 노리는 느린 중형 파란 탄환 3방향 패턴도 함께 전개한다.'),
              ('The base is similar to the previous spell card, but meiling starts lower, the yellow bullets redirect themselves twice to form a simpler pattern, and the red aimed rings are much faster.',
               '기본 구조는 이전 스펠카드와 비슷하지만 Meiling이 더 낮은 위치에서 시작한다. 노란 탄환은 두 번 방향을 바꾸며 더 단순한 패턴을 만들고, 붉은 조준 고리는 훨씬 빠르다.'),
              ("One of the impossible requests that %CALLNAME:62% presented. Each jewel contains stars, and it's said that if you collect 7 of them, it'll grant anything you wish",
               '%CALLNAME:62%이 제시한 난제 중 하나다. 각각의 구슬 안에는 별이 담겨 있으며, 일곱 개를 모으면 어떤 소원이든 이루어진다고 한다.'),
              ('Teleport the target to a random position near where it started. Objects above a certain size cannot be teleported.',
               '대상을 처음 위치 근처의 무작위 지점으로 순간이동시킨다. 일정 크기 이상의 물체는 순간이동시킬 수 없다.'),
          ]
          desc_count = 0
          for old, new in descs:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  desc_count += c
                  print('SPELL_DESC', c, old[:90])
          if desc_count < 11:
              raise SystemExit(f'Too few spell descriptions translated: {desc_count}')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          spell.write_bytes(out)

          holster = Path('ERB/TRANSLATION/OMOGATARI/ITEM/HolsterMenu.ERB')
          raw = holster.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          disp_line = '#DIMS CONST DispName = "Blunt Melee", "Blades", "Throwing", "Pistols", "Rifles", "Shotguns", "Machine Guns", "Explosives", "Bows", "Youjutsu", "Hybrid", "All"'
          tr_line = '#DIMS CONST DispNameTR = "둔기", "도검", "투척", "권총", "소총", "산탄총", "기관총", "폭발물", "활", "요술", "하이브리드", "전체"'
          if tr_line not in text:
              if disp_line not in text:
                  raise SystemExit('DispName definition not found')
              text = text.replace(disp_line, disp_line + '\n' + tr_line, 1)

          reps = [
              ('PRINTBUTTON DispName:LOCAL, LOCAL + 8002', 'PRINTBUTTON DispNameTR:LOCAL, LOCAL + 8002'),
              ('PRINTFORML ＜N/A＞　%LIST_TYPE_TR%', 'PRINTFORML ＜없음＞　%LIST_TYPE_TR%'),
              (' (Religion Forbids)', ' (종교상 금지)'),
              (' (Cannot Hold: ', ' (들 수 없음: '),
              ('COND_STR("Clone",TFLAG:989)', 'COND_STR("복제",TFLAG:989)'),
              ('COND_STR("Anti-Theft Settings",WeaponHasAntiTheft(C_ID,SelectedWeapon))', 'COND_STR("도난 방지 설정",WeaponHasAntiTheft(C_ID,SelectedWeapon))'),
          ]
          hcount = 0
          for old, new in reps:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  hcount += c
                  print('HOLSTER', c, old)
          if hcount < 6:
              raise SystemExit(f'Too few holster replacements: {hcount}')
          if 'LIST_TYPE \'= DispName:PAGE' not in text:
              raise SystemExit('Internal weapon category assignment changed')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          holster.write_bytes(out)
          print('SPELL_DESCRIPTIONS', desc_count)
          print('HOLSTER_REPLACEMENTS', hcount)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff -U0 -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB' | grep -E '^[+-][[:space:]]*CASE "名前"|^[+-].*@SpellCard[0-9]+\('; then
            echo 'Internal spell-card identifier structure changed'; exit 1
          fi
          if git diff -U0 -- 'ERB/TRANSLATION/OMOGATARI/ITEM/HolsterMenu.ERB' | grep -E '^[+-].*LIST_TYPE \'= DispName:PAGE'; then
            echo 'Internal weapon category assignment changed'; exit 1
          fi
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/HolsterMenu.ERB'
          git commit -m '스펠카드 및 무기 선택 UI 한글화 22차'
          git push origin HEAD:korean

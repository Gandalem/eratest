name: Batch Korean pass 54

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-54.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1

      - name: Translate remaining barrel-extension UI strings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrel Extensions.ERB')
          raw = p.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('UTF-8 BOM missing before edit')
          text = raw.decode('utf-8-sig')
          before = text

          name_rules = {
              52: ('Final Extensions Illusion 9 9x19 sound suppressor', '파이널 익스텐션즈 일루전 9 9x19 소음기'),
              53: ('GH SRD9 9x19 sound suppressor', 'GH SRD9 9x19 소음기'),
              54: ('Hexagon 12K 12ga sound suppressor', '헥사곤 12K 12ga 소음기'),
              55: ('SVG-76 PBS-4 5.45x39 sound suppressor', 'SVG-76 PBS-4 5.45x39 소음기'),
              56: ('SVG-76 Hexagon 5.45x39 sound suppressor', 'SVG-76 헥사곤 5.45x39 소음기'),
              57: ('SVG-67 Omotics DTK-4M 7.62x39 sound suppressor', 'SVG-67 오모틱스 DTK-4M 7.62x39 소음기'),
              58: ('SVG-67 Hexagon 7.62x39 sound suppressor', 'SVG-67 헥사곤 7.62x39 소음기'),
              59: ('Rotor 43 9x19 muzzle brake-compensator', '로터 43 9x19 총구 제동 보정기'),
              60: ('Rotor 43 7.62x39 muzzle brake-compensator', '로터 43 7.62x39 총구 제동 보정기'),
              61: ('Rotor 43 5.56x45 muzzle brake-compensator', '로터 43 5.56x45 총구 제동 보정기'),
              62: ('PPB 9x18PB sound suppressor', 'PPB 9x18PB 소음기'),
              63: ('Final Extensions Salvo 12 12ga sound suppressor', '파이널 익스텐션즈 살보 12 12ga 소음기'),
              64: ('GH54SD GH 9x19 sound suppressor', 'GH54SD GH 9x19 소음기'),
              65: ('Final Extensions Osprey 9 9x19 sound suppressor', '파이널 익스텐션즈 오스프리 9 9x19 소음기'),
              66: ('PPG-9 9x19 sound suppressor', 'PPG-9 9x19 소음기'),
              67: ('Phantom Dynamics MMS 556 5.56x45 sound suppressor', '팬텀 다이나믹스 MMS 556 5.56x45 소음기'),
              68: ('SVG-67 PBS-1 7.62x39 sound suppressor', 'SVG-67 PBS-1 7.62x39 소음기'),
              69: ('PB 9x18PB sound suppressor', 'PB 9x18PB 소음기'),
              70: ('SVG-76 TGP-A 5.45x39 sound suppressor', 'SVG-76 TGP-A 5.45x39 소음기'),
              71: ('CB-336 9x18PB sound suppressor', 'CB-336 9x18PB 소음기'),
              72: ('GH PWN Attenuator 5.7x28 sound suppressor', 'GH PWN 어테뉴에이터 5.7x28 소음기'),
              73: ('Phantom Dynamics MMS 762 7.62x51 sound suppressor', '팬텀 다이나믹스 MMS 762 7.62x51 소음기'),
              74: ('Rotor 43 7.62x54R muzzle brake-compensator', '로터 43 7.62x54R 총구 제동 보정기'),
              75: ('FTN.4 Deterrence Dispensed Pistol 9x19 sound suppressor', 'FTN.4 디터런스 디스펜스드 권총용 9x19 소음기'),
              76: ('Universal Rail Set', '범용 레일 세트'),
              77: ('RTFM Tricorne 9x19 compensator', 'RTFM 트라이코른 9x19 보정기'),
              78: ('LAC666 LUNINCO Youjutsu 8-bullet splitter', 'LAC666 LUNINCO 요술 8발 분할기'),
              79: ('LAC666 LUNINCO Youjutsu concentrator', 'LAC666 LUNINCO 요술 집속기'),
              80: ('MaBooru Psionic explosive fire overloader', '마보루 사이오닉 폭발 화염 오버로더'),
              81: ('S.Pistol Windurger 12.7x35mm sound suppressor', 'S.피스톨 윈더거 12.7x35mm 소음기'),
          }
          desc_rules = {
              11: ('The \\"Reactor\\" prototype muzzle brake manufactured by Hexagon for 5.45x39 SVG platforms. Features mounts required for installation of the \\"Wafflemaker\\" sound suppressor.', '헥사곤이 5.45x39 SVG 플랫폼용으로 제작한 「리액터」 프로토타입 총구 제동기다. 「와플메이커」 소음기 장착에 필요한 마운트를 갖추고 있다.'),
              24: ('Muzzle brake and compensator \\"Noveske style\\" for the GH SMG and weapon systems based on it. Produced by GH.', 'GH SMG 및 이를 기반으로 한 무기 시스템용 「노베스키 스타일」 총구 제동기 겸 보정기다. GH에서 제작했다.'),
              51: ('The \\"Wafflemaker\\" prototype sound suppressor manufactured by Hexagon, designed for installation on the Hexagon \\"Reactor\\" muzzle brake.', '헥사곤이 제작한 「와플메이커」 프로토타입 소음기로, 헥사곤 「리액터」 총구 제동기에 장착하도록 설계되었다.'),
              55: ('The PBS-4 (Pribór Besshúmnoy Strel\'bý - \\"Silent Firing Device\\") sound suppressor, manufactured by TSNIITochMash for use as a part of the \\"Canary\\" assault rifle grenade launcher system.', 'PBS-4(Pribór Besshúmnoy Strel\'bý, 「무소음 사격 장치」) 소음기로, 「카나리아」 돌격소총 유탄발사기 시스템의 일부로 사용하기 위해 TSNIITochMash에서 제작했다.'),
              70: ('Tactical muzzle device/suppressor TGP-A, manufactured by State R&D Agency \\"Special devices and Comms\\" for SVG-based 5.45x39 automatic rifles.', 'SVG 기반 5.45x39 자동소총용 전술 총구장치/소음기 TGP-A로, 국립 연구개발 기관 「특수 장비 및 통신」에서 제작했다.'),
          }
          if len(name_rules) != 30 or len(desc_rules) != 5:
              raise SystemExit(f'rule count mismatch: names={len(name_rules)} descs={len(desc_rules)}')

          case_counts_before = Counter(re.findall(r'^\s*CASE "([^"]+)"', before, re.M))
          func_count_before = len(re.findall(r'^@WeaponBarrel\d+\(ARG, O_DATA, V_NAME\)\s*$', before, re.M))

          func_re = re.compile(r'(?ms)^@WeaponBarrel(\d+)\(ARG, O_DATA, V_NAME\)\s*$.*?(?=^@WeaponBarrel\d+\(ARG, O_DATA, V_NAME\)\s*$|\Z)')
          seen_names = set()
          seen_descs = set()
          changed = 0

          def replace_field(block, item_id, case_name, old, new):
              case_match = re.search(rf'(?ms)^\s*CASE "{re.escape(case_name)}"\s*$.*?(?=^\s*CASE "|\Z)', block)
              if not case_match:
                  raise SystemExit(f'ID {item_id}: CASE {case_name} missing')
              segment = case_match.group(0)
              needle = f'CALLF MAKE_STR(V_NAME, "{old}")'
              replacement = f'CALLF MAKE_STR(V_NAME, "{new}")'
              count = segment.count(needle)
              if count != 1:
                  raise SystemExit(f'ID {item_id} {case_name}: expected one anchor, got {count}: {old}')
              new_segment = segment.replace(needle, replacement, 1)
              start, end = case_match.span()
              return block[:start] + new_segment + block[end:]

          def repl(m):
              global changed
              item_id = int(m.group(1))
              block = m.group(0)
              if item_id in name_rules:
                  old, new = name_rules[item_id]
                  block = replace_field(block, item_id, '名前', old, new)
                  seen_names.add(item_id)
                  changed += 1
              if item_id in desc_rules:
                  old, new = desc_rules[item_id]
                  block = replace_field(block, item_id, '描写', old, new)
                  seen_descs.add(item_id)
                  changed += 1
              return block

          text = func_re.sub(repl, text)
          missing_names = sorted(set(name_rules) - seen_names)
          missing_descs = sorted(set(desc_rules) - seen_descs)
          if missing_names or missing_descs:
              raise SystemExit(f'missing rules: names={missing_names} descs={missing_descs}')
          if changed != 35:
              raise SystemExit(f'changed count mismatch: {changed}')

          case_counts_after = Counter(re.findall(r'^\s*CASE "([^"]+)"', text, re.M))
          if case_counts_after != case_counts_before:
              raise SystemExit('CASE schema counts changed')
          func_count_after = len(re.findall(r'^@WeaponBarrel\d+\(ARG, O_DATA, V_NAME\)\s*$', text, re.M))
          if func_count_after != func_count_before:
              raise SystemExit(f'function count changed: {func_count_before} -> {func_count_after}')

          eng = re.compile(r'[A-Za-z]{2,}')
          hangul = re.compile(r'[가-힣]')
          starts = list(re.finditer(r'^@WeaponBarrel(\d+)\(ARG, O_DATA, V_NAME\)\s*$', text, re.M))
          remaining_names = []
          remaining_descs = []
          for idx, m in enumerate(starts):
              end = starts[idx + 1].start() if idx + 1 < len(starts) else len(text)
              block = text[m.start():end]
              for case_name, bucket in [('名前', remaining_names), ('描写', remaining_descs)]:
                  km = re.search(rf'CASE "{case_name}"\s*\n(?:\s*IF[\s\S]*?ENDIF\s*\n)?\s*CALLF MAKE_STR\(V_NAME,\s*(.+?)\)\s*$', block, re.M)
                  if not km:
                      continue
                  value = km.group(1).strip()
                  if eng.search(value) and not hangul.search(value):
                      bucket.append((int(m.group(1)), value))
          print(f'[barrel-extensions] translated={changed}')
          print(f'[barrel-extensions] remaining_untranslated_names={len(remaining_names)}')
          print(f'[barrel-extensions] remaining_untranslated_descs={len(remaining_descs)}')
          if remaining_names:
              raise SystemExit(f'untranslated names remain: {remaining_names}')
          if remaining_descs:
              raise SystemExit(f'untranslated descriptions remain: {remaining_descs}')

          p.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          FILE='ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrel Extensions.ERB'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrel Extensions.ERB')
          if not p.read_bytes().startswith(b'\xef\xbb\xbf'):
              raise SystemExit('UTF-8 BOM was not preserved')
          print('[validate] BOM ok')
          PY
          git diff --check
          mapfile -t changed_files < <(git diff --name-only)
          if [[ ${#changed_files[@]} -ne 1 || "${changed_files[0]}" != "$FILE" ]]; then
            printf 'unexpected changed files:\n%s\n' "${changed_files[*]}"
            exit 1
          fi
          read -r added deleted path < <(git diff --numstat -- "$FILE")
          if [[ "$added" != "35" || "$deleted" != "35" || "$path" != "$FILE" ]]; then
            echo "unexpected numstat: +$added -$deleted $path"
            exit 1
          fi
          echo '[validate] single file +35/-35 ok'

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrel Extensions.ERB'
          git commit -m '총구장치 UI 잔여 표시명 및 영어 설명 마무리 54차'
          git push origin HEAD:korean

name: Korean unattended smoke test

on:
  push:
    paths:
      - '.github/workflows/korean-smoke-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Materialize Emuera engine
        shell: bash
        run: |
          git lfs pull --include="Emuera.exe" --exclude=""
          bytes=$(stat -c%s Emuera.exe)
          echo "Emuera.exe bytes=$bytes"
          test "$bytes" -gt 100000

      - name: Install headless Wine and .NET Desktop 8
        shell: bash
        env:
          WINEARCH: win64
          WINEPREFIX: ${{ runner.temp }}/wineprefix
          WINEDEBUG: -all
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y xvfb wine wine64 wine32:i386 curl
          wine --version
          xvfb-run -a wineboot -u
          curl -fL --retry 3 -o "$RUNNER_TEMP/dotnet-desktop-8.exe" https://builds.dotnet.microsoft.com/dotnet/WindowsDesktop/8.0.29/windowsdesktop-runtime-8.0.29-win-x64.exe
          test "$(stat -c%s "$RUNNER_TEMP/dotnet-desktop-8.exe")" -gt 10000000
          xvfb-run -a wine "$RUNNER_TEMP/dotnet-desktop-8.exe" /install /quiet /norestart
          test -d "$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App"
          find "$WINEPREFIX/drive_c/Program Files/dotnet/shared/Microsoft.WindowsDesktop.App" -maxdepth 1 -mindepth 1 -type d -printf '%f\n'

      - name: Boot engine headlessly
        shell: bash
        env:
          WINEARCH: win64
          WINEDEBUG: -all
          WINEPREFIX: ${{ runner.temp }}/wineprefix
        run: |
          rm -f emuera.log emuera.log.prev smoke.stdout smoke.combined
          set +e
          xvfb-run -a timeout 35s wine ./Emuera.exe -debug > smoke.stdout 2>&1
          rc=$?
          set -e
          echo "SMOKE_RC=$rc"
          tail -n 160 smoke.stdout || true
          for f in emuera.log emuera.log.prev; do
            if [ -f "$f" ]; then
              echo "===== $f ====="
              tail -n 200 "$f" || true
            fi
          done
          cat smoke.stdout emuera.log emuera.log.prev 2>/dev/null > smoke.combined || true
          if grep -Eiq 'Unhandled Exception|SyntaxError|Script.*Error|Parser.*Error|Compile.*Error|System\.[A-Za-z]+Exception|致命的|構文エラー' smoke.combined; then
            echo 'Fatal/parse error detected during smoke boot'
            exit 1
          fi
          if grep -Eiq 'You must install \.NET|\.NET location: Not found|requires.*\.NET|missing.*runtime' smoke.combined; then
            echo 'Windows runtime dependency missing'
            exit 2
          fi
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 124 ]; then
            echo "Unexpected engine exit code: $rc"
            exit 1
          fi
          echo 'Headless engine smoke passed'

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: korean-smoke-logs
          path: |
            smoke.stdout
            emuera.log
            emuera.log.prev
          if-no-files-found: ignore
          retention-days: 14

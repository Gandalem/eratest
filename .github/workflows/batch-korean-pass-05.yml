name: Batch Korean pass 05

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-05.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate more Be Free posts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Be Free.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          reps = [
            ('BUNBUNMARU IS JUST FUCKING ADS', '붕붕마루는 광고밖에 없잖아'),
            ('I look at the daily newspaper and its just ads for fucking KyuuKyuu, Stage 5 weaponry, and DIAPERS. Where is the goddamn news? Did Bunbunmaru sell out?!', '매일 신문을 보는데 KyuuKyuu 광고, 스테이지 5 무기 광고, 기저귀 광고뿐이잖아. 뉴스는 대체 어디 있어? 붕붕마루 돈에 넘어간 거야?!'),
            ("It's Bunbunmaru. They sold out ever since Aya started it.", '붕붕마루잖아. 아야가 시작했을 때부터 이미 광고판이나 다름없었지.'),
            ('I mean, at least there\'s the Shitlympics and the diaper reviews. Seriously I thought Bunbunmaru was just some scatpiss fetish magazine at first. Goddamn.', '그래도 Shitlympics랑 기저귀 리뷰 정도는 있잖아. 처음엔 붕붕마루가 그냥 배설 취향 잡지인 줄 알았다니까. 세상에.'),
            ('She hates me', '그녀가 날 싫어해'),
            ("I accidentally grouped a girl's butt and now she hates me. How do I make it up? I tried apologizing but she won't relent.", '실수로 어떤 여자애 엉덩이를 만졌더니 이제 날 싫어해. 어떻게 만회하지? 사과해도 화를 안 풀어.'),
            ('Have you tried giving her a box of cakes? It can help forgive some minor mistakes.', '케이크 상자를 선물해 봤어? 가벼운 실수 정도라면 용서받는 데 도움이 될 수 있어.'),
            ("It won't work, she has like 3 levels of hate.", '그걸로는 안 돼. 증오 단계가 한 3단계쯤 되는 것 같아.'),
            ("Do you have TSP? I know it's pretty much morally bankrupt but you can go around stealing their panties. 10 pairs can be thrown at an altar to decrease their hate. This only works if you're worshipping that panty god though.", 'TSP 있어? 도덕적으로는 영 엉망이지만 속옷을 모아서 제단에 10개 바치면 증오를 낮출 수 있어. 다만 그 속옷 신을 숭배하고 있을 때만 통하지만.'),
            ("No? Isn't TSP for creepy perverts for anyone below Extra Stage? I could try taking her on a date but its going to take a long while to get to that point.", '아니? 엑스트라 스테이지 아래에서 TSP 쓰는 건 이상한 변태들이나 하는 거 아냐? 데이트를 시도해 볼 수도 있겠지만 거기까지 관계를 회복하려면 오래 걸리겠네.'),
            ("First, there's STA, your stamina, and your body condition. When you get hit, you take STA damage and you'll be wounded, damaging your body.<br> You take too much STA damage without restoring it, you faint and lose the battle and the rest of the day.<br> Take too much damage on a part and it will be destroyed. Having a critical part destroyed such as your head, brain, heart, liver, or both lungs and kidneys will kill you.<br><br> Second, if you haven't done already, tend to your wounds. Wounds will heal faster if tended, and it will also stop any bleeding. Use the best healing items for severe injuries, such as med kits and bandages.<br> Third, wait. The primary way of healing injuries is with time. You can lie on a couch and rest, or go back to your room.<br> Fourth, magic is a great way of quickly healing yourself in the middle of a fight. You will need to have the Healing Youjutsu learned and it will cost MP. Dia is the basic healing spell. Diarahan is the highest tier healing spell and heals all wounds but requires high Healing Youjutsu level<br> Fifth, all injuries are healed at the end of the day, so go crazy and take risks. As long as you still have a pulse, you'll be fine.<br> Sixth, dying is expensive. It costs up to 1,000,000 yen to bring you back to life (or 10% of your money if you're poor). If you don't want to lose all of your money, don't die!", '첫째, STA는 체력과 전투 지속력을 나타내고 신체 상태와도 연결돼 있어. 공격을 맞으면 STA 피해와 함께 부상을 입어 신체 부위가 손상될 수 있어.<br> STA를 회복하지 않은 채 너무 많이 잃으면 기절하고 전투에서 패배하며 그날 남은 시간도 날아가.<br> 특정 부위가 너무 심하게 손상되면 파괴될 수 있어. 머리, 뇌, 심장, 간 또는 양쪽 폐·신장 같은 핵심 부위가 파괴되면 사망해.<br><br> 둘째, 아직 안 했다면 상처를 치료해. 치료한 상처는 더 빨리 낫고 출혈도 멈출 수 있어. 심한 부상에는 의료 키트나 붕대처럼 좋은 치료 아이템을 써.<br> 셋째, 기다려. 부상은 시간이 지나면서 회복되는 게 기본이야. 소파에 누워 쉬거나 방으로 돌아가도 돼.<br> 넷째, 전투 중 빠르게 회복하려면 마법이 좋아. 회복 요술을 배워야 하고 MP를 소모해. Dia는 기본 회복 주문이고, Diarahan은 높은 회복 요술 레벨이 필요한 대신 모든 상처를 치료하는 최고 등급 주문이야.<br> 다섯째, 하루가 끝나면 모든 부상이 회복되니 어느 정도는 과감하게 움직여도 돼. 맥박만 뛰고 있으면 괜찮아.<br> 여섯째, 죽는 건 비싸. 부활에는 최대 1,000,000엔이 들고, 돈이 적다면 보유금의 10%를 내야 해. 돈을 잃고 싶지 않다면 죽지 마!'),
            ('Elixirs are instant heals that allow me to keep fighting when I\'m about to lose. But drinking just one makes me pee a lot though.', '엘릭서는 즉시 회복이라 질 것 같을 때도 계속 싸울 수 있게 해 줘. 대신 하나만 마셔도 소변이 엄청 자주 마렵더라.'),
            ("I changed some people's soiled undies and took them into a trash bin to keep them, but they stink so much. How can I keep the stench down?", '다른 사람의 더러워진 속옷을 갈아 주고 쓰레기통에 모아 뒀는데 냄새가 너무 심해. 냄새를 줄일 방법이 있을까?'),
            ("Welcome to Niaobu-sama's fan club c:<br> Diaper pails are much better than regular trash cans at keeping smell. They're made for storing exactly that.", 'Niaobu-sama 팬클럽에 온 걸 환영해 c:<br> 전용 수거통은 일반 쓰레기통보다 냄새를 훨씬 잘 막아 줘. 애초에 그런 걸 보관하려고 만든 거니까.'),
            ("I got put into diapers one time because my trash bin was too dirty and smelled like poop. I don't poop my pants, the people that I changed out did, but these carers only care about where the undies are I guess.", '쓰레기통이 너무 더럽고 냄새가 난다는 이유로 나까지 보호용 속옷을 착용하게 된 적이 있어. 내가 실수한 것도 아니고 내가 갈아 준 사람들이 그런 건데, 관리하는 쪽에서는 속옷이 어디에 쌓여 있는지만 보는 모양이야.'),
            ('Magic panties', '마법 팬티'),
            ('I bought a pair of「Youpan-F」panties but every time I tried to cast Agi it always fails. How do I use then?', '「Youpan-F」 팬티를 샀는데 Agi를 쓰려고 할 때마다 실패해. 이거 어떻게 사용하는 거야?'),
            ("Did you like, read the box that they came in?<br> >Youpan use Youjutsu energy from your excretions to cast spells. To cast a spell, just pee or poop inside of them. If you need to go, just push a load and watch the magic do it's thing.<br> You have to go potty in your panties like a little babu. Good for emergencies, bad for well, staying dry.", '포장 설명은 읽어 봤어?<br> >Youpan은 배설물에서 나온 요술 에너지를 이용해 주문을 발동해. 주문을 쓰려면 착용한 상태에서 소변이나 대변을 보면 돼. 급하면 그냥 해결하고 마법이 발동하는 걸 보면 돼.<br> 비상시에는 유용하지만 옷을 깨끗하게 유지하기에는 별로지.'),
            ('>To cast a spell, just pee or poop inside of them.<br> EW. I thought wearing them would just give me the ability. Does anyone want my pair then?', '>주문을 쓰려면 착용한 상태에서 소변이나 대변을 보면 돼.<br> 으엑. 난 그냥 입기만 하면 능력이 생기는 줄 알았는데. 그럼 내 거 가져갈 사람 있어?'),
            (">I thought wearing them would just give me the ability.<br> You'll be pissing more than a race horse past Stage 3. You'll be lucky if you stay dry after a day of battles.", '>난 그냥 입기만 하면 능력이 생기는 줄 알았는데.<br> 스테이지 3 이후에는 전투 한 번만 돌아도 소변을 자주 보게 될 거야. 하루 종일 싸우고도 멀쩡히 마른 상태면 운이 좋은 거지.'),
            ('One time I really had to poop really badly cause I got hit with a Coprodyne and I was about to faint but when I pooped in my Majiman Dias it healed me back up to full.<br> These magic panties can really turn the fight to your advantage but you have to deal with the load on your back, and the awful smell after the battle. Just wear them before you fight.', '한번은 Coprodyne을 맞아서 정말 급한 상태였고 거의 기절할 뻔했는데, Majiman Dias를 착용한 채 배변하자 체력이 완전히 회복됐어.<br> 이런 마법 팬티는 전투를 유리하게 뒤집을 수 있지만, 전투 뒤에는 더러워진 상태와 냄새를 감수해야 해. 필요하면 싸우기 전에 착용해.')
          ]

          total = 0
          for old, new in reps:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  total += c
                  print('REPLACED', c, old[:80])

          if total < 18:
              raise SystemExit(f'Too few replacements: {total}')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          print('TOTAL', total)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git diff -U0 | grep -E '^[-+].*@DanmakuWorldEntry_' || { echo 'Function declaration changed'; exit 1; }
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Be Free.ERB'
          git commit -m 'Be Free 게시글 한글화 5차'
          git push origin HEAD:korean

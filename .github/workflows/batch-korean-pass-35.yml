name: Batch Korean pass 35

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-35.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate race tooltips third batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ui = Path('ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB')
          raw = ui.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')
          lines = text.splitlines(keepends=True)

          replacements = [
              ('\tCASE "Mouse Youkai"', r'''작은 체구지만 수가 매우 많은 쥐 요괴입니다.\n사람들이 찾는 물건을 찾아내는 힘을 지닙니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Nue"', r'''키메라와 비슷한 전설 속 짐승입니다.\n전통적으로 원숭이의 머리, 너구리의 몸, 호랑이의 다리, 뱀 꼬리를 지닌 모습으로 묘사됩니다.\n불운을 퍼뜨리며 수많은 모습으로 변하는 것으로 알려져 있습니다.\n본래 모습이 실제로 존재하는지조차 아무도 확신하지 못합니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Demon", "Devil"', r'''마계나 지옥에서 비롯된 사악한 존재입니다.\n마법사에게 소환되어 속박되는 경우가 많습니다.\n오니보다는 요괴에 더 가까운 존재입니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Kappa"', r'''물에서 살아가는 요괴 종족으로, 자신이 열정을 가진 분야라면 무엇이든 뛰어난 실력을 발휘할 수 있습니다.\n그 재능은 훌륭한 발명품이나 건축물로 드러나는 경우가 많습니다.\n변덕스러운 성격 때문에 협업에는 그다지 어울리지 않습니다.\n주로 강에서 발견되며 오이와 씨름을 좋아합니다.\n사람의 엉덩이에서 시리코다마를 빼내 영혼을 훔친다는 이야기도 있습니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Misfortune Goddess"', r'''불운을 관장하는 여신입니다.\n인간에게서 불운을 거두어 다른 신들에게 넘깁니다.\n팔백만 신 가운데 하나입니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Yaoyorozu no Kami"', r'''팔백만 신을 대표하는 존재로, 순수한 신앙으로 이루어져 있습니다.\n인간의 믿음에서 태어난다는 점에서 요괴와 비슷한 면이 있어 때로 요괴로 불리기도 합니다.\n하지만 본질은 크게 다르며, 주로 숭배의 형태로 신앙을 모으려 합니다.\n영혼을 나누어 부름을 받은 곳마다 현현할 수 있어 여러 장소에서 동시에 신도를 보살필 수도 있습니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Demon"', r'''악마와 비슷하지만 하늘에서 내려오며 선한 목적을 지닌 존재입니다.\n마법사에게 소환되어 속박되는 경우가 많습니다.\n신보다는 요괴에 더 가까운 존재입니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Fallen Celestial"', r'''잘못을 저질러 천계에서 추방된 천인입니다.\n예전 힘의 대부분을 잃었지만 여전히 만만치 않은 존재입니다.\n때로는 천계로 돌아가는 것을 허락받기도 하지만 추방자의 낙인은 사라지지 않습니다.\n일반 천인과 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Karakasa obake (Tsukumogami)"', r'''버려진 낡은 우산이 츠쿠모가미가 된 존재입니다.\n보통 한쪽 눈과 크게 벌린 입에서 나온 긴 혀, 게다를 신은 외다리의 모습으로 묘사됩니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Crow Tengu", "White Wolf Tengu"', r'''주 종족 설명을 참고하세요.'''),
              ('\tCASE "Hermit?"', r'''진짜 선인인 척하거나 적어도 그렇게 보이려 하는 존재입니다.\n출신조차 알 수 없으니 무엇을 숨기고 있는지 알 길이 없습니다.\n일반 선인과 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Witch"', r'''태어날 때부터 요괴인 마녀입니다. 힘은 마법에서 나오지만 육체 자체는 본질적으로 인간과 비슷합니다.\n운동 부족과 유독한 마법 시약에 자주 노출되는 탓에 허약하다고 여겨지기도 합니다.\n인간과 비슷한 체질이지만 마법의 간섭 때문인지 번식은 어렵습니다.'''),
              ('\tCASE "Magician(formerly Human)"', r'''마법 연구를 거듭하다 요괴가 된 인간 마법사입니다.\n음식이 필요 없고 늙지도 않아 사실상 불사에 가깝습니다.\n육체는 인간과 비슷하지만 더 이상 인간은 아니므로 번식이 어렵습니다.'''),
              ('\tCASE "Saint"', r'''종교에서 성스러운 인물로 시성된 존재로, 신앙에 대한 헌신과 공헌으로 인정받는 경우가 많습니다.\n불교와 도교 양쪽에서 숭배되기도 하며 선인에 가까운 현자입니다.\n대개 죽은 뒤 이런 지위에 오르기 때문에 번식이 어렵습니다.'''),
              ('\tCASE "Menreiki"', r'''고대 가면무용에 쓰이던 기악 가면들이 모여 이루어진 요괴입니다.\n여러 가면이 합쳐진 츠쿠모가미와 비슷하며, 가면을 통해서만 감정을 지니고 표현할 수 있어 자신의 가면을 매우 소중하게 여깁니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Wicked Hermit"', r'''규칙을 어기거나 지나치게 이기적으로 행동해 「사악한 선인」이라 불리는 이들이 있습니다.\n도덕적 원칙이 없고 악행에도 거리낌이 없으므로 곁에서는 각별히 조심해야 합니다.\n일반 선인과 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Magician (Jizo)"', r'''본래 평범한 물건이었지만 충분한 마력을 받아 마법사 요괴가 된 존재입니다.\n현재 모습은 골렘에 가까운 편입니다.\n원래 무생물이었으므로 번식이 어렵습니다.'''),
              ('\tCASE "Ushi-oni"', r'''소의 머리와 사나운 발톱을 지닌 거대한 거미 모습으로 흔히 묘사되는 요괴입니다.\n일부 전승에서는 돌로 변해 희생자를 짓누르는 아기를 들려준 뒤 가까운 물가에서 습격한다고 합니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "God of chickens"', r'''닭과 관련된 모든 것을 관장하는 신입니다.\n농업, 다산, 관개, 안전한 통행 등을 관장하는 니와타리진에서 유래했으며 때로 닭과도 연결됩니다.\n팔백만 신 가운데 하나입니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Jidiao"', r'''거북의 몸에 용의 머리와 꼬리를 지닌 중국 전설의 생물입니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Kurokoma"', r'''쇼토쿠 태자가 아끼던 말로 전해지는 카이 지방의 검은 전설마입니다.\n하늘을 날 수 있었다고 합니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Taotie"', r'''극심한 탐식으로 유명한 고대 중국 신화의 존재로, 세상의 「사흉」 가운데 하나로 불립니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "A Girl of Snow"', r'''눈의 소녀, 말 그대로 설녀입니다!\n그런데 몸이 눈으로 만들어진 것은 아닙니다.\n잠깐, 뭐라고요?!'''),
              ('\tCASE "Lampad"', r'''여신 헤카테를 섬기는 저승의 님프입니다.\n밤에 이동하는 헤카테를 따라다니며 사람을 광기에 빠뜨릴 힘을 지닌 횃불을 들고 다닙니다.'''),
              ('\tCASE "Goddess?"', r'''겉으로 보이는 모습이 언제나 진실인 것은 아닐지도 모릅니다.\n라르바의 경우 나비 요정이 아니라 상세세계의 신 토코요일 가능성도 있습니다!\n벌레 숭배가 더욱 뜨거워집니다...'''),
              ('\tCASE "Succubus"', r'''유혹의 기술과 성적 능력으로 악명 높은 하급 악마입니다.\n마법사에게 소환되어 속박되는 경우가 많지만 평범한 인간이 타락해 서큐버스가 되는 사례도 있습니다.\n보통 꿈에 나타나 남성을 유혹하고 정기를 빼앗지만, 목욕탕에서 안정적으로 일하는 삶이 훨씬 여유로운 모양입니다.'''),
              ('\tCASE "Paniel"', r'''파니엘은 성간 기업 피앤엘 인더스트리가 인간을 돕기 위해 만든 자동인형입니다.\n뛰어난 성능과 내구성, 충성심 때문에 바깥세계에서는 일반 가정부터 군대, 대기업, 왕족까지 모두가 파니엘을 원했습니다.\n\n그러나 익명의 내부고발자가 비밀을 폭로하면서 상황이 뒤집혔습니다.\n\n두뇌 코어의 주재료는 인간의 중추신경계였고, 새로 형성된 인격을 안정시키기 위해 연료에는 향정신성 물질이 섞여 있었습니다.\n진실이 드러난 뒤 피앤엘 인더스트리는 모든 사업을 버리고 환상향으로 도망쳤습니다.\n많은 영업 비밀과 자산을 잃었지만 회사 자체는 살아남았습니다.\n이제는 과거라면 고객으로조차 여기지 않았을 이들에게 남은 물건을 팔며 버티고 있습니다.\n피앤엘 인더스트리는 바깥세계 사람들이 이 사건을 모두 잊을 때를 기다리며 돌아갈 기회를 노리고 있습니다.'''),
              ('\tCASE "Hussar"', r'''후사르는 유전공학으로 만들어진 병사입니다. 공격적이면서도 정밀하게 싸우고 빠르게 회복하며 극한 기온에도 잘 견디고 군용 약물을 거리낌 없이 사용합니다. 「고주스」라는 약물에 유전적으로 의존하도록 설계되어 지휘관에게 반항할 가능성도 낮습니다.\n강렬한 감정은 전투에서는 위협적이지만 일반 인간과 정서적으로 공감하는 데에는 서툽니다. 피처럼 붉은 눈과 사람을 불안하게 만드는 무표정한 「후사르의 응시」로 유명합니다.\n표정이 거의 없으면서 공격성은 강해 폭력적인 오해를 일으키는 경우가 많습니다.\n후사르가 존재하는 사회에서는 대개 일반 인구와 분리되어 생활합니다. 단일 목적을 위해 만들어진 도구에 가깝고, 본인들도 대체로 그 사실을 신경 쓰지 않습니다.'''),
              ('\tCASE "Angel"', r'''아브라함계 종교에 등장하는 영적 존재입니다.\n신을 섬기며 보통 전령 역할을 하지만 인간의 안내자나 수호자가 되기도 합니다.\n본질적으로 성스러운 존재이므로 번식이 어렵습니다.'''),
              ('\tCASE "Maneki-neko"', r'''가게에 돈과 손님을 불러들이는 힘을 지닌 고양이 요괴의 한 종류입니다.\n대개 흰 털을 지녔지만 삼색고양이인 경우도 있습니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Yamajorou"', r'''야만바보다 사교적인 아종입니다.\n도박장이나 유곽처럼 평판이 좋지 않은 업소를 운영하는 모습으로 자주 발견됩니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Kuda-gitsune"', r'''대나무 통 속에서 사는 여우 요괴의 한 종류입니다.\n강력한 마력을 지녀 주인에게 큰 부를 안겨 줄 수 있지만 그 과정에서 주인의 생명력을 먹어 치워 결국 파멸로 이끕니다.\n사역마로 쓰려면 암수 한 쌍을 길러야 하는데 계속 수가 불어나기 때문에 결국 주인이 가진 모든 것을 빠르게 소모합니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Great Tengu"', r'''텐구 사회의 중간 관리자입니다.\n하위 계급 텐구에게 명령을 내리고 텐구 사회의 건강과 지속적인 번영을 책임집니다.\n가끔 영역 안의 다른 요괴에게도 명령하지만 그들은 텐구가 아니므로 반드시 따를 의무는 없습니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Oomukade"', r'''거대한 지네 요괴입니다.\n엄청나게 강력한 종족으로, 강력한 독과 뛰어난 마력으로 거대한 뱀이나 용조차 잡아먹는다고 전해집니다.\n두꺼운 피부와 튼튼한 몸 때문에 무기로 상처 내기 어렵지만 인간의 침에는 매우 약합니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다.'''),
              ('\tCASE "Ascended Oni?"', r'''오니일 수도, 아닐 수도 있으며 산의 사천왕 가운데 하나일 가능성도 있는 부처입니다.\n한 가지 확실한 점은 번식이 어렵다는 사실입니다.'''),
          ]

          def bare(line):
              return line.rstrip('\r\n')

          changed = 0
          for anchor, desc in replacements:
              hits = [i for i, line in enumerate(lines) if bare(line) == anchor]
              if len(hits) != 1:
                  raise SystemExit(f'anchor count mismatch: {anchor!r}: {len(hits)}')
              i = hits[0]
              if i + 1 >= len(lines):
                  raise SystemExit(f'missing description after {anchor}')
              old = bare(lines[i + 1])
              if not old.startswith("\t\tLOCALS '= \"") or not old.endswith('"'):
                  raise SystemExit(f'unexpected description line after {anchor}: {old}')
              if not re.search(r'[A-Za-z]{3,}', old):
                  raise SystemExit(f'description is no longer English candidate after {anchor}: {old}')
              newline = '\r\n' if lines[i + 1].endswith('\r\n') else '\n' if lines[i + 1].endswith('\n') else ''
              new = "\t\tLOCALS '= \"" + desc + '"'
              lines[i + 1] = new + newline
              changed += 1
              print('RACE_TOOLTIP_35', anchor)

          if changed != 35:
              raise SystemExit(f'expected 35 replacements, got {changed}')

          out = ''.join(lines).encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          ui.write_bytes(out)
          print('RACE_TOOLTIP_35_REPLACEMENTS', changed)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          UI='ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB'
          git diff --check
          grep -Fq '@RACE_INFO(ARG)' "$UI"
          grep -Fq 'CASE "Paniel"' "$UI"
          grep -Fq '파니엘은 성간 기업 피앤엘 인더스트리가 인간을 돕기 위해 만든 자동인형입니다.' "$UI"
          grep -Fq 'CASE "Hussar"' "$UI"
          grep -Fq '후사르는 유전공학으로 만들어진 병사입니다.' "$UI"
          grep -Fq 'CASE "Great Tengu"' "$UI"
          grep -Fq '텐구 사회의 중간 관리자입니다.' "$UI"
          grep -Fq 'CASE "Ascended Oni?"' "$UI"
          grep -Fq '한 가지 확실한 점은 번식이 어렵다는 사실입니다.' "$UI"

          expected='ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB'
          actual=$(git diff --name-only)
          [ "$actual" = "$expected" ] || {
            echo 'Unexpected changed files:'
            printf '%s\n' "$actual"
            exit 1
          }
          git diff --stat

      - name: Commit and push

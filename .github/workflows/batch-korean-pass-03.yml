name: Batch Korean pass 03

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-03.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Apply translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          files = {
            Path('ERB/TRANSLATION/OMOGATARI/Body Parts/0 Bipedal.ERB'): {
              'Whole Body':'전신','Head':'머리','Hair':'머리카락','Face':'얼굴','Eyes':'눈','L ear':'왼쪽 귀','R ear':'오른쪽 귀','Nose':'코','Mouth':'입','Tongue':'혀','Throat':'목구멍','Neck':'목','Brain':'뇌','L arm':'왼팔','L armpit':'왼쪽 겨드랑이','L elbow':'왼쪽 팔꿈치','L hand':'왼손','R arm':'오른팔','R armpit':'오른쪽 겨드랑이','R elbow':'오른쪽 팔꿈치','R hand':'오른손','Thorax':'흉부','L breast':'왼쪽 가슴','L nipple':'왼쪽 유두','R breast':'오른쪽 가슴','R nipple':'오른쪽 유두','L Lung':'왼쪽 폐','R Lung':'오른쪽 폐','Heart':'심장','Shoulders':'어깨','Waist':'허리','Belly':'복부','Navel':'배꼽','Back':'등','L Wing':'왼쪽 날개','R Wing':'오른쪽 날개','Third Eye':'제3의 눈','Hip':'골반','Crotch':'사타구니','Clit':'클리토리스','Vagina':'질','Womb':'자궁','Butt':'엉덩이','Asshole':'항문','Colon':'대장','Penis':'음경','Gland':'귀두','Shaft':'음경 몸통','Balls':'고환','Urethra':'요도','Tail':'꼬리','Bladder':'방광','L Kidney':'왼쪽 신장','R Kidney':'오른쪽 신장','Liver':'간','L thigh':'왼쪽 허벅지','L knee':'왼쪽 무릎','L foot':'왼발','R thigh':'오른쪽 허벅지','R knee':'오른쪽 무릎','R foot':'오른발',
              'The entire body. Effectively this is for hediffs (Health Differences) that affect the whole body as a whole and cannot be directly damaged.':'몸 전체입니다. 전신에 영향을 주며 특정 부위를 직접 손상시키는 형태가 아닌 상태 이상(Health Differences)에 사용됩니다.',
              'The most important part of a human, the head includes the ears, brain, forehead, cheeks, chin, eyes, nose, and mouth. Loss of the head means instant death.':'인간에게 가장 중요한 부위 중 하나입니다. 귀, 뇌, 이마, 뺨, 턱, 눈, 코, 입이 포함됩니다. 머리를 잃으면 즉사합니다.',
              'Aesthetic part that gives humans their beauty.':'외형과 미관에 영향을 주는 부위입니다.',
              'Parts that give characters their vision, and the loss of sight will make them blind. The lack of sight can significantly affect accuracy.':'시각을 담당하는 부위입니다. 시력을 잃으면 실명하며, 시야 상실은 명중률에도 큰 영향을 줍니다.',
              'Ears allow humans to hear noises. Without an ear, it will be difficult to hear things, and having no ears will make someone deaf.':'소리를 듣게 해 주는 부위입니다. 한쪽 귀를 잃으면 청력이 저하되고, 양쪽 귀를 모두 잃으면 들을 수 없게 됩니다.',
              'A mouth conceals the tongue and throat, and also allows humans to talk and eat.':'혀와 목구멍이 이어지는 부위이며, 말하고 먹는 데 사용됩니다.',
              'A tongue is how people can taste things, as well as a crucial part for talking. Having no tongue will make them unable to speak':'맛을 느끼고 말을 하는 데 중요한 부위입니다. 혀를 잃으면 말을 할 수 없게 됩니다.',
              'Center of mass, also known as the torso. Contains many vital organs for your body to function. Loss of the thorax means instant death.':'몸의 중심부인 몸통입니다. 생명 유지에 필요한 여러 장기를 포함하며, 흉부를 잃으면 즉사합니다.',
              'Lactates milk and gives a lot of sex appeal. Affects Fertility':'모유를 분비하는 부위이며 생식 관련 능력에도 영향을 줍니다.',
              'Allows you to breathe. Losing both lungs means instant death. You can still live with just one.':'호흡을 담당합니다. 양쪽 폐를 모두 잃으면 즉사하지만 한쪽 폐만으로도 생존할 수 있습니다.',
              'Pumps blood from your heart to other parts of your body. Death happens when this part hits 0%, not -100%':'혈액을 온몸으로 순환시키는 핵심 장기입니다. 이 부위는 -100%가 아니라 0%가 되면 사망합니다.',
              "Midsection of the torso. Doesn't really do a lot.":'몸통의 중간 부위입니다.',
              'Stores food. Losing this means total bowel incontinence':'소화 과정에서 음식물을 저장하는 부위입니다. 이 부위를 잃으면 배변 조절에 심각한 문제가 생깁니다.',
              'What used to be a port for an umbilical cord':'과거 탯줄이 연결되어 있던 흔적입니다.',
              "Your back. Mainly has your spine. Don't have your spine break, or you cannot move at all":'척추가 위치한 등 부위입니다. 척추가 크게 손상되면 움직일 수 없게 될 수 있습니다.',
              'Appendages at the back that allow for conventional flight. Youjutsu-based flight is still possible even without wings.':'일반적인 비행을 가능하게 하는 등 쪽의 부속 기관입니다. 날개가 없어도 요술을 이용한 비행은 가능합니다.',
              "Lower section that connects your legs. Don't have your hips break, or you cannot move at all":'양쪽 다리를 연결하는 하체 중심부입니다. 골반이 심하게 손상되면 움직일 수 없게 될 수 있습니다.',
              'Area where your genitals sit.':'생식기가 위치하는 부위입니다.',
              'Female reproductive system and hosts a fetus. Keep this intact if you want to have a baby!':'여성 생식계에 해당하며 태아가 자라는 데 관여합니다. 임신과 출산을 위해 중요한 부위입니다.',
              'Fun buns that allow you to sit.':'앉을 때 몸을 받쳐 주는 부위입니다.',
              'Keeps waste in the body until its time to go. Losing this means total bowel incontinence':'배출할 때까지 노폐물을 유지하는 데 관여합니다. 이 부위를 잃으면 배변 조절이 불가능해질 수 있습니다.',
              'Stores solid waste. Losing this means total bowel incontinence':'고형 노폐물을 저장하는 부위입니다. 이 부위를 잃으면 배변 조절이 불가능해질 수 있습니다.',
              'Male reproductive system. Stores sperm and perfectly fits inside a female vagina for reproduction. Keep this intact if you want to have a baby!':'남성 생식계에 해당하며 정자를 생성·보관하고 생식에 관여합니다. 임신을 원한다면 중요한 부위입니다.',
              'Tube where urine passes through. Losing this means total urinary incontinence':'소변이 지나가는 통로입니다. 이 부위를 잃으면 배뇨 조절에 심각한 문제가 생깁니다.',
              'Animallike extension to your body. Moves and wags with you.':'동물처럼 몸 뒤쪽에 이어진 부위로, 움직임에 따라 흔들립니다.',
              'Stores urine. Losing it means you cannot hold your pee, making you drip pee right into your underwear.':'소변을 저장하는 장기입니다. 이 부위를 잃으면 소변을 참을 수 없게 됩니다.',
              'Filters waste products into urine. Losing both kidneys means instant death. You can still live with just one.':'노폐물을 걸러 소변으로 배출하는 장기입니다. 양쪽 신장을 모두 잃으면 사망하지만 한쪽만으로도 생존할 수 있습니다.',
              'Helps keep your blood pure. Hitting 0% or lower means instant death.':'혈액을 정화하고 여러 대사 기능을 담당하는 장기입니다. 이 부위가 0% 이하가 되면 즉사합니다.'
            },
            Path('ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Human Village.ERB'): {
              'CEO of Musket Guy':'머스킷 가이 대표',
              'Watch out for FAEEs':'FAEE를 조심해',
              "I'm the leader of FAEE, a team composed of nimble fairies that love Danmaku. When you battle, don't underestimate our techniques.":'나는 탄막을 좋아하는 재빠른 요정들로 이루어진 팀 FAEE의 리더야. 우리와 싸울 땐 기술을 얕보지 마.',
              'hello world':'안녕 세상아',
              'hello, im rumia, a fellow youkhai of the dusk. if u want a night, hed to da hooman village at dark.':'안녕, 난 루미아야. 황혼을 떠도는 요괴지. 밤에 만나고 싶으면 어두워졌을 때 인간 마을로 와.',
              "Being a big fairy isn't that special":'큰 요정이라고 특별한 건 아니네',
              'Need testing':'테스트 상대 구함',
              'Meet and greet with The Small Devil':'소악마와 만나서 한판',
              'Koa here, but most people just call be The Small Devil. If you want to have a friendly battle, meet me at the Human Village.':'코아야. 대부분은 그냥 소악마라고 부르지. 친선전을 하고 싶다면 인간 마을에서 만나.',
              'I met this new guy and his battle style was super impressive. .':'새로운 녀석을 만났는데 전투 방식이 정말 인상적이었어.',
              '(angry growls)':'(화난 으르렁거림)',
              'Need Books? Head to Sunnazan':'책이 필요해? 스즈나안으로 와',
              'Need some more knowledge, want to learn things faster, head to our book store, Sunnazan. You can rent books there for cheap!':'지식이 더 필요하거나 빨리 배우고 싶다면 우리 서점 스즈나안으로 와. 책도 저렴하게 빌릴 수 있어!',
              "Ow ow ow! I know it's called Danmaku World, but why do these guys always just want to fight me instead of just renting books.":'아야야야! 여기가 탄막 월드라는 건 알겠는데, 왜 다들 책은 안 빌리고 나랑 싸우려고만 하는 거야?',
              'Aki Sisters want to play too':'아키 자매도 참가하고 싶어',
              'cant even live under a bucket':'양동이 밑에서도 못 살겠네',
              'i got challenged by some dude and lost almost instantly':'누가 도전해 와서 거의 순식간에 져 버렸어.',
              'Welcome to Danmaku World c:':'탄막 월드에 온 걸 환영해 c:',
              'Mayday!':'메이데이!',
              'Got what it takes to challenge the Little Gang?':'리틀 갱에 도전할 배짱 있어?',
              "Good to be here! I'm Happy and Run, head of the Little Gang. We're raring to rip today at the Human Village! Come on, who's dumb enough to take on our super-advanced fire staffs":'반가워! 나는 리틀 갱의 리더 해피 앤 런이야. 오늘 인간 마을에서 제대로 붙어 보자! 자, 우리의 초고급 화염봉에 덤빌 배짱 있는 사람 누구야?',
              'Want to shoot guns with Shooting Funs?':'Shooting Funs와 총 쏘고 싶어?',
              'Then head over to the Human Village! We got musket revolvers, drinks, and free ammo! We all work up at one of the Seihou deparment stores so all of this is pretty cheap fun. <br>Or you can come and battle us. We can have a good time that way too.':'그럼 인간 마을로 와! 머스킷 리볼버에 음료, 무료 탄약까지 준비돼 있어! 우리 모두 서방 쪽 백화점에서 일해서 꽤 저렴하게 즐길 수 있지.<br>아니면 우리랑 싸워도 돼. 그것도 충분히 재밌을 거야.',
              "Real Echo's looking to sharpen their claws":'리얼 에코, 발톱을 갈 상대를 찾는 중',
              'Free heals for any fighter':'파이터라면 무료 치료',
              'SPRING IS HERE!!!!!':'봄이 왔다!!!!!',
              'SPRING IS HERE!!!! I BE WAITING FOR YOU GUYS OVER AT THE HUMAN VILLAGE SO LONG AS IT SUNNY, OR CLEAR.':'봄이 왔다!!!! 날씨가 맑기만 하면 인간 마을에서 너희를 기다릴게!!!!',
              'PART 2!!!!1111!':'2부!!!!1111!',
              'I TRAIN UP AND SUPER STRONG NOW. SAME REEKWIRE MENTS AS BEFORE, CLEAR HETHER.':'훈련해서 지금은 엄청 강해졌어. 조건은 전과 같아, 맑은 날씨에 와!',
              'Speaking for Loyal Undead':'충직한 언데드를 대신해 씀',
              "She's willing to take a stand over at the Human Village. She can't read or write so I'm doing it for her.":'그녀는 인간 마을에서 상대를 기다리고 있어. 글을 읽거나 쓸 수 없어서 내가 대신 올린다.',
              'Ello guys':'안녕 얘들아',
              'I am god does anyone want to see how powerful i am as a god i am going to destroy you guys so easily if you want to challenge me anyway go to human village':'나는 신이다. 신인 내가 얼마나 강한지 보고 싶은 사람 있어? 너희 정도는 쉽게 쓰러뜨릴 수 있어. 그래도 도전하고 싶다면 인간 마을로 와.',
              'Little break from stacking stones':'돌 쌓기 잠깐 휴식'
            }
          }

          total = 0
          changed = []
          for path, mapping in files.items():
              raw = path.read_bytes()
              bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig')
              original = text
              count_file = 0
              for old, new in mapping.items():
                  c = text.count(old)
                  if c:
                      text = text.replace(old, new)
                      count_file += c
                      total += c
              if text != original:
                  out = text.encode('utf-8')
                  if bom:
                      out = b'\xef\xbb\xbf' + out
                  path.write_bytes(out)
                  changed.append((str(path), count_file))

          for item in changed:
              print('CHANGED', item)
          print('TOTAL REPLACEMENTS', total)
          if total < 20:
              raise SystemExit(f'Too few replacements: {total}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git diff -U0 | grep -E '^[-+].*@(BDY_PART_NAME_0|BDY_PART_DESC_0|DanmakuWorldEntry_)' || { echo 'Function declaration changed'; exit 1; }
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/Body Parts/0 Bipedal.ERB' 'ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Human Village.ERB'
          git commit -m '신체 UI 및 인간 마을 대사 한글화 3차'
          git push origin HEAD:korean

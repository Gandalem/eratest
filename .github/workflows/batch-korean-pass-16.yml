name: Batch Korean pass 16

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-16.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate ammunition display names and descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ui = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_Attatchments.ERB')
          raw = ui.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          if '\tCASE "WeaponAmmo"\n\t\tSELECTCASE RawName' in text:
              raise SystemExit('WeaponAmmo display mapping already exists')

          ammo_lines = [
              '\tCASE "WeaponAmmo"',
              '\t\tSELECTCASE RawName',
              '\t\t\tCASE "12/70 Kappa Armory \\\"6.5mm Express\\\" buckshot"',
              '\t\t\t\tRETURNF "12/70 Kappa Armory \\\"6.5mm 익스프레스\\\" 벅샷"',
              '\t\t\tCASE "20/70 5.6mm Express buckshot"',
              '\t\t\t\tRETURNF "20/70 5.6mm 익스프레스 벅샷"',
              '\t\t\tCASE "10x50mmR 10mm Express buckshot"',
              '\t\t\t\tRETURNF "10x50mmR 10mm 익스프레스 벅샷"',
              '\t\t\tCASE "23x75mmR Klimovsk \\\"Shrapnel-10\\\" buckshot"',
              '\t\t\t\tRETURNF "23x75mmR Klimovsk \\\"Shrapnel-10\\\" 벅샷"',
              '\t\t\tCASE "12.7x99mm Brennan \\\"M33\\\" FMJ"',
              '\t\t\t\tRETURNF "12.7x99mm Brennan \\\"M33\\\" 전피갑탄(FMJ)"',
              '\t\t\tCASE "19x99mm ATPSA Cactus \\\"Mortal\\\" HEAP Jet"',
              '\t\t\t\tRETURNF "19x99mm ATPSA Cactus \\\"Mortal\\\" 고폭철갑 제트탄"',
              '\t\t\tCASE "3in Akatsuki iron HE ball"',
              '\t\t\t\tRETURNF "3인치 Akatsuki 철제 고폭탄"',
              '\t\t\tCASE "7.62x39mm Gryzov \\\"PS gzh\\\" steel bullet"',
              '\t\t\t\tRETURNF "7.62x39mm Gryzov \\\"PS gzh\\\" 강철심탄"',
              '\t\t\tCASE ".308 Windurger \\\"Targeter\\\" FMJ"',
              '\t\t\t\tRETURNF ".308 Windurger \\\"Targeter\\\" 전피갑탄(FMJ)"',
              '\t\t\tCASE "7.62x54mmR Renov FMJ"',
              '\t\t\t\tRETURNF "7.62x54mmR Renov 전피갑탄(FMJ)"',
              '\t\t\tCASE "7.7x58mm Haru \\\"Type 97 ordinary cartridge\\\" FMJ"',
              '\t\t\t\tRETURNF "7.7x58mm Haru \\\"97식 보통탄\\\" 전피갑탄(FMJ)"',
              '\t\t\tCASE "11x60mmR Haru FMJ"',
              '\t\t\t\tRETURNF "11x60mmR Haru 전피갑탄(FMJ)"',
              '\t\t\tCASE "7.62x32mm Sabot Gryzov APFS-E"',
              '\t\t\t\tRETURNF "7.62x32mm 사보트 Gryzov APFS-E"',
              '\t\t\tCASE "20x108mm Sabot Cactus APFSDS"',
              '\t\t\t\tRETURNF "20x108mm 사보트 Cactus APFSDS"',
              '\t\t\tCASE "5.56x45mm Kappa Armory FMJ"',
              '\t\t\t\tRETURNF "5.56x45mm Kappa Armory 전피갑탄(FMJ)"',
              '\t\t\tCASE "5.45x39mm Gryzov \\\"PRS gs\\\" reduced ricochet bullet"',
              '\t\t\t\tRETURNF "5.45x39mm Gryzov \\\"PRS gs\\\" 저도탄탄"',
              '\t\t\tCASE "5.56x45mm Averdeen \\\"Warmageddon\\\" JHP"',
              '\t\t\t\tRETURNF "5.56x45mm Averdeen \\\"Warmageddon\\\" 재킷형 할로포인트(JHP)"',
              '\t\tENDSELECT',
          ]
          ammo_block = '\n'.join(ammo_lines) + '\n'
          marker = '\tCASE "WeaponBarrelBody"\n'
          if marker not in text:
              raise SystemExit('WeaponBarrelBody marker not found')
          text = text.replace(marker, ammo_block + marker, 1)
          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          ui.write_bytes(out)

          ammo = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Ammunition.ERB')
          raw = ammo.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          replacements = [
              (
                  'A 23x75mmR \\\"Shrapnel-10\\\" buckshot round with a rated maximum effective range of 10 meters.',
                  '23x75mmR \\\"Shrapnel-10\\\" 벅샷 탄으로, 최대 유효 사거리는 약 10미터다.'
              ),
              (
                  'A 7.62x39mm PS gzh (GAU Index - 57-N-231) cartridge with a 7.9 gram bullet with a heat-strengthened steel core with lead cladding on the tip and a bimetallic jacket, in a bimetallic case. The PS cartridge (Pulya Stalnaya; \\\"Steel Bullet\\\") was introduced into service in 1949 for Soviet 7.62x39mm caliber weaponry, and over the years has undergone numerous changes in the materials used for its construction. Thanks to the tempered steel core that this model has, it is able to pierce through basic ballistic body protections as well as some intermediate models in addition to provide a significant stopping power effect, however, it has a high bounce probability off various surfaces.',
                  '7.62x39mm PS gzh(GAU 지수 57-N-231) 탄약이다. 7.9그램 탄두는 열처리 강철심, 끝부분의 납 피복, 바이메탈 재킷으로 구성되며 바이메탈 탄피를 사용한다. PS(Pulya Stalnaya, \\\"강철 탄두\\\") 탄은 1949년 소련의 7.62x39mm 화기용으로 채택된 뒤 재료와 구조가 여러 차례 개량되었다. 강화 강철심 덕분에 기본적인 방탄 장비와 일부 중간 등급 방호구를 관통하면서도 높은 저지력을 제공하지만, 단단한 표면에서 도탄될 가능성도 높은 편이다.'
              ),
              (
                  'A 5.45x39mm PRS gs cartridge with a 3.9 gram soft lead core bullet with a bimetallic jacket in a steel case. This PRS bullet (Ponizhennoy Rikoshetiruyushchey Sposobnosti; \\\"Reduced Ricochet Ability\\\") was designed in the early 2000s to crumble and rapidly lose speed when hitting a solid object in order to substantially reduce collateral damage from ricochets during urban operations carried out by law enforcement agencies and groups from the Ministry of Internal Affairs, thus achieving a considerable stopping power effect on the target at the cost of penetration capabilities, even against basic ballistic protection.',
                  '5.45x39mm PRS gs 탄약이다. 3.9그램 연질 납심 탄두에 바이메탈 재킷을 씌우고 강철 탄피를 사용한다. PRS(Ponizhennoy Rikoshetiruyushchey Sposobnosti, \\\"도탄 감소\\\") 탄은 2000년대 초 법집행기관의 시가전에서 도탄으로 인한 부수 피해를 줄이기 위해 개발되었다. 단단한 물체에 맞으면 쉽게 부서지고 빠르게 감속해 높은 저지력을 내는 대신 관통력은 낮아, 기본적인 방탄 장비에도 효과가 제한된다.'
              ),
              (
                  'A .366 TKM (9.55x39mm) FMJ 탄약으로,',
                  '.366 TKM(9.55x39mm) 전피갑탄(FMJ)으로,'
              ),
              (
                  'A .22 Broughton (5.56x45mm) FMJ 탄피는',
                  '.22 Broughton(5.56x45mm) 전피갑탄(FMJ)은'
              ),
              (
                  'A .50 구경 리볼버 탄약은',
                  '.50 구경 리볼버 탄약은'
              ),
          ]

          count = 0
          for old, new in replacements:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  count += c
                  print('DESC', c, old[:100])

          if count < 6:
              raise SystemExit(f'Too few description replacements: {count}')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          ammo.write_bytes(out)
          print('DESCRIPTION_REPLACEMENTS', count)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff -U0 -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Ammunition.ERB' | grep -E '^[+-][[:space:]]*CASE "名前"|^[+-].*@WeaponAmmo_ID'; then
            echo 'Internal ammo lookup structure changed'; exit 1
          fi
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_Attatchments.ERB' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Ammunition.ERB'
          git commit -m '탄약 표시명 및 설명 한글화 16차'
          git push origin HEAD:korean

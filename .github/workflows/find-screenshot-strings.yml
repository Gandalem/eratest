name: Find screenshot strings

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/find-screenshot-strings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false
      - name: Find visible English strings
        shell: bash
        run: |
          set -euo pipefail
          PAT='I already got my ideal look|I.ll choose from a few presets|First Name:|Last Name:|Middle Name:|Call Name:|Bloodline:|Name Format:|This map has more than one room choice|Select New Game Bonus|Gods, ghosts, and fairies can die|robust penis|Men.s clothing|Hakurei Shrine|Scarlet Devil Mansion|Human Village|Forest of Magic|Dream World~Moon|Makai|Worn-out Hut|Moriya Shrine Branch|Aunn.s Abode|Back Room \(Default room\)|Landlord:|sexual Content|Sexual Content|Excretion Content|Physical Harm|Additional Features|\[Yes\]|\[No\]|Finished|Default|Expanded|ported'
          grep -RInE --include='*.ERB' --include='*.ERH' --include='*.CSV' --include='*.CONFIG' "$PAT" ERB CSV 2>/dev/null | head -n 2000 || true

name: Korean next code protection

on:
  pull_request:
    branches: [ korean-next ]
    paths:
      - 'ERB/**'
      - '.github/scripts/korean_string_migration.py'
      - '.github/scripts/translation_progress_v2.py'
      - '.github/workflows/korean-next-code-protection.yml'
  push:
    branches: [ korean-next ]
    paths:
      - 'ERB/**'
      - '.github/scripts/korean_string_migration.py'
      - '.github/scripts/translation_progress_v2.py'
      - '.github/workflows/korean-next-code-protection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protect-main-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout korean-next candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch current main baseline
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Test migration parser
        run: python3 .github/scripts/korean_string_migration.py self-test

      - name: Reject executable ERB changes
        run: |
          python3 .github/scripts/korean_string_migration.py verify \
            --repo . \
            --base-ref origin/main \
            --candidate-ref HEAD

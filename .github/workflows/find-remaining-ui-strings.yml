name: Find remaining UI strings

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/find-remaining-ui-strings.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false
      - name: Find exact remaining strings
        shell: bash
        run: |
          set -euo pipefail
          echo '=== YES NO ==='
          grep -RInE --include='*.ERB' --include='*.ERH' '\[Yes\]|\[No\]|"Yes"|"No"' ERB/TRANSLATION/OMOGATARI ERB/NEWGAME 2>/dev/null | head -n 250 || true
          echo '=== CREATOR ==='
          grep -RInE --include='*.ERB' 'First Name:|Last Name:|Middle Name:|Call Name:|Bloodline:|Prefix:|Suffix:|Name Format:|\[Change\]|"Name"|"Base"|"Body"|"Talents"|"Abilities"|"Experience"|"Portraits"|"Skills"|"World"|"Body Parts"|"Info"' 'ERB/TRANSLATION/OMOGATARI/NewCharaCreator.ERB' 2>/dev/null | head -n 400 || true
          echo '=== MAP ==='
          grep -RInE --include='*.ERB' --include='*.CSV' 'This map has more than one room choice|Bath|Drss|BkRoom|Closet|Storeroom|Worn-out Hut|Moriya Shrine Branch|Aunn.s Abode|Three Fairies House|Fantasy Ruins|Back Room \(Default room\)|Landlord:|Hakurei Shrine|Myouren Temple|Human Village|Scarlet Devil Mansion|Bamboo Forest of the Lost|Forest of Magic|Sanzu River~Netherworld|Youkai Mountain \(Foot\)|Youkai Mountain \(Summit\)|Underworld|Dream World~Moon|Makai' ERB/MOVEMENTS ERB/TRANSLATION CSV 2>/dev/null | head -n 700 || true
          echo '=== TRANSLATION KEY ==='
          grep -RIn --include='*.ERB' --include='*.ERH' --include='*.CSV' 'sex_frustratedPushDown' ERB CSV 2>/dev/null | head -n 100 || true
          echo '=== NEWGAME ==='
          grep -RInE --include='*.ERB' 'robust penis|Men.s clothing|Gods, ghosts, and fairies can die|Select New Game Bonus|"Finished"|Hakurei Shrine.*back room|RETURNF "man"|"man"' ERB/NEWGAME ERB/TRANSLATION 2>/dev/null | head -n 500 || true

name: Batch Korean pass 25

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-25.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate late spell card names and descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          anchor = '\tCASE "Divine Arts 「Omnidirectional Dragon-Slaying Circle」"\n\t\tRETURNF "신기 「팔방용살진」"\nENDSELECT\nRETURNF RawName'
          if anchor not in text:
              raise SystemExit('SpellCardDisplayName anchor not found')

          extra = [
              ('Illusion Existence 「Clock Corpse」', '환존 「클록 콥스」'),
              ('Earth Sign 「Lazy Trilithon」', '토부 「레이지 트릴리톤」'),
              ('Illusion Sign 「Imaginary Flower Yumekazura」', '환부 「허상화 유메카즈라」'),
              ("Impossible Request 「Buddha's Stone Bowl -Indomitable Will-」", '난제 「부처의 석발 -불굴의 의지-」'),
              ('Migrating Spirit 「Dream Seal -Marred-」', '이령 「몽상봉인 -손상-」'),
              ('Earth Sign 「Lazy Trilithon High Level」', '토부 「레이지 트릴리톤 상급」'),
              ("Impossible Request 「Swallow's Cowrie Shell -Everlasting Life-」", '난제 「제비의 자안패 -영원한 생명-」'),
              ('「First and Last Nameless Danmaku」', '「처음이자 마지막인 이름 없는 탄막」'),
              ('Boundary 「Duplex Danmaku Barrier」', '결계 「이중 탄막 결계」'),
              ('Fire Sign 「Agni Radiance」', '화부 「아그니 레이디언스」'),
              ('Impossible Request 「Bullet Branch of Hourai -Rainbow Danmaku-」', '난제 「봉래의 탄막 가지 -무지개 탄막-」'),
              ('Wood & Fire Sign 「Forest Blaze」', '목화부 「포레스트 블레이즈」'),
              ('End of Imperishable Night 「Half Past 4」', '영야종 「4시 반」'),
              ('Water & Wood Sign 「Water Elf」', '수목부 「워터 엘프」'),
              ('End of Imperishable Night 「Rising World」', '영야종 「떠오르는 세계」'),
              ('Metal & Water Sign 「Mercury Poison」', '금수부 「머큐리 포이즌」'),
              ('「Tree-Ocean of Hourai」', '「봉래의 수해」'),
              ('Earth & Metal Sign 「Emerald Megalith」', '토금부 「에메랄드 메갈리스」'),
          ]
          cases = []
          for old, new in extra:
              cases += [f'\tCASE "{old}"', f'\t\tRETURNF "{new}"']
          insert = '\n'.join(cases)
          text = text.replace(anchor, anchor.replace('\nENDSELECT\nRETURNF RawName', '\n' + insert + '\nENDSELECT\nRETURNF RawName'), 1)

          descs = [
              ("Sakuya shoots small bullets from herself in random directions, then stops time and aims an arc of knives at the player, creates lanes of knives that go downwards, and resumes time.", "Sakuya가 작은 탄환을 무작위 방향으로 흩뿌린 뒤 시간을 멈춘다. 이어서 플레이어를 향해 칼날의 호를 조준하고 아래로 내려가는 나이프 열을 만든 다음 시간을 다시 흐르게 한다."),
              ("Patchouli spawns brown bullets that slowly go lower in the screen and take a random direction in seemingly large clumps.", "Patchouli가 갈색 탄환을 큰 덩어리처럼 생성한다. 탄환은 화면 아래쪽으로 천천히 내려가다가 제각기 무작위 방향으로 흩어진다."),
              ("Meiling spawns bullets from a flower-like shape around her in a way that seems to be aimed towards the player, and the individual bullets go in random directions.", "Meiling이 자신의 주변에 꽃 모양 탄막을 만들며 플레이어를 향해 쏘는 듯한 형태를 만든다. 이후 개별 탄환은 각기 무작위 방향으로 퍼져 나간다."),
              ("One of the impossible requests that Kaguya presented. An unbreakable stone bowl. Was Kaguya trying to eat stone-pot bibimbap or something with this?", "Kaguya가 제시한 난제 중 하나다. 절대로 깨지지 않는 돌그릇이라는데, 이걸로 돌솥비빔밥이라도 먹으려 했던 걸까?"),
              ("(whispering) They kinda look like squids.", "(속삭이며) 어쩐지 오징어처럼 보인다."),
              ("Very similar to \"Lazy Trilithon\", but the bullets are much faster", "「Lazy Trilithon」과 거의 같지만 탄환의 속도가 훨씬 빠르다."),
              ("One of the impossible requests that Kaguya presented. Said to be rarely found in swallow's nests, which are considered luxury food. This particular type is edible and delicious, which is uncommon for most such shells.", "Kaguya가 제시한 난제 중 하나다. 고급 식재료로 여겨지는 제비집에서 아주 드물게 발견된다고 한다. 이런 종류의 조개껍데기치고는 이례적으로 먹을 수 있고 맛도 좋다고 한다."),
              ("An attack that you can't dodge without taking advantage of the barriers. This would be undodgeable if she simply didn't put the barrier there, but...", "결계를 이용하지 않으면 피할 수 없는 공격이다. 애초에 그 결계를 설치하지 않았다면 완전히 회피 불가능한 공격이 됐겠지만..."),
              ("Behaves very similarly to \"Agni Shine High Level\", with the addition of Patchouli shooting large red bullets from herself in random directions.", "「Agni Shine High Level」과 매우 비슷하지만 Patchouli가 자신의 위치에서 큰 붉은 탄환을 무작위 방향으로 추가 발사한다."),
              ("One of the impossible requests that Kaguya presented...? Rumors say that there's a mountain called Hourai in the eastern ocean, and there's a tree that grows danmaku there. Hourai awaits, SHMUPers!", "Kaguya가 제시한 난제 중 하나...였던가? 동쪽 바다에는 봉래라는 산이 있고 그곳에는 탄막이 열리는 나무가 있다는 소문이 있다. 슈팅 게임 전사들이여, 봉래가 기다린다!"),
              ("Behaves similarly to \"Silphy Horn\", but the bullets Patchouli spawns are replaced by fireballs, which have bigger hitboxes than the shards.", "「Sylphy Horn」과 비슷하게 움직이지만 Patchouli가 생성하는 탄환이 파편보다 판정이 큰 화염탄으로 바뀐다."),
              ("At this time, the sky begins to brighten. If you see an old man running around in this time, he is undoubtedly a youkai.", "이 시간이 되면 하늘이 밝아지기 시작한다. 이런 시간에 뛰어다니는 노인을 본다면 틀림없이 요괴일 것이다."),
              ("Patchouli shoots aimed, crescent shaped patterns of large yellow bullets, and aimed circles of medium sized green and blue bullets, as she quickly flies all over the screen.", "Patchouli가 화면 곳곳을 빠르게 날아다니며 플레이어를 노린 큰 노란 초승달형 탄막과 중간 크기의 초록·파란 원형 탄막을 발사한다."),
              ("It looks like fun. These girls have power, so their playing is similarly big too. Well, every other inhabitant of Gensokyo was annoyed by this endless night, though.", "보기에는 즐거워 보인다. 힘이 넘치는 소녀들이니 노는 규모도 그만큼 크다. 물론 이 끝없는 밤 때문에 환상향의 다른 주민들은 모두 골치를 앓았지만."),
              ("Patchouli shoots rings of brown and blue bullets from herself in multiple waves. Brown bullets go left and blue bullets go right, as she stays still during a wave and moves to start another.", "Patchouli가 여러 차례에 걸쳐 갈색과 파란 탄환의 고리를 발사한다. 갈색 탄환은 왼쪽으로, 파란 탄환은 오른쪽으로 움직이며 한 파동 동안은 제자리에 있다가 다음 파동을 시작할 때 위치를 옮긴다."),
              ("The ocean of trees that is famous for its turning trap, making compasses inoperative. If you're thinking of going there after you're done with this game, think twice.", "나침반을 무용지물로 만드는 방향 감각 교란으로 유명한 수해다. 이 게임이 끝난 뒤 직접 가 볼 생각이라면 다시 한 번 생각해 보는 편이 좋다."),
              ("Patchouli flies around the screen, as large green bubbles appear anywhere on the screen, producing a burst of medium sized green bullets, and then fall down slowly.", "Patchouli가 화면을 날아다니는 동안 곳곳에 큰 초록색 거품이 나타난다. 거품은 중간 크기의 초록 탄환을 한꺼번에 뿜어낸 뒤 천천히 아래로 떨어진다."),
          ]

          count = 0
          for old, new in descs:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  count += c
                  print('DESC', c, old[:90])
          if count < 14:
              raise SystemExit(f'Too few description replacements: {count}')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          print('DESCRIPTION_REPLACEMENTS', count)
          print('DISPLAY_NAMES_ADDED', len(extra))
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff -U0 -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB' | grep -E '^[+-][[:space:]]*CASE "名前"|^[+-].*@SpellCard[0-9]+\('; then
            echo 'Internal spell-card identifier structure changed'; exit 1
          fi
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB'
          git commit -m '스펠카드 후반부 설명 한글화 25차'
          git push origin HEAD:korean

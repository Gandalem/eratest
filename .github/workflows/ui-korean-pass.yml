name: Korean UI safe pass

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ui-korean-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean working branch
        uses: actions/checkout@v4
        with:
          ref: agent/korean-localization
          fetch-depth: 0

      - name: Apply safe UI translations
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          import re

          exts={'.ERB','.ERH'}
          changed=[]
          replacements={
              'Invalid Input':'잘못된 입력',
              'Normal Peasant':'일반 소작농',
              'Hardcore Peasant':'고난도 소작농',
              'Extreme Peasant':'극한 소작농',
              'The loan has a {INT_NOUMIN(FLAG:地主, "金利")}％ interest rate.':'대출 이자율은 {INT_NOUMIN(FLAG:地主, "金利")}％이다.',
              '%NAME_地主% proposes to lend some gardening tools.':'%NAME_地主%는 원예 도구를 빌려주겠다고 제안한다.',
              "...It seems you aren't allowed to refuse.":'...거절할 수는 없는 것 같다.',
              '□ Update: Essentials':'□ 업데이트: 필수',
              '□ Update: Full':'□ 업데이트: 전체',
              '□ Update: Legacy':'□ 업데이트: 레거시',
              '□ Image Update':'□ 이미지 업데이트',
              '□ Pregnancy Settings':'□ 임신 설정',
              '□ Apply The Expanded Relations Patch':'□ 확장 관계 패치 적용',
              '□ (Debug) Dialogue Color List and Color Customization':'□ (디버그) 대사 색상 목록 및 색상 사용자 설정',
              '□ (Debug) Generate Request':'□ (디버그) 의뢰 생성',
              '□ (Debug) Test Translations':'□ (디버그) 번역 테스트',
              "□ Update Characters' Sexual Experiences According to the CSV Defaults":'□ CSV 기본값에 맞춰 캐릭터의 성 경험 업데이트',
              "□ Update Characters' Basic Skill Experiences According to the CSV Defaults":'□ CSV 기본값에 맞춰 캐릭터의 기본 기술 경험 업데이트',
              'Prev page':'이전 페이지',
              'Next page':'다음 페이지',
              'First page':'첫 번째 페이지',
              'Last page':'마지막 페이지',
          }
          labels={
              'No':'아니요','Yes':'예','Back':'뒤로','Next':'다음','Previous':'이전',
              'Exit':'종료','Cancel':'취소','Confirm':'확인','Save':'저장','Load':'불러오기',
              'Settings':'설정','Options':'옵션','Return':'돌아가기','Close':'닫기','Continue':'계속',
          }
          output=re.compile(r'^(\s*(?:PRINT\w*|REUSELASTLINE|CALL\s+PRINTBUTTON_EX)\b)(.*)$',re.I)
          bracket_label=re.compile(r'^(\s*\[[^\]]+\]\s*)([A-Za-z]+)(\s*)$')
          plain_label=re.compile(r'^(\s*)([A-Za-z]+)(\s*)$')

          for p in Path('ERB').rglob('*'):
              if not p.is_file() or p.suffix.upper() not in exts: continue
              raw=p.read_bytes()
              enc=None
              for e in ('utf-8-sig','utf-8','cp932'):
                  try:
                      text=raw.decode(e); enc=e; break
                  except UnicodeDecodeError: pass
              if enc is None: continue
              original=text
              lines=[]
              for line in text.splitlines(keepends=True):
                  body=line.rstrip('\r\n'); nl=line[len(body):]
                  m=output.match(body)
                  if m:
                      prefix,tail=m.group(1),m.group(2)
                      for a,b in replacements.items():
                          if a in tail: tail=tail.replace(a,b)
                      bm=bracket_label.match(tail)
                      if bm and bm.group(2) in labels:
                          tail=bm.group(1)+labels[bm.group(2)]+bm.group(3)
                      else:
                          pm=plain_label.match(tail)
                          if pm and pm.group(2) in labels:
                              tail=pm.group(1)+labels[pm.group(2)]+pm.group(3)
                      body=prefix+tail
                  lines.append(body+nl)
              text=''.join(lines)

              # Verified data strings used directly as labels in the update menu.
              if p.as_posix().endswith('ERB/TRANSLATION/NEW_UPDATE/UpdateMenus.ERB'):
                  text=text.replace('#DIMS CONST DISP_NAME = "Main Menu", "Individual Tweaks", "Dialogue Selector", "World Manipulation"',
                                    '#DIMS CONST DISP_NAME = "메인 메뉴", "개별 조정", "대화 선택", "세계 조작"')
                  text=text.replace('PRINTFORML Page {P1_PAGE}', 'PRINTFORML 페이지 {P1_PAGE}')
                  text=text.replace('%PLURALIZER("notification", News_Amount)%', '알림')
                  text=text.replace('%PLURALIZER("character", Update_Behavior_NewDlgAdded)%', '캐릭터')
                  text=text.replace('%PLURALIZER("dialogue", Update_Behavior_NewDlgAdded)%', '대화')
                  text=text.replace('%PLURALIZER("character", Update_Behavior_DlgLost)%', '캐릭터')
                  text=text.replace('%PLURALIZER("dialogue", Update_Behavior_DlgLost)%', '대화')

              if text!=original:
                  p.write_text(text,encoding='utf-8-sig',newline='')
                  changed.append(str(p))
          Path('UI_KOREAN_PASS.md').write_text(
              '# 안전 UI 한글화 패스\n\n'
              '코드 식별자를 건드리지 않고 출력 문맥의 메뉴 단어와 검증된 UI 문구만 치환했습니다.\n\n'
              f'- 이번 실행에서 변경된 파일 수: {len(changed)}\n\n'
              '## 변경 파일\n\n'+'\n'.join(f'- `{x}`' for x in changed[:500])+'\n',encoding='utf-8')
          print('changed files:',len(changed))
          PY
          git add ERB UI_KOREAN_PASS.md
          git commit -m "업데이트 메뉴와 공통 UI 추가 한글화" || true
          git push origin agent/korean-localization

name: Batch Korean pass 43

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-43.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate clothing display names
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          target = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB')
          raw = target.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          protected = [
              'CASE "名前"', 'CASE "FullName"', 'CASE "FullDesc"',
              'CASE "Generic Name"', 'CASE "装備部位"', 'CASE "Price"',
              'CASE "Tags"', 'CASE "Grade"', 'CASE "Armor"',
              'CASE "Armor Health"', 'CASE "Armor Coverage"'
          ]
          before_counts = {s: text.count(s) for s in protected}

          rules = [
              ('triangular headpiece', '삼각 머리 장식', 1),
              ('in-ear monitors', '인이어 모니터', 1),
              ('tiara', '티아라', 1),
              ('sister headress', '수녀 머리 장식', 1),
              ('baby bonnet', '베이비 보닛', 1),
              ('fake animal ears', '가짜 동물 귀', 1),
              ('rubber top hat', '고무 실크햇', 1),
              ('latex hood', '라텍스 후드', 1),
              ('knight helmet', '기사 투구', 1),
              ('motorcycle helmet', '오토바이 헬멧', 1),
              ('gas mask', '방독면', 2),
              ('hijab', '히잡', 1),
              ('clubbing dress', '클럽 드레스', 1),
              ('fishnet dress', '망사 드레스', 1),
              ('latex dress', '라텍스 드레스', 1),
              ('maternity dress', '임산부용 드레스', 1),
              ('royal dress', '왕실 드레스', 1),
              ('rubber dress', '고무 드레스', 1),
              ('floral purple sissy dress', '보라색 꽃무늬 여성화 드레스', 1),
              ('teddybear playsuit', '테디베어 플레이수트', 1),
              ('waddle outfit', '뒤뚱걸음 의상', 1),
              ('white sissy dress', '흰색 여성화 드레스', 1),
              ('yellow sissy baby dress', '노란색 여성화 베이비 드레스', 1),
              ('baby dress', '베이비 드레스', 1),
              ('patterned baby dress', '무늬 베이비 드레스', 1),
              ('floofy sissy baby dress', '풍성한 여성화 베이비 드레스', 1),
              ('dinosaur baby dress', '공룡무늬 베이비 드레스', 1),
              ('Gensou-chan dress', '겐소우짱 드레스', 1),
              ('pinafore dress', '피나포어 드레스', 1),
              ('polka dot business dress', '물방울무늬 비즈니스 드레스', 1),
              ('pinstripe business dress', '핀스트라이프 비즈니스 드레스', 1),
              ('fetish business dress', '페티시 비즈니스 드레스', 1),
              ('vest dress', '베스트 드레스', 1),
              ('cheerleader outfit', '치어리더 의상', 1),
              ('pink cocktail dress', '분홍색 칵테일 드레스', 1),
              ('white slut clubbing dress', '흰색 선정적 클럽 드레스', 1),
              ('black slut clubbing dress', '검정색 선정적 클럽 드레스', 1),
              ('tiny black clubbing dress', '초미니 검정 클럽 드레스', 1),
              ('white cocktail dress', '흰색 칵테일 드레스', 1),
              ('exposing black clubbing dress', '노출형 검정 클럽 드레스', 1),
              ('exposing pink clubbing dress', '노출형 분홍색 클럽 드레스', 1),
              ('blue slut clubbing dress', '파란색 선정적 클럽 드레스', 1),
              ('purple cocktail dress', '보라색 칵테일 드레스', 1),
              ('pink sequins dress', '분홍색 스팽글 드레스', 1),
              ('exposing blue clubbing dress', '노출형 파란색 클럽 드레스', 1),
              ('red dining dress', '빨간색 디너 드레스', 1),
              ('black dining dress', '검정색 디너 드레스', 1),
              ('red evening dress', '빨간색 이브닝 드레스', 1),
              ('pink evening dress', '분홍색 이브닝 드레스', 1),
              ('purple evening dress', '보라색 이브닝 드레스', 1),
              ('lace evening dress', '레이스 이브닝 드레스', 1),
              ('black lace evening dress', '검정 레이스 이브닝 드레스', 1),
              ('ivy leaves', '담쟁이덩굴 잎', 1),
              ('living tentacles', '살아 있는 촉수', 1),
              ('goddess tunic', '여신 튜닉', 1),
              ('green fetish hobble dress', '초록색 페티시 호블 드레스', 1),
          ]

          changed = 0
          for old, new, expected in rules:
              needle = f'CALLF MAKE_STR(V_NAME, "{old}")'
              repl = f'CALLF MAKE_STR(V_NAME, "{new}")'
              count = text.count(needle)
              if count != expected:
                  raise SystemExit(f'anchor count mismatch for {old!r}: expected {expected}, got {count}')
              text = text.replace(needle, repl)
              changed += count

          if changed != 57:
              raise SystemExit(f'expected 57 replacements, got {changed}')

          after_counts = {s: text.count(s) for s in protected}
          if before_counts != after_counts:
              raise SystemExit(f'protected schema counts changed: before={before_counts} after={after_counts}')

          data = text.encode('utf-8')
          if bom:
              data = b'\xef\xbb\xbf' + data
          target.write_bytes(data)
          print(f'replacements: {changed}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          target='ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB'
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          if [[ ${#changed[@]} -ne 1 || "${changed[0]}" != "$target" ]]; then
            printf 'Unexpected changed files:\n%s\n' "${changed[*]}"
            exit 1
          fi
          read -r additions deletions filename < <(git diff --numstat)
          if [[ "$additions" != "57" || "$deletions" != "57" || "$filename" != "$target" ]]; then
            echo "Unexpected numstat: +$additions -$deletions $filename"
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB')
          raw = p.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('BOM was not preserved')
          text = raw.decode('utf-8-sig')
          required = [
              '삼각 머리 장식', '인이어 모니터', '방독면', '히잡',
              '임산부용 드레스', '보라색 꽃무늬 여성화 드레스',
              '겐소우짱 드레스', '물방울무늬 비즈니스 드레스',
              '흰색 선정적 클럽 드레스', '분홍색 스팽글 드레스',
              '검정 레이스 이브닝 드레스', '초록색 페티시 호블 드레스'
          ]
          for s in required:
              if s not in text:
                  raise SystemExit(f'missing translated anchor: {s}')
          forbidden = [
              'CALLF MAKE_STR(V_NAME, "triangular headpiece")',
              'CALLF MAKE_STR(V_NAME, "fishnet dress")',
              'CALLF MAKE_STR(V_NAME, "pink cocktail dress")',
              'CALLF MAKE_STR(V_NAME, "green fetish hobble dress")',
          ]
          for s in forbidden:
              if s in text:
                  raise SystemExit(f'old display string remains: {s}')
          print('validation: ok')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Clothing/Omogatari_Clothing.ERB'
          git diff --cached --quiet && { echo 'No staged changes'; exit 1; }
          git commit -m '의류 UI 표시명 한글화 43차'
          git push origin korean

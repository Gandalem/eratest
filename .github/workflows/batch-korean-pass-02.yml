name: Batch Korean pass 02

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-02.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Apply safe visible-text translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          patches = {
            'ERB/TRANSLATION/OMOGATARI/NAS_TIPS_TR.ERB': [
              (r'''Commands are sorted into different risk categories.\nWhite: Safe to execute\nYellow: May cause physical or relationship harm.\nOrange: Will cause physical or relationship harm.\nRed: Will cause severe physical or relationship harm, can be fatal\nDark Red: Will either kill the Touhou or cause her to become hostile.''',
               r'''커맨드는 위험도에 따라 분류됩니다.\n흰색: 안전하게 실행할 수 있습니다.\n노란색: 신체적 피해나 관계 악화를 일으킬 수 있습니다.\n주황색: 신체적 피해나 관계 악화를 일으킵니다.\n빨간색: 심각한 신체적 피해나 관계 악화를 일으키며 치명적일 수 있습니다.\n진한 빨간색: 상대가 사망하거나 적대 상태가 됩니다.'''),
              (r'''Note that shooting accuracy for the character is calculated per tile, meaning that while a trivial increase (like 1% or so) in shooting accuracy may not matter up close, it can make a huge difference in long distances.\n''',
               r'''캐릭터의 사격 명중률은 타일 단위로 계산됩니다. 따라서 가까운 거리에서는 1% 정도의 작은 명중률 상승이 별 차이가 없어 보여도, 장거리에서는 큰 차이를 만들 수 있습니다.\n'''),
              (r'''The Bed Protection Settings allows you to change your nighttime underwear, place underpads on your bed, and take toileting related drugs to lessen or increase the chances of a bedtime accident''',
               r'''침대 보호 설정에서는 취침용 속옷을 바꾸고, 침대에 방수 패드를 깔거나, 수면 중 실수 확률을 낮추거나 높이는 배변 관련 약물을 사용할 수 있습니다'''),
            ],

            'ERB/TRANSLATION/OMOGATARI/Body Parts/0 Bipedal.ERB': [
              (r'''Appendages for holding things. Both must be working properly to hold two-handed weapons. Having no arms or hands will result in you being unable to hold anything. A critical hit to the arm will result in an artery bleed, significantly more critical compared to a normal bleed due to the increased hemorrhage. ''',
               r'''물건을 잡는 데 사용하는 부위입니다. 양손 무기를 사용하려면 양쪽 팔이 모두 정상적으로 기능해야 합니다. 팔이나 손이 없으면 아무것도 들 수 없습니다. 팔에 치명타를 입으면 동맥 출혈이 발생하며, 출혈량이 많아 일반 출혈보다 훨씬 위험합니다. '''),
              (r'''Appendages for moving. Injured legs make your move slower. Having no legs or bound legs makes it impossible to normally move. A critical hit to the leg will result in an artery bleed, significantly more critical compared to a normal bleed due to the increased hemorrhage.''',
               r'''이동에 사용하는 부위입니다. 다리를 다치면 이동 속도가 느려집니다. 다리가 없거나 묶여 있으면 정상적으로 이동할 수 없습니다. 다리에 치명타를 입으면 동맥 출혈이 발생하며, 출혈량이 많아 일반 출혈보다 훨씬 위험합니다.'''),
              (r'''A very important part as it allows blood to circulate between the head and the rest of the body. Necks are also very vulnerable to bleeding, and bleed rapidly, which can result in death within minutes''',
               r'''머리와 나머지 신체 사이로 혈액이 순환하게 해 주는 매우 중요한 부위입니다. 목은 출혈에도 매우 취약하며, 심한 출혈이 발생하면 몇 분 안에 사망할 수 있습니다'''),
              (r'''What your head conceals, and an essential part for life. This is the main factor for Consciousness and an injured brain directly affects it. Death happens when this part hits 0%, not -100%''',
               r'''머리 안에 있는 생명 유지에 필수적인 부위입니다. 의식에 가장 큰 영향을 주며, 뇌 손상은 의식 상태에 직접적인 영향을 줍니다. 이 부위는 -100%가 아니라 0%가 되면 사망합니다'''),
            ],

            'ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Be Free.ERB': [
              (r'''Basically, you have to beat all stage bosses in each stage to get it. Beat teams and team leaders to bring out minibosses. Beat minibosses to bring out the the stage boss. Beat the stage boss to get the next stage's license. That's pretty much the standard procedure.''',
               r'''기본적으로 각 스테이지의 보스를 모두 쓰러뜨려야 합니다. 팀과 팀장을 쓰러뜨리면 중간 보스가 등장하고, 중간 보스를 쓰러뜨리면 스테이지 보스가 등장합니다. 스테이지 보스를 이기면 다음 스테이지 라이선스를 얻습니다. 이게 기본적인 진행 방식입니다.'''),
              (r'''Vengeful Spirit's suggestion can work, depending on what caliber you go for, but you can also just keep using the same weapon. Changing the ammo you use for the weapon you're using can drastically change how viable the weapon is against your rival. From your profile it seems like you're using an 9x19mm SMG in Stage 4. Normal reserve ammo for that isn't great at dealing with Stage 4 armor, so switch to AP rounds or, if you can afford it, ESPKills. Keep in mind that you will have to buy ammo if you are not using reserve ammunition.''',
               r'''복수령이 말한 방법도 탄종에 따라 통할 수 있지만, 같은 무기를 계속 써도 됩니다. 어떤 탄약을 쓰느냐에 따라 상대에게 통하는 정도가 크게 달라집니다. 프로필을 보니 스테이지 4에서 9x19mm 기관단총을 쓰고 있네요. 일반 비축탄은 스테이지 4 방어구에 효과가 좋지 않으니 철갑탄으로 바꾸거나, 여유가 있다면 ESPKill 탄을 써 보세요. 비축탄이 아닌 탄약은 직접 구매해야 한다는 점도 잊지 마세요.'''),
              (r'''Your rival has Excretion Youjutsu, means they can manipulate your need to pee and poop. Use Makajamon to mute them so they can't cast the spell, or diaper up and go into the battle padded. As long as your diaper can hold up to your accidents, you won't lose turns and you won't get a rash.''',
               r'''상대는 배설 요술을 사용해서 소변이나 배변 욕구를 조작할 수 있습니다. 마카자몬으로 상대를 침묵시켜 주문을 못 쓰게 하거나, 보호용 속옷을 착용하고 전투에 들어가세요. 착용한 보호구가 실수를 감당할 수 있다면 턴을 잃거나 피부 트러블이 생기는 일을 줄일 수 있습니다.'''),
              (r'''You need to get a muzzle extension and rezero your optics so that they can hit accurate with the new ammunition. The YMKA Operator isn't an easy weapon to use, but putting a laser sight or optic can help make you hit targets easier.''',
               r'''새 탄약으로 정확하게 맞히려면 총구 연장 장치를 달고 조준기를 다시 영점 조정해야 합니다. YMKA Operator는 다루기 쉬운 무기는 아니지만 레이저 조준기나 광학 조준기를 달면 명중시키기 한결 편해집니다.'''),
              (r'''Have you tried finding Rin Satsuki. If you find her you can have her teach you about healing magic. Training time may be limited but you can always use some Charisma for extra time.''',
               r'''사츠키 린을 찾아봤나요? 그녀를 만나면 회복 마법을 배울 수 있습니다. 훈련 시간은 제한되어 있을 수 있지만 카리스마를 사용하면 시간을 더 확보할 수 있습니다.'''),
            ],

            'ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Human Village.ERB': [
              (r'''I've decided to take a fresh new look in Gensokyo and find a new approach to combat.<br> I'm up for a friendly battle or whatever. All comers are welcome! We're using muskets so it should be fair for anyone in Stage 1.''',
               r'''환상향을 새롭게 둘러보면서 새로운 전투 방식을 찾아보기로 했어.<br> 친선전이라면 누구든 환영이야! 우리는 머스킷을 쓰니까 스테이지 1에 있는 사람이라도 충분히 공평하게 싸울 수 있을 거야.'''),
              (r'''We are the Aki sisters, Shizuha and Minoriko. While we are harvest gods that bless the crops of our believers, we also want to try out the art of Danmaku. Meet us at the Human Village.''',
               r'''우리는 아키 자매, 시즈하와 미노리코야. 신도들의 농작물에 축복을 내리는 수확의 신이지만, 탄막 승부에도 한번 도전해 보고 싶어. 인간 마을에서 만나자.'''),
              (r'''Awooo〜 I'm Steel Dinosaur, the head of a wolf girl team called Real Echo. We may have super adorable wolf tails and look young but our claws cut sharp. Anyone here want to challenge us?''',
               r'''아우우〜 나는 스틸 다이노소어, 늑대 소녀 팀 「리얼 에코」의 리더야. 꼬리가 귀엽고 어려 보일지는 몰라도 발톱은 아주 날카롭다고. 우리에게 도전할 사람 없어?'''),
              (r'''If you caught a Danmaku bullet during a battle, I can help patch you back up using my magic. Just come over to me in the human village. <br>Just don't come to just battle, okay. Unless you at least have a Stage 3 license.''',
               r'''탄막전에서 총알을 맞아 다쳤다면 내 마법으로 치료해 줄 수 있어. 인간 마을로 찾아와.<br>다만 싸움만 하려고 오는 건 안 돼. 적어도 스테이지 3 라이선스 정도는 가지고 와.'''),
              (r'''Taking a little break from stonestacking to see what the fuss is all about. Obviously dueling has much more risk than stone stacking, so go easy around me. I'll be roaming about the human village.''',
               r'''돌 쌓기는 잠깐 쉬고 사람들이 왜 이렇게 떠들썩한지 보러 왔어. 결투는 돌 쌓기보다 훨씬 위험하니까 나한테는 살살 해 줘. 인간 마을 주변을 돌아다니고 있을게.'''),
              (r'''We're FENCE Sitters, and we are looking for people that enjoy swordplay as much as us. We mainly run sharp melee weapons, so you can probably go and fight us with your gun, but good luck unless you hit the first shot.''',
               r'''우리는 「FENCE Sitters」야. 우리만큼 검술을 좋아하는 사람을 찾고 있어. 주로 날이 선 근접 무기를 쓰니까 총을 들고 덤벼도 되지만, 첫발에 맞히지 못하면 꽤 힘들 거야.'''),
            ],

            'ERB/TRANSLATION/OMOGATARI/EZB/Danmaku World/Direct Messages.ERB': [
              (r'''Sorry if you're busy, but I'm Renko's partner, Maribel, but most people just call me Merry. I saw that you really smashed her in that battle from what I've heard. <br>I want to challenge you over at the Human Village. <br>I trained up quite a bit casting and dodging Danmaku for this battle. Hopefully I won't be a pushover like her.''',
               r'''바쁜데 미안해. 나는 렌코의 파트너 마리벨이야. 다들 메리라고 부르지. 들으니까 그 싸움에서 렌코를 제대로 이겼다며?<br>인간 마을에서 너에게 도전하고 싶어.<br>이번 승부를 위해 탄막을 쏘고 피하는 연습을 꽤 했어. 렌코처럼 쉽게 지지는 않을 거야.'''),
            ],

            'ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB': [
              (r'''Bats and blood.\nA being who sustains itself by drinking blood.\nBecause the spelling for Vampire contains the character for Oni, they are also weak to soy beans.\nNocturnal creatures, they shun the sun and go out at night instead.\nPowerful ones can simply walk around with a parasol if they want.\nAs their bodies are dead, it is difficult for them to conceive.''',
               r'''박쥐와 피.\n피를 마시며 살아가는 존재입니다.\n「흡혈귀」라는 명칭에 오니를 뜻하는 글자가 들어가기 때문에 콩에도 약합니다.\n야행성이라 햇빛을 꺼리고 밤에 활동합니다.\n강한 개체라면 양산 하나만으로 낮에도 돌아다닐 수 있습니다.\n육체가 이미 죽은 상태이기 때문에 임신하기 어렵습니다.'''),
              (r'''Cucumbers and power-tools.\nWater-dwelling Youkai that love cucumbers and sating their curiosity.\nWith an innate ADHD-like condition, they usually leave projects in a half-finished and dislike long projects.\nThey are known to extract Shirikodama from anuses of humans, killing them.\nDeath to anus bandits.''',
               r'''오이와 공구.\n물을 터전으로 삼으며 오이와 호기심을 채우는 일을 좋아하는 요괴입니다.\n타고난 산만함 때문에 일을 반쯤 끝낸 채 내버려 두는 경우가 많고 장기 프로젝트를 싫어합니다.\n인간에게서 시리코다마를 뽑아 목숨을 앗아간다고 알려져 있습니다.\n엉덩이 도둑에게 죽음을.'''),
              (r'''Feathers, furs and sandals.\nTengu are highly territorial Youkai divided into 2 distinct races.\nThe soaring Crow Tengu can move faster than any other Youkai.\n   Can create gales of wind, even whirlwinds on command.\nThe stalwart Wolf Tengu defends the mountain but can get caught up in Shogi for days.\n   Possesses sharp senses and have the power of telegnosis.\nPerhaps because of their proud aura, they are very difficult to impregnate.''',
               r'''깃털, 털가죽, 그리고 게다.\n텐구는 영역 의식이 강한 요괴로 크게 두 종족으로 나뉩니다.\n하늘을 누비는 카라스텐구는 다른 어떤 요괴보다 빠르게 움직일 수 있습니다.\n   명령만으로 돌풍과 회오리바람을 만들어낼 수 있습니다.\n늠름한 백랑텐구는 산을 지키며, 장기에 빠지면 며칠씩 헤어나오지 못하기도 합니다.\n   예민한 감각과 원격 감지 능력을 지니고 있습니다.\n자존심 강한 기질 때문인지 임신시키기 매우 어렵습니다.'''),
              (r'''A humanoid race of Youkai rabbits that come from Earth.\nThey value having a laid back lifestyle and are naturally gifted with magical powers.\nThey pound Mochi in order to keep the Full Moon away.\nAs with all Youkai, it is difficult to impregnate one.''',
               r'''지상 출신의 인간형 요괴 토끼입니다.\n느긋한 삶을 중요하게 여기며 타고난 마력을 지니고 있습니다.\n보름달을 멀리하기 위해 떡을 찧습니다.\n다른 요괴와 마찬가지로 임신시키기 어렵습니다.'''),
              (r'''A humanoid race of Youkai rabbits that come from the Moon.\nWhile they enjoy a laid back lifestyle, they are at times forced to go to war.\nThey pound Mochi to atone for the sins of their master.\nAs with all Youkai, it is difficult to impregnate one.''',
               r'''달 출신의 인간형 요괴 토끼입니다.\n느긋한 삶을 즐기지만 때로는 전쟁에 동원되기도 합니다.\n주인의 죄를 씻기 위해 떡을 찧습니다.\n다른 요괴와 마찬가지로 임신시키기 어렵습니다.'''),
              (r'''Bridge Princess, Youkai born of jealousy and envy.\nAs their name implies, they “guard” bridges, hassling people trying to cross them.\nDo not let them envy you.\nAs with all Youkai, it is difficult to impregnate one.''',
               r'''하시히메. 질투와 시기에서 태어난 요괴입니다.\n이름처럼 다리를 「지키며」 건너려는 사람을 괴롭힙니다.\n그들에게 질투받지 않도록 조심하세요.\n다른 요괴와 마찬가지로 임신시키기 어렵습니다.'''),
              (r'''A spirit of a mizuko, meaning a child that was either stillborn, or only lived for a short time.\nLike all such spirits, they live at the Sai no Kawara, on the banks of the Sanzu River, spending their time stacking stones into towers.\nBeing partially human and partially non-human, it is tricky for them to conceive.''',
               r'''미즈코의 영혼입니다. 태어나지 못했거나 아주 짧은 생을 살고 떠난 아이의 혼을 뜻합니다.\n이런 영혼들은 삼도천 강변의 사이노카와라에서 돌을 쌓으며 지냅니다.\n인간과 비인간의 성질을 함께 지니고 있어 임신이 쉽지 않습니다.'''),
              (r'''A type of fox youkai that live in bamboo pipes.\nThey have potent magical powers and can bestow great wealth on their masters, but feed on their masters' vitality in the process, inevitably leading them to ruin.\nTo use them as a familiar, it's required to keep a male/female pair, but as they steadily increase their numbers, they will rapidly consume all its supposed “master” possesses.\nAs with all Youkai, it is difficult to impregnate one.''',
               r'''대나무 통 속에 사는 여우 요괴의 일종입니다.\n강한 마력을 지니며 주인에게 큰 부를 가져다줄 수 있지만, 그 과정에서 주인의 생명력을 먹어 결국 파멸로 이끕니다.\n사역마로 쓰려면 암수 한 쌍을 길러야 하지만, 계속 번식하면서 수가 늘어나면 「주인」이 가진 모든 것을 빠르게 소모합니다.\n다른 요괴와 마찬가지로 임신시키기 어렵습니다.'''),
            ],
          }

          changed_files = 0
          total_replacements = 0
          missing = []

          for file, reps in patches.items():
              p = Path(file)
              if not p.exists():
                  missing.append((file, 'FILE MISSING'))
                  continue
              raw = p.read_bytes()
              had_bom = raw.startswith(b'\xef\xbb\xbf')
              text = raw.decode('utf-8-sig', errors='strict')
              before = text
              for old, new in reps:
                  count = text.count(old)
                  if count:
                      text = text.replace(old, new)
                      total_replacements += count
                      print(f'REPLACED {count}: {file} :: {old[:70]!r}')
                  else:
                      missing.append((file, old[:100]))
              if text != before:
                  data = text.encode('utf-8')
                  if had_bom:
                      data = b'\xef\xbb\xbf' + data
                  p.write_bytes(data)
                  changed_files += 1

          print(f'Changed files: {changed_files}')
          print(f'Total replacements: {total_replacements}')
          if missing:
              print('Not found / already translated:')
              for item in missing:
                  print('  ', item)
          if total_replacements == 0:
              raise SystemExit('No translation strings were replaced')
          PY

      - name: Sanity check ERB files
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --stat
          # Make sure no obvious function declarations or variable identifiers were mass-translated.
          ! git diff -U0 | grep -E '^[-+].*@(NAS_|ASK_|YesOrNo|TITLE_NAS_STR)' || { echo 'Potential identifier modification detected'; exit 1; }

      - name: Commit and push Korean branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ERB
          if git diff --cached --quiet; then
            echo 'Nothing to commit'
            exit 0
          fi
          git commit -m '대사 및 툴팁 한글화 2차'
          git push origin HEAD:korean

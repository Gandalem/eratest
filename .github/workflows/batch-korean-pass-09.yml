name: Batch Korean pass 09

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-09.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate character profiles and schedules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/_Name_Array.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')
          before_western = text.count('"Western"')
          before_japanese = text.count('"Japanese"')

          reps = [
            # Locations
            ("Hakurei Shrine - Shrine Grounds", "하쿠레이 신사 - 경내"),
            ("Hakurei Shrine - Kitchen", "하쿠레이 신사 - 부엌"),
            ("Hakurei Shrine - Garden・Village - Liquor store 18:00～21:00", "하쿠레이 신사 - 정원・인간 마을 - 주점 18:00～21:00"),
            ("Three Fairies House - Sunny's Boudoir", "세 요정의 집 - 서니의 방"),
            ("Fantasy Ruins - Lab", "환상 유적 - 연구실"),
            ("Hakurei Shrine - Garden", "하쿠레이 신사 - 정원"),
            ("Hakurei Shrine - Storage Room and Garden", "하쿠레이 신사 - 창고와 정원"),
            ("Myouren Temple - Jizo Street", "묘렌사 - 지조 거리"),
            ("Three Fairies House - Sunny's Boudoir & Village - Square", "세 요정의 집 - 서니의 방 & 인간 마을 - 광장"),
            ("Scarlet Devil Mansion - Hall and Dining Room", "홍마관 - 홀과 식당"),
            ("Scarlet Devil Mansion - Small Balcony", "홍마관 - 작은 발코니"),
            ("Village - Square", "인간 마을 - 광장"),
            ("Hakurei Shrine - Main Shrine・Village - Liquor store 18:00～21:00", "하쿠레이 신사 - 본전・인간 마을 - 주점 18:00～21:00"),
            ("Hakurei Shrine - Main Shrine", "하쿠레이 신사 - 본전"),
            ("Bamboo Forest Entrance", "대나무숲 입구"),
            ("Youkai Mountain (Top) - Waterfall of Nine Heavens", "요괴의 산(정상) - 구천의 폭포"),
            ("Netherworld - The Ministry of Right and Wrong", "명계 - 시비곡직청"),
            ("Village - Temple School・Village - Liquor store 18:00～21:00", "인간 마을 - 서당・인간 마을 - 주점 18:00～21:00"),
            ("Hakurei Shrine - Offertory Box", "하쿠레이 신사 - 새전함"),
            ("\"Village\", \"Shopping (Wed)",", "\"인간 마을\", \"쇼핑 (수)\","),
            ("\"Kitchen\", \"Domestic helper",", "\"부엌\", \"가사 도우미"),

            # Schedules
            ("Cleaning the Shrine every morning 06:00～08:00", "매일 아침 신사 청소 06:00～08:00"),
            ("Housekeeping on weekdays 18:00～21:00", "평일 가사 18:00～21:00"),
            ("Training (Mon&Wed)　16:00～19:00・Girls Club  2nd Sunday Every Month", "훈련 (월&수)　16:00～19:00・걸즈 클럽  매월 둘째 일요일"),
            ("Playing (Sat&Sun)　10:00～17:00", "놀이 (토&일)　10:00～17:00"),
            ("Research on weekdays　06:00～12:00", "평일 연구　06:00～12:00"),
            ("Research on weekdays　10:00～13:00　14:00～17:00", "평일 연구　10:00～13:00　14:00～17:00"),
            ("Training (Wed) 16:00～19:00", "훈련 (수) 16:00～19:00"),
            ("Excavation and training (Mon)　13:00～19:00", "발굴 및 훈련 (월)　13:00～19:00"),
            ("Food Gathering (Tue)　22:00～00:00", "식량 채집 (화)　22:00～00:00"),
            ("Playing (Sat&Sun)　10:00～17:00 & Selling ice during summer when it's sunny 10:00～15:00", "놀이 (토&일)　10:00～17:00 & 여름 맑은 날 얼음 판매 10:00～15:00"),
            ("Cleaning and cooking (Mon&Wed&Fri)　08:00～12:00　17:00～19:00", "청소 및 요리 (월&수&금)　08:00～12:00　17:00～19:00"),
            ("Sunday Daily Routine (Sun)　18:30～19:00", "일요일 일과 (일)　18:30～19:00"),
            ("Puppet show once per two weeks　10:00～12:00", "2주에 한 번 인형극　10:00～12:00"),
            ("Concert once per month (Sun)　13:00～19:00", "월 1회 콘서트 (일)　13:00～19:00"),
            ("Barrier Management on 5th and 20th day of every month", "매월 5일과 20일 결계 관리"),
            ("Barrier Management every 30th day of Winter・Girls Club  2nd Sunday Every Month", "겨울 30일마다 결계 관리・걸즈 클럽  매월 둘째 일요일"),
            ("Lamprey Shop once per three days　16:00～00:00", "3일에 한 번 칠성장어 가게　16:00～00:00"),
            ("Writing News on Friday　13:00～19:00", "금요일 신문 작성　13:00～19:00"),
            ("Judicial and administrative work every other day 09:00～19:00", "격일 재판 및 행정 업무 09:00～19:00"),
            ("Canvassing (Tue&Fri)　12:00～16:00", "포교 활동 (화&금)　12:00～16:00"),
            ("Body measurement every Summer on 5th day　09:00～12:00・Girls Club  2nd Sunday Every Month", "매년 여름 5일 신체 측정　09:00～12:00・걸즈 클럽  매월 둘째 일요일"),
            ("Domestic helper　???　11:00～13:00", "가사 도우미　???　11:00～13:00"),
            ("Prayer (Sat)　10:00～10:10", "기도 (토)　10:00～10:10"),

            # Profile titles / race / ability descriptions
            ("～Shrine Maiden of Paradise～", "～낙원의 무녀～"),
            ("●Race:Human", "●종족:인간"),
            ("●Ability:Ability to float", "●능력:공중에 뜨는 정도의 능력"),
            ("●Race:Paniel", "●종족:파니엘"),
            ("～Maiden poltergeist who's lost her dreams～", "～꿈을 잃은 소녀 폴터가이스트～"),
            ("●Race:Poltergeist", "●종족:폴터가이스트"),
            ("～Spirit who leaves fate to the dream of eternity～", "～영원의 꿈에 운명을 맡기는 영혼～"),
            ("●Race:Vengeful spirit", "●종족:원령"),
            ("～Mischievous Sunlight～", "～장난꾸러기 햇빛～"),
            ("●Race:Fairy", "●종족:요정"),
            ("●Ability:Refraction of light", "●능력:빛을 굴절시키는 정도의 능력"),
            ("～Silent Moonlight～", "～고요한 달빛～"),
            ("●Ability:Muting (the surrounding) sound", "●능력:주변의 소리를 지우는 정도의 능력"),
            ("～Pouring Starlight～", "～쏟아지는 별빛～"),
            ("●Ability:Detection of moving things", "●능력:움직이는 것을 감지하는 정도의 능력"),
            ("～Resident of fantasy that runs through time～", "～시간을 달리는 환상의 주민～"),
            ("～Fantasy legend～", "～환상 전설～"),
            ("～Tiny Night Parade of a Hundred Demons～", "～작은 백귀야행～"),
            ("●Race:Oni", "●종족:오니"),
            ("●Ability:Manipulation of density and sparseness", "●능력:밀도와 희박함을 조종하는 정도의 능력"),
            ("～Ordinary Magician～", "～평범한 마법사～"),
            ("●Ability:Using magic", "●능력:마법을 사용하는 정도의 능력"),
            ("～Youkai of the Dusk～", "～황혼의 요괴～"),
            ("●Race:Youkai", "●종족:요괴"),
            ("●Ability:Manipulating Darkness", "●능력:어둠을 조종하는 정도의 능력"),
            ("～Small Fairy of the Ice～", "～얼음의 작은 요정～"),
            ("●Race:A Girl of Snow", "●종족:눈의 소녀"),
            ("●Ability:Manipulating cold", "●능력:냉기를 조종하는 정도의 능력"),
            ("～Perfect and Elegant Maid～", "～완벽하고 우아한 메이드～"),
            ("●Ability:Time manipulation", "●능력:시간을 조종하는 정도의 능력"),
            ("～The Eternal Young Scarlet Moon～", "～영원히 붉고 어린 달～"),
            ("●Race:Vampire", "●종족:흡혈귀"),
            ("●Ability:Manipulation of fate", "●능력:운명을 조종하는 정도의 능력"),
            ("～Seven-Colored Puppeteer～", "～칠색의 인형사～"),
            ("●Race:Magician", "●종족:마법사"),
            ("●Ability:Magic", "●능력:마법"),
            ("～Poltergeist Keyboardist～", "～폴터가이스트 키보디스트～"),
            ("～Poltergeist Trumpeter～", "～폴터가이스트 트럼펫 연주자～"),
            ("～Poltergeist Violinist～", "～폴터가이스트 바이올리니스트～"),
            ("●Ability:Performing on musical instruments without hands or feet", "●능력:손발을 쓰지 않고 악기를 연주하는 정도의 능력"),
            ("～Phantom-Human Gardener～", "～반인반령의 정원사～"),
            ("●Race:Half-human half-phantom", "●종족:반인반령"),
            ("●Ability:Handling sword techniques", "●능력:검술을 다루는 정도의 능력"),
            ("～Black Cat of Bad Omens～", "～불길한 검은 고양이～"),
            ("●Race:Shikigami（Bakeneko）", "●종족:식신（바케네코）"),
            ("●Ability:Use of sorcery", "●능력:요술을 사용하는 정도의 능력"),
            ("～Shikigami of the Gap Youkai～", "～틈새 요괴의 식신～"),
            ("●Race:Shikigami（Kitsune）", "●종족:식신（키츠네）"),
            ("●Ability:Using Shikigami", "●능력:식신을 다루는 정도의 능력"),
            ("～Mastermind behind the Spiriting Away～", "～신은 원인의 흑막～"),
            ("●Ability:Manipulation of boundaries", "●능력:경계를 조종하는 정도의 능력"),
            ("～A Bug of Light Wriggling in the Dark～", "～어둠 속에서 꿈틀대는 빛의 벌레～"),
            ("●Race:Firefly Youkai", "●종족:반딧불 요괴"),
            ("●Ability:Manipulation of insects", "●능력:벌레를 조종하는 정도의 능력"),
            ("～Night Sparrow Apparition～", "～밤참새 요괴～"),
            ("●Race:Night Sparrow", "●종족:밤참새"),
            ("●Ability:Driving people insane by singing", "●능력:노래로 사람을 미치게 하는 정도의 능력"),
            ("～Traditional Reporter of Fantasy～", "～전통의 환상향 기자～"),
            ("●Race:Crow Tengu", "●종족:까마귀 텐구"),
            ("●Ability:Manipulation of wind", "●능력:바람을 조종하는 정도의 능력"),
            ("～Supreme Judge of Paradise～, ～Yamaxanadu～,", "～낙원의 최고 재판장～, ～야마자나두～,"),
            ("●Race:Yama", "●종족:염마"),
            ("●Ability:Can distinctly judge anything to be good or evil", "●능력:무엇이든 선악을 분명히 판별하는 정도의 능력"),
            ("～Deified Human of the Wind～", "～바람의 신으로 모셔진 인간～"),
            ("●Ability:Causing miracles to occur", "●능력:기적을 일으키는 정도의 능력"),
            ("～The Avatar of Mountains and Lakes～", "～산과 호수의 화신～"),
            ("●Race:Divine Spirit", "●종족:신령"),
            ("●Ability:Creating heavenliness", "●능력:하늘의 성질을 만들어내는 정도의 능력"),
            ("～The Highest/Epitome of Native Gods～", "～토착신의 정점～"),
            ("●Race:Yaoyorozu no Kami", "●종족:야오요로즈의 신"),
            ("●Ability:Creating earthiness", "●능력:땅의 성질을 만들어내는 정도의 능력"),
            ("～Girl of the Sphere of Neither Perception nor Non-Perception～", "～비상비비상의 소녀～"),
            ("●Race:Fallen Celestial", "●종족:천인 출신"),
            ("●Ability:Manipulation of earth", "●능력:대지를 조종하는 정도의 능력"),
          ]

          total = 0
          for old, new in reps:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  total += c
                  print('REPLACED', c, old[:90])

          # Name-order markers are internal data; must remain untouched.
          if text.count('"Western"') != before_western or text.count('"Japanese"') != before_japanese:
              raise SystemExit('Internal name-order markers changed')
          if total < 80:
              raise SystemExit(f'Too few replacements: {total}')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          print('TOTAL_REPLACEMENTS', total)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ! git diff -U0 -- 'ERB/TRANSLATION/_Name_Array.ERB' | grep -E '^[-+].*@|^[-+].*CASE [0-9]+' || { echo 'Function or case structure changed'; exit 1; }
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/_Name_Array.ERB'
          git commit -m '캐릭터 프로필 및 일정 한글화 9차'
          git push origin HEAD:korean

name: Batch Korean pass 30

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-30.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate item menu and combat status UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read_text(path):
              raw = path.read_bytes()
              return raw.startswith(b'\xef\xbb\xbf'), raw.decode('utf-8-sig')

          def write_text(path, bom, text):
              data = text.encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              path.write_bytes(data)

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Item Modding.ERB')
          bom, text = read_text(p)
          reps = [
              ('LOCALS:1 = Req. Dev.', 'LOCALS:1 = 선행 개발 필요'),
              ('LOCALS:1 = Quest Only', 'LOCALS:1 = 퀘스트 전용'),
              ('PRINTFORML ＜N/A＞　%GetAttachmentType(TD_SubPAGE,1)%', 'PRINTFORML ＜없음＞　%GetAttachmentType(TD_SubPAGE,1)%'),
              ('PRINTFORML ({TD_ATTACH_COUNT}개의 첨부 파일이 있는 경우 {TD_PAGE}/{TD_PAGELast}페이지) %GetAttachmentType(TD_SubPAGE,1)%', 'PRINTFORML (부착물 {TD_ATTACH_COUNT}개 - {TD_PAGE}/{TD_PAGELast}페이지) %GetAttachmentType(TD_SubPAGE,1)%'),
              ('PRINTFORML 개발하다 %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%?', 'PRINTFORML %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%을(를) 개발할까?'),
              ('PRINTFORML %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%!을 개발했다.', 'PRINTFORML %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%을(를) 개발했다.'),
              ('PRINTFORM 모드 목록을 알 수 없습니다! 이것을 신고하세요!', 'PRINTFORM 개조 목록을 불러올 수 없습니다. 이 문제를 신고해 주세요.'),
              ('PRINTL 　　　　더 이상 수정할 수 없다.', 'PRINTL 　　　　더 이상 개조할 수 없습니다.'),
              ('PRINTL [999] 신경 쓰지 마', 'PRINTL [999] 돌아가기'),
              ('PRINTFORML [0] 반환', 'PRINTFORML [0] 돌아가기'),
              ('PRINTFORML [9] 반환한다', 'PRINTFORML [9] 돌아가기'),
              ('PRINTFORML [-1] 나가기', 'PRINTFORML [-1] 돌아가기'),
          ]
          item_count = 0
          for old, new in reps:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  item_count += c
                  print('ITEM_UI', c, old)
          if item_count < 8:
              raise SystemExit(f'Too few item menu replacements: {item_count}')
          write_text(p, bom, text)

          p = Path('ERB/TRANSLATION/OMOGATARI/BetterUI.ERB')
          bom, text = read_text(p)
          reps = [
              ('HTML:1 = Severe!!!!', 'HTML:1 = 매우 심각'),
              ('HTML:1 = Unmanageable!', 'HTML:1 = 감당 불가'),
              ('HTML:1 = Distressing', 'HTML:1 = 극심'),
              ('HTML:1 = Distracting', 'HTML:1 = 심함'),
              ('HTML:1 = Minimal', 'HTML:1 = 경미'),
              ('HTML:1 += @" {MinsOfBleedUntilDeath(ARG)%60}m"', 'HTML:1 += @" {MinsOfBleedUntilDeath(ARG)%60}분"'),
              ('HTML:1 \'= @"{MinsOfBleedUntilDeath(ARG)}m"', 'HTML:1 \'= @"{MinsOfBleedUntilDeath(ARG)}분"'),
              ('HTML \'= @"피 {(MAX(0,BASE:ARG:Blood)*100)/MAX(1,MAXBASE:ARG:Blood)}의 혈액 \\%"', 'HTML \'= @"혈액 {(MAX(0,BASE:ARG:Blood)*100)/MAX(1,MAXBASE:ARG:Blood)}\\%"'),
              ('@"부상은 고통을 유발한다. 고통은 %CALLNAME:ARG%의 의식에 영향을 미치고, 만약 %HE_SHE(ARG)%가 너무 많은 %HE_SHE(ARG)%를 받으면 기절할 것이다."', '@"부상은 고통을 유발한다. 고통이 심해질수록 %CALLNAME:ARG%의 의식이 흐려지며, 한계를 넘으면 기절할 수 있다."'),
              ('HTML_PRINT "Equipment: "+NAS_HTML', 'HTML_PRINT "장비: "+NAS_HTML'),
          ]
          combat_count = 0
          for old, new in reps:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  combat_count += c
                  print('COMBAT_UI', c, old)
          if combat_count < 10:
              raise SystemExit(f'Too few combat UI replacements: {combat_count}')
          write_text(p, bom, text)

          print('ITEM_MENU_REPLACEMENTS', item_count)
          print('COMBAT_STATUS_REPLACEMENTS', combat_count)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          ITEM='ERB/TRANSLATION/OMOGATARI/ITEM/Item Modding.ERB'
          UI='ERB/TRANSLATION/OMOGATARI/BetterUI.ERB'
          grep -Fq '@NAS_TOOL_MODS(ARG)' "$ITEM"
          grep -Fq '@TOOL_DEVELOP' "$ITEM"
          grep -Fq 'CAW_BASE = CLOTHES_ID("Weapon", CAW_STRING)' "$ITEM"
          grep -Fq '@SHOW_EQUIP_HEALTH(ARG)' "$UI"
          grep -Fq '@SHOW_EQUIP_WEAPON' "$UI"
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Item Modding.ERB' \
            'ERB/TRANSLATION/OMOGATARI/BetterUI.ERB'
          git commit -m '일반 아이템 메뉴 및 전투 상태 UI 한글화 30차'
          git push origin HEAD:korean

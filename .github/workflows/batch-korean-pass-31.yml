name: Batch Korean pass 31

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-31.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Refine item UI and remaining English UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          TOKEN_RE = re.compile(r'%[^%\n]+%|\{[^{}\n]+\}|\\%')

          def read_text(path):
              raw = path.read_bytes()
              return raw.startswith(b'\xef\xbb\xbf'), raw.decode('utf-8-sig')

          def write_text(path, bom, text):
              data = text.encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              path.write_bytes(data)

          def tokens(s):
              return sorted(TOKEN_RE.findall(s))

          def apply_exact(text, rules, label):
              total = 0
              for old, new, expected in rules:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(
                          f'{label}: unexpected match count: expected={expected}, actual={count}\n{old}'
                      )
                  if tokens(old) != tokens(new):
                      raise SystemExit(
                          f'{label}: protected token mismatch\nOLD {tokens(old)}\nNEW {tokens(new)}\n{old}'
                      )
                  text = text.replace(old, new)
                  total += count
                  print(label, count, old)
              return text, total

          item = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Item Modding.ERB')
          bom, text = read_text(item)
          item_rules = [
              ('PRINTFORML ＜없음＞　%GetAttachmentType(TD_SubPAGE,1)%',
               'PRINTFORML ＜해당 없음＞　%GetAttachmentType(TD_SubPAGE,1)%', 1),
              ('PRINTFORML (부착물 {TD_ATTACH_COUNT}개 - {TD_PAGE}/{TD_PAGELast}페이지) %GetAttachmentType(TD_SubPAGE,1)%',
               'PRINTFORML (부착물 {TD_ATTACH_COUNT}개 · {TD_PAGE}/{TD_PAGELast} 페이지) %GetAttachmentType(TD_SubPAGE,1)%', 1),
              ('PRINTL [998] - 카리스마(Charisma) 100 기부',
               'PRINTL [998] - 카리스마 100 기부', 1),
              ('PRINTFORML %GET_STR(MASTER, "Weapon", GET_INT(MASTER, "Weapon", ITEM_PICKED, "Prerequisite"), "FullName")%가 먼저 개발되어야 한다.',
               'PRINTFORML 선행 개발 필요: %GET_STR(MASTER, "Weapon", GET_INT(MASTER, "Weapon", ITEM_PICKED, "Prerequisite"), "FullName")%', 1),
              ('PRINTFORML 이 무기는 퀘스트를 통해서만 얻거나 다른 수단으로만 획득할 수 있다.',
               'PRINTFORML 이 무기는 퀘스트 또는 다른 수단으로만 획득할 수 있습니다.', 1),
              ('PRINTFORML %printWeaponName(,ITEM_PICKED,,1,1)%를 개발한다?',
               'PRINTFORML 다음 무기를 개발할까요? %printWeaponName(,ITEM_PICKED,,1,1)%', 1),
              ('PRINTFORML 이 무기를 개발함으로써 당신은 다음 또한 개발하게 된다:',
               'PRINTFORML 이 무기를 개발하면 다음 항목도 함께 개발됩니다:', 1),
              ('PRINTFORML %printWeaponName(,ITEM_PICKED,,1,1)%을(를) 개발했다!',
               'PRINTFORML 무기 개발 완료: %printWeaponName(,ITEM_PICKED,,1,1)%', 1),
              ('PRINTFORML 당신은 또한 개발했다:',
               'PRINTFORML 다음 항목도 함께 개발되었습니다:', 1),
              ('PRINTFORML 다른 %printWeaponName(,ITEM_PICKED,,1,1)%을 구매할까?',
               'PRINTFORML 동일한 무기를 하나 더 구매할까요? %printWeaponName(,ITEM_PICKED,,1,1)%', 1),
              ('PRINTFORMW %printWeaponName(,ITEM_PICKED,,1,1)%을(를) 구입했다!',
               'PRINTFORMW 무기 구매 완료: %printWeaponName(,ITEM_PICKED,,1,1)%', 1),
              ('PRINTFORML %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%을(를) 개발할까?',
               'PRINTFORML 다음 부착물을 개발할까요? %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%', 1),
              ('PRINTFORML %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%을(를) 개발했다!',
               'PRINTFORML 부착물 개발 완료: %AttachmentDisplayName(0, GetAttachmentType(TD_SubPage), ITEM_PICKED)%', 1),
          ]
          text, item_count = apply_exact(text, item_rules, 'ITEM_UI')
          write_text(item, bom, text)

          ui = Path('ERB/TRANSLATION/OMOGATARI/BetterUI.ERB')
          bom, text = read_text(ui)
          ui_rules = [
              ('SFSR_TYPE \'= "Body Parts"', 'SFSR_TYPE \'= "신체 부위"', 1),
              ('CALL COND_COLORMESSAGE((ABL:ARG:欲望 - ABL:ARG:親密) >= 0,"Desire greater or equal to Intimacy")',
               'CALL COND_COLORMESSAGE((ABL:ARG:欲望 - ABL:ARG:親密) >= 0,"욕정이 친밀도 이상")', 1),
              ('CALL COND_COLORMESSAGE(MARK:ARG:10 >= 3,"Regression Mark 3")',
               'CALL COND_COLORMESSAGE(MARK:ARG:10 >= 3,"퇴행 각인 3")', 1),
              ('CALL COND_COLORMESSAGE(ABL:ARG:63,"10 Diaper Attraction")',
               'CALL COND_COLORMESSAGE(ABL:ARG:63,"기저귀 매력도 10")', 1),
              ('%COND_STR(@"\\nImmune to checks for {TCVAR:MASTER:DiaperCheckImmunity} minutes",TCVAR:MASTER:DiaperCheckImmunity)%',
               '%COND_STR(@"\\n확인 판정 면역: {TCVAR:MASTER:DiaperCheckImmunity}분",TCVAR:MASTER:DiaperCheckImmunity)%', 1),
              ('%COND_STR(@"\\nAttuned to %MagicUnderwear_GetName(DiapeMagicAttunement:MASTER:0)%",STRLENS(DiapeMagicAttunement:MASTER:0))%',
               '%COND_STR(@"\\n조율: %MagicUnderwear_GetName(DiapeMagicAttunement:MASTER:0)%",STRLENS(DiapeMagicAttunement:MASTER:0))%', 1),
          ]
          text, ui_count = apply_exact(text, ui_rules, 'BETTER_UI')
          write_text(ui, bom, text)

          attrs = Path('.gitattributes')
          bom, text = read_text(attrs)
          bad = '*.npz filter=lfs diff=lfs merge=lfs -\n'
          count = text.count(bad)
          if count != 1:
              raise SystemExit(f'ATTRS: expected one invalid npz rule, actual={count}')
          text = text.replace(bad, '')
          write_text(attrs, bom, text)

          print('ITEM_UI_REPLACEMENTS', item_count)
          print('BETTER_UI_REPLACEMENTS', ui_count)
          print('ATTR_RULE_REMOVALS', count)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

          ITEM='ERB/TRANSLATION/OMOGATARI/ITEM/Item Modding.ERB'
          UI='ERB/TRANSLATION/OMOGATARI/BetterUI.ERB'

          grep -Fq '@NAS_TOOL_MODS(ARG)' "$ITEM"
          grep -Fq '@TOOL_DEVELOP' "$ITEM"
          grep -Fq 'CAW_BASE = CLOTHES_ID("Weapon", CAW_STRING)' "$ITEM"
          grep -Fq '@SHOW_EQUIP_HEALTH(ARG)' "$UI"
          grep -Fq '@SHOW_EQUIP_WEAPON' "$UI"

          ! grep -Fq '을(를)' "$ITEM"
          ! grep -Fq '카리스마(Charisma)' "$ITEM"
          ! grep -Fq 'Desire greater or equal to Intimacy' "$UI"
          ! grep -Fq 'Regression Mark 3' "$UI"
          ! grep -Fq '10 Diaper Attraction' "$UI"
          ! grep -Fq 'Immune to checks for' "$UI"
          ! grep -Fq 'Attuned to ' "$UI"
          ! grep -Fxq '*.npz filter=lfs diff=lfs merge=lfs -' .gitattributes

          expected=$(printf '%s\n' \
            '.gitattributes' \
            'ERB/TRANSLATION/OMOGATARI/BetterUI.ERB' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Item Modding.ERB')
          actual=$(git diff --name-only | sort)
          [ "$actual" = "$expected" ] || {
            echo 'Unexpected changed files:'
            printf '%s\n' "$actual"
            exit 1
          }

          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            '.gitattributes' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Item Modding.ERB' \
            'ERB/TRANSLATION/OMOGATARI/BetterUI.ERB'
          git commit -m '아이템 UI 조사 및 잔여 영어 한글화 31차'
          git push origin HEAD:korean

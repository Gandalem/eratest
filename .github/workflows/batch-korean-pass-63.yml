name: Batch Korean pass 63 bulk + smoke

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-63.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Diagnose safe utility literals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('ERB/TRANSLATION/_TR Lib.ERB')
          raw = p.read_bytes(); assert raw.startswith(b'\xef\xbb\xbf')
          lines = raw.decode('utf-8-sig').splitlines()
          fn_re = re.compile(r'^@(\w+)\(')
          q_re = re.compile(r'"((?:\\.|[^"\\])*)"')
          eng = re.compile(r'[A-Za-z]{2,}')
          hangul = re.compile(r'[가-힣]')
          safe = {'FISH_NAME_TR','CROP_NAME_PLURAL','BAIT_TR','ALCOHOL_FACE_TR','MUSHI_TRIBE_TR','MUSHI_STATUS_TR','MUSHI_SKL_TR','VAR_FERMENT_TR','FESTIVAL_MENU_TR','VAR_WATER_TR','REQUEST_NAMES_TR','OPTIONS_TR'}
          active = None
          counts = {k:0 for k in safe}
          for lineno, line in enumerate(lines, 1):
              fm = fn_re.match(line)
              if fm:
                  active = fm.group(1)
                  continue
              if active not in safe or line.lstrip().startswith(';'):
                  continue
              for value in q_re.findall(line):
                  if eng.search(value) and not hangul.search(value):
                      counts[active] += 1
                      print(f'{active}\t{lineno}\t{value}')
          print('COUNTS')
          for k in sorted(counts): print(k, counts[k])
          print('TOTAL', sum(counts.values()))
          PY

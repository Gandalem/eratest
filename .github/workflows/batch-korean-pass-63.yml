name: Batch Korean pass 63 bulk + smoke

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-63.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main tools
        uses: actions/checkout@v4
        with:
          ref: main
          path: tools
          fetch-depth: 1

      - name: Checkout Korean target
        uses: actions/checkout@v4
        with:
          ref: korean
          path: target
          fetch-depth: 0

      - name: Apply pass 63 in working tree
        shell: bash
        run: |
          python3 tools/.github/scripts/batch_korean_pass63.py --root target

      - name: Validate exact static diff
        shell: bash
        working-directory: target
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          expected = {
              'ERB/TRANSLATION/LIST.ERB': (3, 3),
              'ERB/TRANSLATION/_TR Lib.ERB': (177, 177),
              'ERB/TRANSLATION/OMOGATARI/Body Parts/Bionic List.ERB': (260, 260),
              'ERB/TRANSLATION/OMOGATARI/Ideology.ERB': (31, 31),
              'ERB/TRANSLATION/OMOGATARI/Omogatari_STR.ERB': (43, 43),
          }
          out = subprocess.check_output(['git','diff','--numstat'], text=True)
          got = {}
          for line in out.splitlines():
              a, d, p = line.split('\t', 2)
              got[p] = (int(a), int(d))
          print('NUMSTAT', got)
          assert got == expected, (got, expected)
          assert sum(a for a,_ in got.values()) == 514
          assert sum(d for _,d in got.values()) == 514
          status = subprocess.check_output(['git','status','--porcelain'], text=True).splitlines()
          paths = {line[3:] for line in status}
          assert paths == set(expected), paths
          print('PASS63_STATIC_PREFLIGHT_OK')
          PY

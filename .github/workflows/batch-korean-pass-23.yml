name: Batch Korean pass 23

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate more spell card names and descriptions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          anchor = '\tCASE "Earth 「Impurity Within One\'s Body」"\n\t\tRETURNF "대지 「몸속의 부정」"\nENDSELECT\nRETURNF RawName'
          if anchor not in text:
              raise SystemExit('SpellCardDisplayName anchor not found')

          extra_cases = '\n'.join([
              '\tCASE "Snow Sign 「Diamond Blizzard」"', '\t\tRETURNF "설부 「다이아몬드 블리자드」"',
              '\tCASE "Fire Sign 「Agni Shine High Level」"', '\t\tRETURNF "화부 「아그니 샤인 상급」"',
              '\tCASE "Colorful Sign 「Vivid Chaotic Dance」"', '\t\tRETURNF "채부 「비비드 카오틱 댄스」"',
              '\tCASE "Impossible Request 「Robe of Fire Rat -Unhurried Mind-」"', '\t\tRETURNF "난제 「불쥐의 가죽옷 -침착한 마음-」"',
              '\tCASE "Spirit Sign 「Dream Seal -Concentrate-」"', '\t\tRETURNF "영부 「몽상봉인 -집-」"',
              '\tCASE "Wood Sign 「Sylphy Horn High Level」"', '\t\tRETURNF "목부 「실피 혼 상급」"',
              '\tCASE "Colorful Sign 「Dazzling Color Typhoon」"', '\t\tRETURNF "채부 「눈부신 색채의 태풍」"',
              '\tCASE "Divine Treasure 「Salamander Shield」"', '\t\tRETURNF "신보 「샐러맨더 실드」"',
              '\tCASE "Moon 「Lunatic Impact」"', '\t\tRETURNF "달 「루나틱 임팩트」"',
              '\tCASE "「Trinitarian Rhapsody」"', '\t\tRETURNF "「트리니테리언 랩소디」"',
          ])
          text = text.replace(anchor, anchor.replace('\nENDSELECT\nRETURNF RawName', '\n' + extra_cases + '\nENDSELECT\nRETURNF RawName'), 1)

          descs = [
              ('Explosions of shard-like bullets take place around Cirno as she erratically travels across the screen.',
               'Cirno가 화면을 불규칙하게 가로지르는 동안 주변에서 파편 같은 탄환이 폭발하듯 연속으로 퍼져 나온다.'),
              ('Patchouli creates waves of fireballs that circle around her, then change angle and expand the circle outwards.',
               'Patchouli가 자신을 중심으로 도는 화염탄의 파동을 만든 뒤 각도를 바꾸어 원을 바깥쪽으로 확장시킨다.'),
              ('Similar to the previous spell, but Meiling produces bullets in a spiral around her that go downwards in organized lanes, replacing the falling bullets from the prior spell card.',
               '이전 스펠과 비슷하지만 Meiling의 주변에서 탄환이 나선형으로 생성되어 정돈된 궤도를 따라 아래로 내려온다. 이전 스펠카드의 낙하 탄막을 이 나선형 패턴이 대신한다.'),
              ('One of the impossible requests that %CALLNAME:62% presented. Did she want a fire-resistant suit or something? Like a \\"with this, not even phoenix fire can touch ya!\\" sort of thing.',
               '%CALLNAME:62%이 제시한 난제 중 하나다. 불에도 타지 않는 옷 같은 것을 원했던 걸까? 이를테면 \\"이걸 입으면 봉황의 불길도 닿지 못한다!\\" 같은 물건 말이다.'),
              ('One of the Spell Cards that looks considerably different from the version the player uses. The amulets move as if they have minds of their own; it\'s like something from a dream.',
               '플레이어가 사용하는 버전과 모습이 상당히 다른 스펠카드다. 부적들이 마치 스스로 생각하는 것처럼 움직이며, 꿈속의 광경을 보는 듯하다.'),
              ('Behaves very similarly to \\"Sylphy Horn\\", but the direction of the bullets changes to the lower right, and it\'s far denser.',
               '\\"Sylphy Horn\\"과 매우 비슷하게 움직이지만 탄환의 진행 방향이 오른쪽 아래로 바뀌며 밀도도 훨씬 높다.'),
              ('Meiling forms a pattern that looks like a flower around her, and the bullets that come out curve in random directions all over the screen.',
               'Meiling이 자신의 주변에 꽃처럼 보이는 탄막 무늬를 만들고, 그곳에서 나온 탄환들이 화면 전체로 무작위 방향의 곡선을 그리며 퍼져 나간다.'),
              ('Fire rats, salamanders and phoenixes are all surrounded by fire, but I wonder if their insides are normal. At the very least, they would need blood that doesn\'t boil... wait, but Esidi(abbr.)',
               '불쥐와 샐러맨더, 봉황은 모두 불길에 둘러싸여 있는데 몸속도 평범할까? 적어도 끓지 않는 피 정도는 필요할 텐데... 잠깐, 하지만 Esidi(약칭)는...'),
          ]

          count = 0
          for old, new in descs:
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  count += c
                  print('SPELL_DESC', c, old[:100])
          if count < 8:
              raise SystemExit(f'Too few spell descriptions translated: {count}')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          print('DESCRIPTION_REPLACEMENTS', count)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 - <<'PY'
          import re, subprocess
          path = 'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB'
          diff = subprocess.check_output(['git', 'diff', '-U0', '--', path], text=True)
          bad = []
          for line in diff.splitlines():
              if re.match(r'^[+-]\s*CASE "名前"', line):
                  bad.append(line)
              if re.match(r'^[+-].*@SpellCard[0-9]+\(', line):
                  bad.append(line)
          if bad:
              print('\n'.join(bad))
              raise SystemExit('Internal spell-card identifier structure changed')
          print('Internal spell-card identifiers preserved')
          PY
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Omogatari_SpellCards.ERB'
          git commit -m '스펠카드 후속 설명 한글화 23차'
          git push origin HEAD:korean

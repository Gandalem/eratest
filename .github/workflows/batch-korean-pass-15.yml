name: Batch Korean pass 15

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Add display-only attachment translation layer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_Attatchments.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          if '@AttachmentDisplayName(' in text:
              raise SystemExit('AttachmentDisplayName already exists')

          helper = r'''
@AttachmentDisplayName(Owner, AttachmentType, Attachment)
#FUNCTIONS
#DIM Owner
#DIMS AttachmentType
#DIM Attachment
#DIMS RawName
RawName = GET_STR(Owner, AttachmentType, Attachment, "名前")
SELECTCASE AttachmentType
	CASE "WeaponMag"
		SELECTCASE RawName
			CASE "No Magazine"
				RETURNF "탄창 없음"
			CASE "Broughton STANAG 4179 5.56x45mm 30-round magazine"
				RETURNF "Broughton STANAG 4179 5.56x45mm 30발 탄창"
			CASE "Marksoft PMAG 10 STANAG 4179 5.56x45mm 10-round magazine"
				RETURNF "Marksoft PMAG 10 STANAG 4179 5.56x45mm 10발 탄창"
			CASE "Marksoft PMAG 20 STANAG 4179 5.56x45mm 20-round magazine"
				RETURNF "Marksoft PMAG 20 STANAG 4179 5.56x45mm 20발 탄창"
			CASE "Marksoft PMAG 30 STANAG 4179 5.56x45mm 30-round magazine"
				RETURNF "Marksoft PMAG 30 STANAG 4179 5.56x45mm 30발 탄창"
			CASE "Marksoft PMAG 40 STANAG 4179 5.56x45mm 40-round magazine"
				RETURNF "Marksoft PMAG 40 STANAG 4179 5.56x45mm 40발 탄창"
			CASE "Marksoft PMAG D-60 STANAG 4179 5.56x45mm 60-round magazine"
				RETURNF "Marksoft PMAG D-60 STANAG 4179 5.56x45mm 60발 드럼 탄창"
			CASE "Averdeen AM5 100 STANAG 4179 5.56x45mm 100-round magazine"
				RETURNF "Averdeen AM5 100 STANAG 4179 5.56x45mm 100발 드럼 탄창"
			CASE "MR-92LS ArmTeck belt-fed 5.56x45mm 200-round magazine"
				RETURNF "MR-92LS ArmTeck 벨트급탄 5.56x45mm 200발 탄창"
			CASE "LRS Brennan 12.7x99mm 10-round magazine"
				RETURNF "LRS Brennan 12.7x99mm 10발 탄창"
			CASE "SVG-67 FAB Defense Ultimag 30R 7.62x39mm 30-round magazine"
				RETURNF "SVG-67 FAB Defense Ultimag 30R 7.62x39mm 30발 탄창"
			CASE "S1000 Broughton 12ga 5-shell magazine cap"
				RETURNF "S1000 Broughton 12게이지 5발 튜브 탄창 캡"
			CASE "SAS-6 Maestro Armi 12ga 7-shell tube magazine"
				RETURNF "SAS-6 Maestro Armi 12게이지 7발 튜브 탄창"
			CASE "SAS-6 Maestro Armi 9-shell Tube Magazine"
				RETURNF "SAS-6 Maestro Armi 9발 튜브 탄창"
			CASE "S1000 Averdeen 12ga 11-shell Tube Magazine"
				RETURNF "S1000 Averdeen 12게이지 11발 튜브 탄창"
			CASE "S1000 Averdeen 12ga 13-shell Tube Magazine"
				RETURNF "S1000 Averdeen 12게이지 13발 튜브 탄창"
			CASE "GH31 Gabe Hubert 7.62x51mm 20-round magazine"
				RETURNF "GH31 Gabe Hubert 7.62x51mm 20발 탄창"
			CASE "GH81 Gabe Hubert 7.62x51mm 10-round magazine"
				RETURNF "GH81 Gabe Hubert 7.62x51mm 10발 탄창"
			CASE "GH54 F5 MFG 9x19mm 50-round magazine"
				RETURNF "GH54 F5 MFG 9x19mm 50발 드럼 탄창"
			CASE "GH54 TTI \"Base Pad +11\" 9x19mm 41-round magazine"
				RETURNF "GH54 TTI \"Base Pad +11\" 9x19mm 41발 탄창"
			CASE "S1000 Broughton 12ga 5-shell Magazine"
				RETURNF "S1000 Broughton 12게이지 5발 탄창"
			CASE "SVB Gryzov 7.62x54mmR 20-round magazine"
				RETURNF "SVB Gryzov 7.62x54mmR 20발 탄창"
			CASE "SVG-67 ProMag SVG-A-16 7.62x39mm 73-round drum magazine"
				RETURNF "SVG-67 ProMag SVG-A-16 7.62x39mm 73발 드럼 탄창"
			CASE "CQB25-A Tricorne 9x19mm 25-round magazine"
				RETURNF "CQB25-A Tricorne 9x19mm 25발 탄창"
		ENDSELECT
	CASE "WeaponBarrelBody"
		SELECTCASE RawName
			CASE "M602 Broughton 20in (508mm) Barrel"
				RETURNF "M602 Broughton 20인치 (508mm) 총열"
			CASE "M920 Broughton 14.5in (368mm) Barrel"
				RETURNF "M920 Broughton 14.5인치 (368mm) 총열"
			CASE "M933 Broughton 10.3in (262mm) Barrel"
				RETURNF "M933 Broughton 10.3인치 (262mm) 총열"
			CASE "GH54 Gabe Hubert 8.9in (225mm) Barrel"
				RETURNF "GH54 Gabe Hubert 8.9인치 (225mm) 총열"
			CASE "GH94/SG Gabe Hubert 16.5in (420mm) Barrel"
				RETURNF "GH94/SG Gabe Hubert 16.5인치 (420mm) 총열"
			CASE "AG-1 Gryzov 16.3in (415mm) Barrel"
				RETURNF "AG-1 Gryzov 16.3인치 (415mm) 총열"
			CASE "AG-2 Gryzov 12.4in (314mm) Barrel"
				RETURNF "AG-2 Gryzov 12.4인치 (314mm) 총열"
			CASE "AG-3 Gryzov 16.3in (415mm) Barrel"
				RETURNF "AG-3 Gryzov 16.3인치 (415mm) 총열"
			CASE "AG-4 Gryzov 12.4in (314mm) Barrel"
				RETURNF "AG-4 Gryzov 12.4인치 (314mm) 총열"
		ENDSELECT
ENDSELECT
RETURNF RawName

'''

          marker = '@WEAPON_MODIFY(TempMod,CanDev=0)'
          if marker not in text:
              raise SystemExit('Insertion marker not found')
          text = text.replace(marker, helper + marker, 1)

          replacements = {
              '%GET_STR(MASTER, GetAttachmentType(LOCAL,0), DT_CELL_GET("WeaponInventory", TempMod, GetAttachmentType(LOCAL,0), 1), "名前")%':
                  '%AttachmentDisplayName(MASTER, GetAttachmentType(LOCAL,0), DT_CELL_GET("WeaponInventory", TempMod, GetAttachmentType(LOCAL,0), 1))%',
              '%GET_STR(MASTER, AttachmentType, 999, "名前")%':
                  '%AttachmentDisplayName(MASTER, AttachmentType, 999)%',
              '%GET_STR(MASTER, AttachmentType, LOCAL, "名前")%':
                  '%AttachmentDisplayName(MASTER, AttachmentType, LOCAL)%',
              '%GET_STR(MASTER, AttachmentType, Attachment, "名前")%':
                  '%AttachmentDisplayName(MASTER, AttachmentType, Attachment)%',
              '%GET_STR(MASTER, "WeaponAmmo", Attachment, "名前")%':
                  '%AttachmentDisplayName(MASTER, "WeaponAmmo", Attachment)%',
              '%GET_STR(ARG, GetAttachmentType(SWP_LOOP,0), PresetAttachment(nWeaponPreset,GetAttachmentType(SWP_LOOP,0)), "名前")%':
                  '%AttachmentDisplayName(ARG, GetAttachmentType(SWP_LOOP,0), PresetAttachment(nWeaponPreset,GetAttachmentType(SWP_LOOP,0)))%',
              '%GET_STR(ARG, "WeaponAmmo", PresetAttachment(nWeaponPreset,"WeaponAmmo"), "名前")%':
                  '%AttachmentDisplayName(ARG, "WeaponAmmo", PresetAttachment(nWeaponPreset,"WeaponAmmo"))%',
              '%GET_STR(0, GetAttachmentType(SWP_LOOP,0), PresetAttachment(nWeaponPreset,GetAttachmentType(SWP_LOOP,0)), "名前")%':
                  '%AttachmentDisplayName(0, GetAttachmentType(SWP_LOOP,0), PresetAttachment(nWeaponPreset,GetAttachmentType(SWP_LOOP,0)))%',
          }

          hooks = 0
          for old, new in replacements.items():
              c = text.count(old)
              if c:
                  text = text.replace(old, new)
                  hooks += c
                  print('HOOK', c, old)

          if hooks < 8:
              raise SystemExit(f'Too few display hooks: {hooks}')
          if text.count('@AttachmentDisplayName(') < 2:
              raise SystemExit('Display helper was not wired into output paths')

          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)
          print('DISPLAY_HOOKS', hooks)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          # The underlying attachment data files and their lookup names are not modified in this pass.
          test -z "$(git diff --name-only -- 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Magazines.ERB' 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Barrels.ERB')"
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_Attatchments.ERB'
          git commit -m '탄창 및 총열 표시명 한글화 15차'
          git push origin HEAD:korean

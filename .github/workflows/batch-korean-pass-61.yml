name: Batch Korean pass 61

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-61.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Translate receiver display names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB')
          raw = p.read_bytes()
          assert raw.startswith(b'\xef\xbb\xbf'), 'UTF-8 BOM missing'
          text = raw.decode('utf-8-sig')

          protected = ['名前','描写','ShortName','Inspect','Platform','Base Weapon','Ammo','Accuracy','Burst/Set','Price']
          before_counts = {k: text.count(f'CASE "{k}"') for k in protected}

          rules = [
              (40, 'Burkov GKO622 9x18mm Receiver', '버코프 GKO622 9x18mm 리시버'),
              (41, 'CCW15 Tricorne 9x19mm Receiver', 'CCW15 트라이코르네 9x19mm 리시버'),
              (42, 'TMP-35 Tricorne Semi/Full 9x19mm Receiver', 'TMP-35 트라이코르네 반자동/완전자동 9x19mm 리시버'),
              (43, 'Sudy 23 BLC Full-Auto 9x19mm Receiver', '수디 23 BLC 완전자동 9x19mm 리시버'),
              (44, 'M635 Colt Semi/Full Lower and Upper 9x19mm Receiver', 'M635 콜트 반자동/완전자동 하부·상부 9x19mm 리시버'),
              (44, 'M635 Broughton Semi/Full Lower and Upper 9x19mm Receiver', 'M635 브라우턴 반자동/완전자동 하부·상부 9x19mm 리시버'),
              (45, 'Five-seveN FN Semi-Auto 5.7x28mm Receiver', 'Five-seveN FN 반자동 5.7x28mm 리시버'),
              (45, 'APD-57 High-Ground Semi-Auto Lower and Upper 5.7x28mm Receiver', 'APD-57 하이그라운드 반자동 하부·상부 5.7x28mm 리시버'),
              (46, 'UCP Heckler & Koch Semi-Auto 4.6x30mm Receiver', 'UCP 헤클러 & 코흐 반자동 4.6x30mm 리시버'),
              (46, 'GH46 Gabe Hubert Semi-Auto Lower and Upper 4.6x30mm Receiver', 'GH46 게이브 휴버트 반자동 하부·상부 4.6x30mm 리시버'),
              (47, 'MP7 Heckler & Koch Semi/Full 4.6x30mm Receiver', 'MP7 헤클러 & 코흐 반자동/완전자동 4.6x30mm 리시버'),
              (47, 'GH56 Gabe Hubert Semi/Full Lower and Upper 4.6x30mm Receiver', 'GH56 게이브 휴버트 반자동/완전자동 하부·상부 4.6x30mm 리시버'),
              (48, 'P90 FN Semi/Full 5.7x28mm Receiver', 'P90 FN 반자동/완전자동 5.7x28mm 리시버'),
              (48, 'APT-57 High-Ground Semi/Full 5.7x28mm Receiver', 'APT-57 하이그라운드 반자동/완전자동 5.7x28mm 리시버'),
              (49, 'AR57 Semi/Full 5.7x28mm Receiver', 'AR57 반자동/완전자동 5.7x28mm 리시버'),
              (49, 'MR-57 Semi/Full 5.7x28mm Receiver', 'MR-57 반자동/완전자동 5.7x28mm 리시버'),
              (50, 'AR-18 ArmaLite Semi/Full Lower and Upper 5.56x45mm Receiver', 'AR-18 아말라이트 반자동/완전자동 하부·상부 5.56x45mm 리시버'),
              (50, 'SPA ArmTeck Semi/Full Lower and Upper 5.56x45mm Receiver', 'SPA 암텍 반자동/완전자동 하부·상부 5.56x45mm 리시버'),
              (51, 'Type 89 Howa Semi/Full Lower and Upper 5.56x45mm Receiver', 'Type 89 호와 반자동/완전자동 하부·상부 5.56x45mm 리시버'),
              (51, 'Type 89 Haru Semi/Full Lower and Upper 5.56x45mm Receiver', 'Type 89 하루 반자동/완전자동 하부·상부 5.56x45mm 리시버'),
              (52, 'M994 Broughton Semi-Auto Fixed 10-Round 5.56x45mm Receiver', 'M994 브라우턴 반자동 고정식 10발 5.56x45mm 리시버'),
              (53, 'ATPSA Cactus Comp. Semi/Full Lower and Upper 19x99mm Receiver', 'ATPSA 캑터스 경기용 반자동/완전자동 하부·상부 19x99mm 리시버'),
              (54, 'MR R-Launcher Falkenberg 84x245mmR RCL Receiver', 'MR R-런처 팔켄베르크 84x245mmR RCL 리시버'),
              (55, 'Luftfaust 20x138mm Receiver', '루프트파우스트 20x138mm 리시버'),
              (56, 'GH512 Gabe Hubert 18.5x70mm Receiver', 'GH512 게이브 휴버트 18.5x70mm 리시버'),
              (57, 'PSB Tricorne Semi/Full 9x19mm Receiver', 'PSB 트라이코르네 반자동/완전자동 9x19mm 리시버'),
              (58, '⑨ FTAC Full-Auto 9x19mm Receiver', '⑨ FTAC 완전자동 9x19mm 리시버'),
              (59, 'DGL-103 ArmTeck 40x46mm Receiver', 'DGL-103 암텍 40x46mm 리시버'),
              (60, 'CC⑮ Fairy Tactical 9x19mm Receiver', 'CC⑮ 페어리 택티컬 9x19mm 리시버'),
              (61, 'PPP-177 GKO622 6-Round Burst .173 Receiver', 'PPP-177 GKO622 6발 점사 .173 리시버'),
              (62, 'PPB GKO622 Semi-Auto .173 Receiver', 'PPB GKO622 반자동 .173 리시버'),
              (63, 'PPP-177 GKO622 Delimited Full-Auto .173 Receiver', 'PPP-177 GKO622 제한 완전자동 .173 리시버'),
              (64, 'SPP GKO622 Single Shot .177 Receiver', 'SPP GKO622 단발 .177 리시버'),
              (65, 'Dutyman FoamSoft Straight-Pull 12.7x72mm Receiver', '듀티맨 폼소프트 직동식 12.7x72mm 리시버'),
              (66, 'LAC358 LUNINCO 4500W Energy Blade Receiver', 'LAC358 루닌코 4500W 에너지 블레이드 리시버'),
              (67, 'BS10 CONIG Semi/Full 10x50mmR Receiver', 'BS10 CONIG 반자동/완전자동 10x50mmR 리시버'),
              (68, 'BS97 CONIG Pump-Action 12ga Receiver', 'BS97 CONIG 펌프액션 12ga 리시버'),
              (69, 'BS97-1 CONIG Semi-Auto 12ga Receiver', 'BS97-1 CONIG 반자동 12ga 리시버'),
              (70, 'CAWS Gabe Hubert Semi/3-Round Burst 12ga Receiver', 'CAWS 게이브 휴버트 반자동/3발 점사 12ga 리시버'),
              (71, 'Saiga-366 Izhmash Semi-Auto 9.55x39mm Receiver', 'Saiga-366 이즈마시 반자동 9.55x39mm 리시버'),
              (71, 'Kabarga-366 Gryzov Semi-Auto 9.55x39mm Receiver', 'Kabarga-366 그리즈보프 반자동 9.55x39mm 리시버'),
              (72, 'MCM GKO622 5.6x15mmR Receiver', 'MCM GKO622 5.6x15mmR 리시버'),
              (74, 'RNN-20 Nizhny Novgorod 15.63x70mm Receiver', 'RNN-20 니즈니 노브고로드 15.63x70mm 리시버'),
              (75, 'RGKO-2 Gryzov 18.5x70mm Receiver', 'RGKO-2 그리즈보프 18.5x70mm 리시버'),
              (76, 'SLR High Ground Semi/Full 7.62x51mm Receiver', 'SLR 하이그라운드 반자동/완전자동 7.62x51mm 리시버'),
              (77, 'ALA-58 Averdeen Semi/Full 7.62x51mm Receiver', 'ALA-58 애버딘 반자동/완전자동 7.62x51mm 리시버'),
              (78, 'ALA-58 Averdeen Semi-Auto 7.62x51mm Receiver', 'ALA-58 애버딘 반자동 7.62x51mm 리시버'),
              (79, 'Polearm Base', '장병기 베이스'),
              (80, 'Attorney Kappa Armory Pump-Action 12ga Receiver', 'Attorney 캇파 아머리 펌프액션 12ga 리시버'),
              (81, 'SVB Gryzov Semi-Auto 7.62x54mmR Receiver', 'SVB 그리즈보프 반자동 7.62x54mmR 리시버'),
          ]
          assert len(rules) == 50

          func_re = re.compile(r'^@WeaponReceiver(\d+)\(ARG, O_DATA, V_NAME\)\s*$', re.M)

          def get_block(src, rid):
              funcs = list(func_re.finditer(src))
              for i, fm in enumerate(funcs):
                  if int(fm.group(1)) == rid:
                      end = funcs[i+1].start() if i+1 < len(funcs) else len(src)
                      return fm.start(), end, src[fm.start():end]
              raise AssertionError(f'missing receiver {rid}')

          changed = 0
          for rid, old, new in rules:
              start, end, block = get_block(text, rid)
              pat = re.compile(r'(CALLF MAKE_STR\(V_NAME,\s*@?")' + re.escape(old) + r'("\))')
              block2, n = pat.subn(lambda m: m.group(1) + new + m.group(2), block, count=1)
              assert n == 1, f'{rid}: expected 1 old match, got {n}: {old}'
              text = text[:start] + block2 + text[end:]
              changed += 1

          assert changed == 50
          after_counts = {k: text.count(f'CASE "{k}"') for k in protected}
          assert before_counts == after_counts, (before_counts, after_counts)

          for rid, old, new in rules:
              _, _, block = get_block(text, rid)
              old_pat = re.compile(r'CALLF MAKE_STR\(V_NAME,\s*@?"' + re.escape(old) + r'"\)')
              new_pat = re.compile(r'CALLF MAKE_STR\(V_NAME,\s*@?"' + re.escape(new) + r'"\)')
              assert not old_pat.search(block), f'old remains: {rid} {old}'
              assert new_pat.search(block), f'new missing: {rid} {new}'

          eng = re.compile(r'[A-Za-z]{2,}')
          hangul = re.compile(r'[가-힣]')
          literal_re = re.compile(r'CALLF MAKE_STR\(V_NAME,\s*(?:@)?"((?:\\.|[^"\\])*)"\)')
          remaining = []
          funcs = list(func_re.finditer(text))
          for i, fm in enumerate(funcs):
              rid = int(fm.group(1))
              fend = funcs[i+1].start() if i+1 < len(funcs) else len(text)
              block = text[fm.start():fend]
              cases = list(re.finditer(r'^\s*CASE "([^"]+)"\s*$', block, re.M))
              for ci, cm in enumerate(cases):
                  field = cm.group(1)
                  if field not in {'名前','描写'}:
                      continue
                  cend = cases[ci+1].start() if ci+1 < len(cases) else len(block)
                  cblock = block[cm.end():cend]
                  for sm in literal_re.finditer(cblock):
                      ls = cblock.rfind('\n', 0, sm.start()) + 1
                      line = cblock[ls:sm.end()]
                      if line.lstrip().startswith(';'):
                          continue
                      value = sm.group(1)
                      if eng.search(value) and not hangul.search(value):
                          remaining.append((rid, field, value))
          assert len(remaining) == 100, f'expected 100 remaining, got {len(remaining)}'

          p.write_bytes(b'\xef\xbb\xbf' + text.encode('utf-8'))
          print(f'CHANGED={changed}')
          print(f'REMAINING_ENGLISH_ONLY_VISIBLE={len(remaining)}')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB"
          git diff --check
          NUMSTAT="$(git diff --numstat)"
          echo "$NUMSTAT"
          test "$NUMSTAT" = $'50\t50\tERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB')
          assert p.read_bytes().startswith(b'\xef\xbb\xbf')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Receivers.ERB"
          git commit -m "리시버 UI 표시명 2차 한글화 61차"
          git push origin korean

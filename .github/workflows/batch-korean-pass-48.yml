name: Batch Korean pass 48

on:
  push:
    paths:
      - '.github/workflows/batch-korean-pass-48.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 0

      - name: Translate magazine display names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Magazines.ERB')
          raw = path.read_bytes()
          if not raw.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('UTF-8 BOM missing before edit')
          text = raw.decode('utf-8-sig')
          lines = text.splitlines(keepends=True)

          protected = ['ShortName', '装備部位', 'Platform', 'Mag Size/Set', 'Ammo', 'Price']
          protected_before = {k: text.count(f'CASE "{k}"') for k in protected}

          rules = [
              ('999', 'No Magazine', '탄창 없음'),
              ('1', 'Broughton STANAG 4179 5.56x45mm 30-round magazine', '브라운드 STANAG 4179 5.56x45mm 30발 탄창'),
              ('2', 'Marksoft PMAG 10 STANAG 4179 5.56x45mm 10-round magazine', '마크소프트 PMAG 10 STANAG 4179 5.56x45mm 10발 탄창'),
              ('3', 'Marksoft PMAG 20 STANAG 4179 5.56x45mm 20-round magazine', '마크소프트 PMAG 20 STANAG 4179 5.56x45mm 20발 탄창'),
              ('4', 'Marksoft PMAG 30 STANAG 4179 5.56x45mm 30-round magazine', '마크소프트 PMAG 30 STANAG 4179 5.56x45mm 30발 탄창'),
              ('5', 'Marksoft PMAG 40 STANAG 4179 5.56x45mm 40-round magazine', '마크소프트 PMAG 40 STANAG 4179 5.56x45mm 40발 탄창'),
              ('6', 'Marksoft PMAG D-60 STANAG 4179 5.56x45mm 60-round magazine', '마크소프트 PMAG D-60 STANAG 4179 5.56x45mm 60발 탄창'),
              ('7', 'Averdeen AM5 100 STANAG 4179 5.56x45mm 100-round magazine', '에버딘 AM5 100 STANAG 4179 5.56x45mm 100발 탄창'),
              ('8', 'MR-92LS ArmTeck belt-fed 5.56x45mm 200-round magazine', 'MR-92LS 암텍 벨트 급탄식 5.56x45mm 200발 탄창'),
              ('9', 'LRS Brennan 12.7x99mm 10-round magazine', 'LRS 브레넌 12.7x99mm 10발 탄창'),
              ('10', 'SVG-67 FAB Defense Ultimag 30R 7.62x39mm 30-round magazine', 'SVG-67 FAB 디펜스 울티맥 30R 7.62x39mm 30발 탄창'),
              ('11', 'S1000 Broughton 12ga 5-shell magazine cap', 'S1000 브라운드 12게이지 5발 탄창 캡'),
              ('12', 'SAS-6 Maestro Armi 12ga 7-shell tube magazine', 'SAS-6 마에스트로 아르미 12게이지 7발 튜브 탄창'),
              ('13', 'SAS-6 Maestro Armi 9-shell Tube Magazine', 'SAS-6 마에스트로 아르미 9발 튜브 탄창'),
              ('14', 'S1000 Averdeen 12ga 11-shell Tube Magazine', 'S1000 에버딘 12게이지 11발 튜브 탄창'),
              ('15', 'S1000 Averdeen 12ga 13-shell Tube Magazine', 'S1000 에버딘 12게이지 13발 튜브 탄창'),
              ('16', 'GH31 Gabe Hubert 7.62x51mm 20-round magazine', 'GH31 게이브 휴버트 7.62x51mm 20발 탄창'),
              ('17', 'GH81 Gabe Hubert 7.62x51mm 10-round magazine', 'GH81 게이브 휴버트 7.62x51mm 10발 탄창'),
              ('18', 'GH54 F5 MFG 9x19mm 50-round magazine', 'GH54 F5 MFG 9x19mm 50발 탄창'),
              ('19', 'GH54 TTI "Base Pad +11" 9x19mm 41-round magazine', 'GH54 TTI "베이스 패드 +11" 9x19mm 41발 탄창'),
              ('20', 'S1000 Broughton 12ga 5-shell Magazine', 'S1000 브라운드 12게이지 5발 탄창'),
              ('21', 'SVB Gryzov 7.62x54mmR 20-round magazine', 'SVB 그리즈보프 7.62x54mmR 20발 탄창'),
              ('23', 'SVG-67 ProMag SVG-A-16 7.62x39mm 73-round drum magazine', 'SVG-67 프로마그 SVG-A-16 7.62x39mm 73발 드럼 탄창'),
              ('24', 'CQB25-A Tricorne 9x19mm 25-round magazine', 'CQB25-A 트라이코르네 9x19mm 25발 탄창'),
              ('25', 'SVB Gryzov 7.62x54mmR 10-round magazine', 'SVB 그리즈보프 7.62x54mmR 10발 탄창'),
              ('26', 'PPG-9 PUFGUN SG-919 30 9x19mm 30-round magazine', 'PPG-9 PUFGUN SG-919 30 9x19mm 30발 탄창'),
              ('27', 'PPG-9 PUFGUN SG-919 20 9x19mm 20-round magazine', 'PPG-9 PUFGUN SG-919 20 9x19mm 20발 탄창'),
              ('28', "M2000 Wyatt's Outdoor 7.62x51mm 5-round magazine", 'M2000 와이엇 아웃도어 7.62x51mm 5발 탄창'),
              ('29', "M2000 Wyatt's Outdoor 7.62x51mm 10-round magazine", 'M2000 와이엇 아웃도어 7.62x51mm 10발 탄창'),
              ('30', 'PG-16 Gyzov 5.45x39mm 95-round drum magazine', 'PG-16 그리즈보프 5.45x39mm 95발 드럼 탄창'),
              ('31', 'AG-16 Gryzov 5.45x39mm 30-round magazine', 'AG-16 그리즈보프 5.45x39mm 30발 탄창'),
              ('32', 'Renov ProMag Archangel OPFOR 7.62x54mmR 10-round magazine', '레노브 프로마그 아크엔젤 OPFOR 7.62x54mmR 10발 탄창'),
              ('33', 'GH31 SLR 7.62x51mm 30-round magazine', 'GH31 SLR 7.62x51mm 30발 탄창'),
              ('34', 'GH31/MK-14 X Products X-14 7.62x51mm 50-round drum magazine', 'GH31/MK-14 X 프로덕츠 X-14 7.62x51mm 50발 드럼 탄창'),
              ('35', 'Renov 7.62x54mmR 5-round magazine', '레노브 7.62x54mmR 5발 탄창'),
              ('36', 'SKK-83 SAI-02 12ga 10-round magazine', 'SKK-83 SAI-02 12게이지 10발 탄창'),
              ('37', 'SVG-67 Gryzov 6L10 7.62x39mm 30-round magazine', 'SVG-67 그리즈보프 6L10 7.62x39mm 30발 탄창'),
              ('38', 'SVK-762 Gryzov ribbed metal 7.62x39mm 10-round magazine', 'SVK-762 그리즈보프 리브형 금속 7.62x39mm 10발 탄창'),
              ('39', 'CCW15 Tricorne 9x19mm 15-round magazine', 'CCW15 트라이코르네 9x19mm 15발 탄창'),
              ('40', 'SVG-76 Gryzov 6L23 5.45x39mm 30-round magazine', 'SVG-76 그리즈보프 6L23 5.45x39mm 30발 탄창'),
          ]

          def replace_name(mag_id, old, new):
              marker = f'@WeaponMag{mag_id}(ARG, O_DATA, V_NAME)'
              starts = [i for i, line in enumerate(lines) if line.rstrip('\r\n') == marker]
              if len(starts) != 1:
                  raise SystemExit(f'function marker mismatch {mag_id}: {len(starts)}')
              start = starts[0]
              next_funcs = [i for i in range(start + 1, len(lines)) if lines[i].startswith('@')]
              end = next_funcs[0] if next_funcs else len(lines)
              case_hits = [i for i in range(start, end) if lines[i].rstrip('\r\n').lstrip() == 'CASE "名前"']
              if len(case_hits) != 1:
                  raise SystemExit(f'name CASE mismatch {mag_id}: {len(case_hits)}')
              ci = case_hits[0]
              old_stmt = f'CALLF MAKE_STR(V_NAME, "{old.replace(chr(34), chr(92)+chr(34))}")'
              new_stmt = f'CALLF MAKE_STR(V_NAME, "{new.replace(chr(34), chr(92)+chr(34))}")'
              matches = []
              for j in range(ci + 1, end):
                  stripped = lines[j].rstrip('\r\n').lstrip()
                  if stripped.startswith('CASE "') or stripped == 'ENDSELECT':
                      break
                  if stripped == old_stmt:
                      matches.append(j)
              if len(matches) != 1:
                  raise SystemExit(f'name value mismatch {mag_id}: {len(matches)} old={old!r}')
              j = matches[0]
              body = lines[j].rstrip('\r\n')
              indent = body[:len(body) - len(body.lstrip())]
              newline = lines[j][len(body):]
              lines[j] = indent + new_stmt + newline

          if len(rules) != 40:
              raise SystemExit(f'rule count mismatch: {len(rules)}')
          for mag_id, old, new in rules:
              replace_name(mag_id, old, new)

          out = ''.join(lines)
          protected_after = {k: out.count(f'CASE "{k}"') for k in protected}
          if protected_before != protected_after:
              raise SystemExit(f'protected schema key count changed: {protected_before} -> {protected_after}')
          for _, old, new in rules:
              if new not in out:
                  raise SystemExit(f'new display name missing: {new!r}')
          path.write_bytes(b'\xef\xbb\xbf' + out.encode('utf-8'))
          print(f'[magazines] translated {len(rules)} display names')
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          target='ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Magazines.ERB'
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Magazines.ERB')
          b = p.read_bytes()
          if not b.startswith(b'\xef\xbb\xbf'):
              raise SystemExit('UTF-8 BOM missing after edit')
          print('[validate] BOM ok')
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "$target"
          stats="$(git diff --numstat -- "$target")"
          echo "[validate] $stats"
          add="$(printf '%s\n' "$stats" | awk '{print $1}')"
          del="$(printf '%s\n' "$stats" | awk '{print $2}')"
          test "$add" = "40"
          test "$del" = "40"

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Magazines.ERB'
          git commit -m '탄창 UI 표시명 1차 한글화 48차'
          git push origin korean

name: Batch Korean pass 17

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-17.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate sight stock and grip UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_Attatchments.ERB')
          raw = p.read_bytes()
          bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          if '\tCASE "WeaponSight"\n\t\tSELECTCASE RawName' in text:
              raise SystemExit('WeaponSight display mapping already exists')

          lines = [
              '\tCASE "WeaponSight"',
              '\t\tSELECTCASE RawName',
              '\t\t\tCASE "Iron Sights"', '\t\t\t\tRETURNF "기계식 조준기"',
              '\t\t\tCASE "NovelTooling EasySee Relex Sight"', '\t\t\t\tRETURNF "NovelTooling EasySee 반사식 조준경"',
              '\t\t\tCASE "Lunar Nights PoltergeistDS 1x/4x"', '\t\t\t\tRETURNF "Lunar Nights PoltergeistDS 1배/4배 조준경"',
              '\t\t\tCASE "Lunar Nights Site Seeker 1-8x24 30mm"', '\t\t\t\tRETURNF "Lunar Nights Site Seeker 1-8x24 30mm 조준경"',
              '\t\t\tCASE "SwampFox Trihawk Prism Scope 3.5x30"', '\t\t\t\tRETURNF "SwampFox Trihawk 3.5x30 프리즘 조준경"',
              '\t\t\tCASE "Tertiary Arms Compact Prism scope 2.5x"', '\t\t\t\tRETURNF "Tertiary Arms 2.5배 컴팩트 프리즘 조준경"',
              '\t\t\tCASE "Onacon ACOp TA11D 3.5x35"', '\t\t\t\tRETURNF "Onacon ACOp TA11D 3.5x35 조준경"',
              '\t\t\tCASE "Onacon ACOp TA01NSN 4x32"', '\t\t\t\tRETURNF "Onacon ACOp TA01NSN 4x32 조준경"',
              '\t\t\tCASE "Valday PS-320 1/6x scope"', '\t\t\t\tRETURNF "Valday PS-320 1배/6배 조준경"',
              '\t\t\tCASE "Leapers UTG reflex sight"', '\t\t\t\tRETURNF "Leapers UTG 반사식 조준경"',
              '\t\t\tCASE "Omotics PK-AA Reflex Sight"', '\t\t\t\tRETURNF "Omotics PK-AA 반사식 조준경"',
              '\t\t\tCASE "Lunar Nights PRO reflex sight"', '\t\t\t\tRETURNF "Lunar Nights PRO 반사식 조준경"',
              '\t\t\tCASE "HGA EXPS3-4 holographic sight"', '\t\t\t\tRETURNF "HGA EXPS3-4 홀로그램 조준경"',
              '\t\t\tCASE "OKP-7 reflex sight"', '\t\t\t\tRETURNF "OKP-7 반사식 조준경"',
              '\t\t\tCASE "Valday PK-120 (1P87) holographic sight"', '\t\t\t\tRETURNF "Valday PK-120 (1P87) 홀로그램 조준경"',
              '\t\t\tCASE "Omotics MRS Reflex Sight"', '\t\t\t\tRETURNF "Omotics MRS 반사식 조준경"',
              '\t\t\tCASE "HGA HHS-1 hybrid sight"', '\t\t\t\tRETURNF "HGA HHS-1 하이브리드 조준경"',
              '\t\t\tCASE "KappaArmory 401G5 reflex sight"', '\t\t\t\tRETURNF "KappaArmory 401G5 반사식 조준경"',
              '\t\tENDSELECT',
              '\tCASE "WeaponStock"',
              '\t\tSELECTCASE RawName',
              '\t\t\tCASE "No Stock"', '\t\t\t\tRETURNF "개머리판 없음"',
              '\t\t\tCASE "MOE Rifle Stock"', '\t\t\t\tRETURNF "MOE 소총 개머리판"',
              '\t\t\tCASE "MR-70 Tertiary Arms Enhanced Collapsible Buttstock"', '\t\t\t\tRETURNF "MR-70 Tertiary Arms 강화 접이식 개머리판"',
              '\t\t\tCASE "MR-70 B5 Systems Precision stock"', '\t\t\t\tRETURNF "MR-70 B5 Systems 정밀 개머리판"',
              '\t\t\tCASE "M920 Broughton telescoping stock"', '\t\t\t\tRETURNF "M920 Broughton 신축식 개머리판"',
              '\t\t\tCASE "AG-10 Omotics telescoping stock"', '\t\t\t\tRETURNF "AG-10 Omotics 신축식 개머리판"',
              '\t\t\tCASE "GH54 End Cap stock"', '\t\t\t\tRETURNF "GH54 엔드 캡 개머리판"',
              '\t\t\tCASE "The Poor Man\'s Side Folder"', '\t\t\t\tRETURNF "가난한 자의 측면 접이식 개머리판"',
              '\t\tENDSELECT',
              '\tCASE "WeaponGrip"',
              '\t\tSELECTCASE RawName',
              '\t\t\tCASE "No Grip"', '\t\t\t\tRETURNF "그립 없음"',
              '\t\t\tCASE "MOE Pistol Grip"', '\t\t\t\tRETURNF "MOE 권총 그립"',
              '\t\t\tCASE "GH31 Gabe Hubert Pistol Grip"', '\t\t\t\tRETURNF "GH31 Gabe Hubert 권총 그립"',
              '\t\t\tCASE "SVG-67 Gryzov Pistol Grip"', '\t\t\t\tRETURNF "SVG-67 Gryzov 권총 그립"',
              '\t\t\tCASE "M602 Broughton Pistol Grip"', '\t\t\t\tRETURNF "M602 Broughton 권총 그립"',
              '\t\t\tCASE "Gensou-chan HUG-ME Super Absorbent Polymer Pistol Grip"', '\t\t\t\tRETURNF "Gensou-chan HUG-ME 초흡수성 폴리머 권총 그립"',
              '\t\t\tCASE "AAR-75 Averdeen Green Pistol Grip"', '\t\t\t\tRETURNF "AAR-75 Averdeen 그린 권총 그립"',
              '\t\t\tCASE "QBZ-HB CONIG Pistol Grip"', '\t\t\t\tRETURNF "QBZ-HB CONIG 권총 그립"',
              '\t\tENDSELECT',
          ]
          block = '\n'.join(lines) + '\n'
          marker = '\tCASE "WeaponBarrelBody"\n'
          if marker not in text:
              raise SystemExit('WeaponBarrelBody marker not found')
          text = text.replace(marker, block + marker, 1)
          out = text.encode('utf-8')
          if bom:
              out = b'\xef\xbb\xbf' + out
          p.write_bytes(out)

          # Safe description-only cleanup; identifiers remain untouched.
          fixes = {
              Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Stocks.ERB'): [
                  ('CALLF MAKE_STR(V_NAME, "\\\"Accuracy is overrated\\\"\\n- No one ever")', 'CALLF MAKE_STR(V_NAME, "\\\"명중률은 과대평가됐어\\\"\\n- 아무도 한 적 없는 말")'),
                  ('M920에 포함된 탄창이다. Broughton Arms Company, LLC에서 제조했다.', 'M920에 기본 장착되는 신축식 개머리판이다. Broughton Arms Company, LLC에서 제조했다.'),
                  ('오모틱스(Omotics)에서 AG-10 소총용으로 제작한 망원 스톡 제품이다.', '오모틱스(Omotics)에서 AG-10 소총용으로 제작한 신축식 개머리판이다.'),
              ],
              Path('ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Sights.ERB'): [
                  ('PK-120 (GRAU Index - 1P87) is a holographic sight produced by Valday. It is part of the DPSK complex (day-night sight-observation complex) of the experimental design work \\\"Ratnik\\\"', 'PK-120(GRAU 지수 1P87)은 Valday에서 생산한 홀로그램 조준경이다. 실험 설계 사업 \\\"Ratnik\\\"의 DPSK 복합체(주야간 조준·관측 체계)에 포함된다.'),
              ],
          }

          n = 0
          for fp, reps in fixes.items():
              raw = fp.read_bytes(); had_bom = raw.startswith(b'\xef\xbb\xbf'); s = raw.decode('utf-8-sig')
              for old, new in reps:
                  c = s.count(old)
                  if c:
                      s = s.replace(old, new)
                      n += c
                      print('DESC', fp.name, c, old[:80])
              out = s.encode('utf-8')
              if had_bom:
                  out = b'\xef\xbb\xbf' + out
              fp.write_bytes(out)
          if n < 4:
              raise SystemExit(f'Too few description fixes: {n}')
          print('DESCRIPTION_FIXES', n)
          PY

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          for f in \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Sights.ERB' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Stocks.ERB' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Grips.ERB'; do
            if git diff -U0 -- "$f" | grep -E '^[+-][[:space:]]*CASE "名前"|^[+-].*@(WeaponSight_ID|WeaponStock_ID|WeaponGrip_ID)'; then
              echo "Internal attachment identifier structure changed in $f"; exit 1
            fi
          done
          git diff --stat

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Gandalem'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Omogatari_Attatchments.ERB' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Sights.ERB' \
            'ERB/TRANSLATION/OMOGATARI/ITEM/Armory/Attatchments/Stocks.ERB'
          git commit -m '조준경 개머리판 그립 한글화 17차'
          git push origin HEAD:korean

name: Batch Korean pass 33

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/batch-korean-pass-33.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Korean branch
        uses: actions/checkout@v4
        with:
          ref: korean
          fetch-depth: 1
          lfs: false

      - name: Translate talent race and personality tooltips
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          TOKEN_RE = re.compile(r'%[^%\n]+%|\{[^{}\n]+\}|\\%')

          def read_text(path):
              raw = path.read_bytes()
              return raw.startswith(b'\xef\xbb\xbf'), raw.decode('utf-8-sig')

          def write_text(path, bom, text):
              data = text.encode('utf-8')
              if bom:
                  data = b'\xef\xbb\xbf' + data
              path.write_bytes(data)

          def tokens(s):
              return sorted(TOKEN_RE.findall(s))

          def apply_exact(text, rules, label):
              total = 0
              for old, new, expected in rules:
                  count = text.count(old)
                  if count != expected:
                      raise SystemExit(f'{label}: unexpected match count: expected={expected}, actual={count}\n{old}')
                  if tokens(old) != tokens(new):
                      raise SystemExit(f'{label}: protected token mismatch\nOLD {tokens(old)}\nNEW {tokens(new)}\n{old}')
                  text = text.replace(old, new)
                  total += count
                  print(label, count, old[:90])
              return text, total

          ui = Path('ERB/TRANSLATION/HTML_TALENTS/HTML_MOUSEOVER.ERB')
          bom, text = read_text(ui)

          rules = [
              (r'''RETURNF "This character is apathetic.\nIf player: \nIf not player: Makes dating harder. Less likely to push you down. Favor (only without Love) and Trust raise 2 times slower.\nGems: Loyalty↓ Desire↓ Submission↓ Favor↓ Fear↓ Hostility↓ "''',
               r'''RETURNF "이 캐릭터는 무기력하고 무관심합니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 데이트가 어려워지고 당신에게 적극적으로 다가올 가능성이 낮아집니다. 연인이 아닐 때 호의와 신뢰가 2배 느리게 상승합니다.\n보석: 충성↓ 욕정↓ 복종↓ 호의↓ 공포↓ 적대↓"''', 1),
              (r'''RETURNF "This character shows very little emotion.\nIf player: \nIf not player: Favor and Trust raise slower. Less likely to get a good effect from drinking alcohol. Cannot gain or lose Obedience ability from acquiring Marks.\nGems: ALL↓"''',
               r'''RETURNF "이 캐릭터는 감정을 거의 드러내지 않습니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 호의와 신뢰가 더 느리게 오르고 술의 좋은 효과를 받기 어려워집니다. 각인을 획득해도 복종 능력이 오르거나 내리지 않습니다.\n보석: 전체↓"''', 1),
              (r'''RETURNF "This character is gloomy and melancholic.\nIf player: \nIf not player: \nGems: Depression↑ Favor↑(if both have it)"''',
               r'''RETURNF "이 캐릭터는 우울하고 침울합니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 별도 효과가 없습니다.\n보석: 우울↑, 서로 이 특성을 가졌다면 호의↑"''', 1),
              (r'''RETURNF "This character is cheerful and lively.\nIf player: \nIf not player: \nGems: Depression↓ Favor↑(if both have it)"''',
               r'''RETURNF "이 캐릭터는 명랑하고 활기찹니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 별도 효과가 없습니다.\n보석: 우울↓, 서로 이 특성을 가졌다면 호의↑"''', 1),
              (r'''RETURNF "This character is a show-off, clamoring for attention.\nIf player: \nIf not player: Makes it easier to execute commands.\nGems: Loyalty↑"''',
               r'''RETURNF "이 캐릭터는 남의 관심을 끌기 좋아하는 과시형입니다.\n플레이어일 때: 별도 효과가 없습니다.\n대상일 때: 여러 행동을 실행하기 쉬워집니다.\n보석: 충성↑"''', 1),
              (r'''RETURNF "Effectiveness of the commands that utilize needles is increased."''',
               r'''RETURNF "바늘을 사용하는 행동의 효과가 증가합니다."''', 1),
              (r'''RETURNF "This character ignores a certain insensitivity of other characters. Penalties to corresponding pleasure are removed."''',
               r'''RETURNF "다른 캐릭터의 특정 둔감 특성을 무시합니다. 해당 감각의 효과에 적용되던 페널티가 제거됩니다."''', 1),

              (r'''RETURNF "A featherless biped with broad flat nails.\nSome are from Gensokyo and others from the outside world.\nWhile weaker than Youkai they have the potential to hone their skills in the meager lifespan they are given."''',
               r'''RETURNF "넓고 납작한 손톱을 가진 털 없는 이족보행 생물입니다.\n환상향 출신도 있고 바깥세계 출신도 있습니다.\n요괴보다 약하지만 짧은 수명 동안 기술을 갈고닦을 잠재력을 지니고 있습니다."''', 1),
              (r'''RETURNF "A human that has through spiritual training ascended their mortal bonds and gotten one step closer to immortality.\nHermits spend their days reading sutras and can live for hundreds of years while consuming the barest of food.\nThe wisest of hermits can survive on fog alone.\nHaving left their humanity behind, they are difficult to impregnate."''',
               r'''RETURNF "영적 수행으로 인간의 굴레를 넘어 불사에 한 걸음 가까워진 인간입니다.\n선인은 경전을 읽으며 최소한의 음식만으로 수백 년을 살 수 있습니다.\n가장 뛰어난 선인은 안개만으로도 살아갈 수 있습니다.\n인간성을 어느 정도 벗어났기 때문에 번식이 어렵습니다."''', 1),
              (r'''RETURNF "Living above the clouds, Celestials are neither quite human nor Youkai.\nThey live idyllic lives above the clouds, holding parties each day.\nIn the past people used to be able to attain enlightenment and reach heaven, but no more.\nNo longer human, it is difficult to impregnate them."''',
               r'''RETURNF "구름 위에 사는 천인은 완전한 인간도 요괴도 아닙니다.\n구름 위에서 매일 연회를 열며 한가로운 삶을 보냅니다.\n과거에는 인간도 깨달음을 얻어 천계에 오를 수 있었지만 이제는 그렇지 않습니다.\n더 이상 인간이 아니므로 번식이 어렵습니다."''', 1),
              (r'''RETURNF "A humanoid creature who lives on the moon, obsessed with purity.\nThey are far more powerful than normal humans with greater stamina to match.\nTheir lifespans are so long it is said to only end in battle or accident.\nAs they are not humans, they are difficult to impregnate."''',
               r'''RETURNF "달에 사는 인간형 존재로 순수함에 집착합니다.\n평범한 인간보다 훨씬 강하고 그만큼 체력도 뛰어납니다.\n수명이 매우 길어 전투나 사고가 아니면 죽지 않는다고 전해집니다.\n인간이 아니므로 번식이 어렵습니다."''', 1),
              (r'''RETURNF "A supernatural being.\nThere are thousand of tales about what Youkai are and can do, where they come from and what sustains them.\nThus, there is no single definition.\nThey are distinctively not human, even if they can be alive and have a pulse.\nFor this reason it can be hard for them to conceive."''',
               r'''RETURNF "초자연적인 존재입니다.\n요괴가 무엇인지, 무엇을 할 수 있는지, 어디서 태어나고 무엇으로 살아가는지에 대한 이야기는 셀 수 없이 많습니다.\n따라서 하나의 정의로 묶을 수 없습니다.\n살아 있고 맥박이 뛰더라도 인간과는 분명히 다른 존재입니다.\n그 때문에 번식이 어렵습니다."''', 1),
              (r'''RETURNF "Happy, jovial, and strong as hell.\nOriginating from shapeless somethingness, they are not like Youkai.\nThey hate beans, lies, and liars.\nLoves to compete with others and proving their superiority.\nThe only way a human can win against one is by cheating.\nEven more unrelated to humans than Youkai are, it is exceedingly difficult to impregnate one."''',
               r'''RETURNF "명랑하고 호쾌하며 엄청나게 강합니다.\n형태 없는 무언가에서 비롯된 존재라 일반적인 요괴와는 다릅니다.\n콩과 거짓말, 거짓말쟁이를 싫어합니다.\n다른 이와 겨루고 자신의 우월함을 증명하는 일을 좋아합니다.\n인간이 오니에게 이기려면 속임수를 쓰는 수밖에 없습니다.\n인간과의 연관성이 요괴보다도 희박해 번식이 극도로 어렵습니다."''', 1),
              (r'''RETURNF "A catch-all term for animals that have become Youkai.\nWhen an animal lives for too long or experiences too much, it sometimes awakens.\nExamples include Nekomata and Bake-danuki from cats and tanuki respectively.\nBeing Youkai, it is difficult for them to conceive.\nBut as they were originally living animals, they are more fertile than conceptual Youkai."''',
               r'''RETURNF "동물이 요괴가 된 존재를 통칭합니다.\n동물이 너무 오래 살거나 수많은 경험을 겪으면 때때로 요괴로 각성합니다.\n고양이에서 태어난 네코마타와 너구리에서 태어난 바케다누키 등이 대표적입니다.\n요괴이므로 번식이 어렵지만, 원래 살아 있는 동물이었던 만큼 개념에서 태어난 요괴보다는 번식 가능성이 높습니다."''', 1),
              (r'''RETURNF "A devil of some kind.\nSummoned to Gensokyo from Makai or other hellish domains. They are strongly associated with magic and are often bound to contracts.\nCreatures of innate evil and death, it is difficult to fill them with life."''',
               r'''RETURNF "악마 계열의 존재입니다.\n마계나 그 밖의 지옥 같은 영역에서 환상향으로 소환되며 마법과 깊이 연관되어 있고 계약에 묶이는 경우가 많습니다.\n본질적으로 악과 죽음에 가까운 존재라 새로운 생명을 품기 어렵습니다."''', 1),
              (r'''RETURNF "House spirits that bring good fortune.\nUsually take the form of small girls.\nThey play harmless pranks to draw attention to themselves.\nNeglecting a house makes them leave, bringing misfortune.\nIt is difficult for them to conceive."''',
               r'''RETURNF "집에 행운을 가져오는 정령입니다.\n대개 어린 소녀의 모습으로 나타납니다.\n관심을 끌기 위해 해가 없는 장난을 치곤 합니다.\n집을 방치하면 떠나며 그 뒤에는 불운이 찾아옵니다.\n번식이 어렵습니다."''', 1),
              (r'''RETURNF "A type of kappa who live in the forests of Youkai Mountain.\nKappa and yamawaro have a long-running rivalry with one another, but it doesn't stop them from trading with one another.\nYamawaro are usually rude and hostile to outsiders, but there are some exceptions.\nAs with all Youkai, it is difficult to impregnate one."''',
               r'''RETURNF "요괴의 산 숲에 사는 캇파의 한 종류입니다.\n캇파와 야마와로는 오랜 경쟁 관계지만 서로 거래하는 데까지 지장이 있는 것은 아닙니다.\n야마와로는 대체로 외부인에게 무례하고 적대적이지만 예외도 있습니다.\n다른 요괴와 마찬가지로 번식이 어렵습니다."''', 1),
              (r'''RETURNF "A small being made of magic, fueled by nature itself.\nAs long as nature remains, they will always reshape.\nBeing aspects of nature, it is very difficult to impregnate one."''',
               r'''RETURNF "자연 그 자체의 힘으로 유지되는 작은 마법적 존재입니다.\n자연이 남아 있는 한 소멸해도 다시 모습을 갖춥니다.\n자연의 일부에 가까운 존재라 번식이 매우 어렵습니다."''', 1),
              (r'''RETURNF "A ghost that is innately evil.\nSomeone who died with regret or was cursed after death.\nTend to be very hostile and mean.\nBeing ghosts, it is difficult for them to conceive."''',
               r'''RETURNF "본질적으로 악한 유령입니다.\n한을 품고 죽었거나 죽은 뒤 저주받은 사람이 이런 존재가 됩니다.\n매우 적대적이고 사나운 경우가 많습니다.\n유령이므로 번식이 어렵습니다."''', 1),
              (r'''RETURNF "A Type of Youkai formed when the god dwelling inside an object becomes angry at its disposal.\nIt animates the object to get revenge on the one that disrespectfully threw it away.\nBeing inanimate objects originally, it is difficult to impregnate them.\nBut, understanding tools and using them respectfully can make it easier."''',
               r'''RETURNF "물건에 깃든 신이 버려진 일에 분노하면서 태어나는 요괴입니다.\n버려진 물건을 움직여 자신을 함부로 내다 버린 사람에게 복수합니다.\n원래 무생물이었기 때문에 번식이 어렵습니다.\n다만 도구를 이해하고 소중히 다루면 가능성이 조금 높아질 수 있습니다."''', 1),
              (r'''RETURNF "A statue that protects travelers, given life by belief.\nThey have a lot of experience with humans, but have little experience expressing themselves.\nOriginally statues, it is difficult for them to conceive."''',
               r'''RETURNF "신앙에 의해 생명을 얻어 여행자를 지키는 석상입니다.\n인간과 접촉한 경험은 많지만 감정을 표현하는 데는 익숙하지 않습니다.\n원래 석상이었으므로 번식이 어렵습니다."''', 1),
              (r'''RETURNF "A hollow clay figure that has had life breathed into it.\nNot having lived long, they are rather rigid and strict.\nAs they were originally clay figures, it is difficult for them to conceive."''',
               r'''RETURNF "속이 빈 토우에 생명이 불어넣어진 존재입니다.\n살아온 시간이 짧아 다소 융통성이 없고 엄격합니다.\n원래 흙으로 만든 인형이었으므로 번식이 어렵습니다."''', 1),
              (r'''RETURNF "A form of Vampire from China.\nAs rigor mortis has set in, they often have difficulty moving, forced to bounce and hop on rigid legs.\nJust like Vampires, they shun the sun and drink blood to survive.\nAs they are dead, it is difficult for them to conceive."''',
               r'''RETURNF "중국에서 유래한 흡혈귀 계열의 존재입니다.\n사후경직 때문에 움직임이 불편해 굳은 다리로 깡충깡충 뛰어다니는 경우가 많습니다.\n흡혈귀처럼 햇빛을 피하고 피를 마시며 살아갑니다.\n죽은 몸이므로 번식이 어렵습니다."''', 1),
              (r'''RETURNF "One who devotes their life to the art of magic.\nPractitioners are found amongst both ordinary humans and youkai, though many human practitioners eventually become youkai themselves through the course of their research.\nAs their nature remains close to that of humans, it\'s easier to impregnate them than other youkai."''',
               r'''RETURNF "마법의 길에 삶을 바친 존재입니다.\n평범한 인간과 요괴 양쪽에서 마법사를 찾을 수 있으며, 인간 마법사 가운데는 연구를 계속하다 스스로 요괴가 되는 경우도 많습니다.\n본질이 인간과 비교적 가까워 다른 요괴보다 번식이 쉽습니다."''', 1),
              (r'''RETURNF "A strange lifeform with contradictory powers.\nOrigins are unknown, and powers are unexplainable.\nSome say they can stop time, other say they move fast with no mass.\nStill human in the end, but pregnancy might bother their master."''',
               r'''RETURNF "서로 모순되는 듯한 능력을 지닌 기묘한 존재입니다.\n기원은 알 수 없고 능력도 설명하기 어렵습니다.\n시간을 멈춘다는 설도 있고 질량 없이 고속으로 움직인다는 설도 있습니다.\n결국 인간이지만 임신은 주인에게 곤란한 일이 될 수 있습니다."''', 1),

              (r'''RETURNF "Through their betrayals, this character has made themselves an enemy in the eyes of the fairies.\nIt would take a lot of work to regain their trust. If they'd even want to, that is."''',
               r'''RETURNF "거듭된 배신으로 요정들에게 적으로 인식되었습니다.\n다시 신뢰를 얻으려면 많은 노력이 필요합니다. 요정들이 그 기회조차 줄지는 알 수 없습니다."''', 1),
              (r'''RETURNF "Through all their efforts, this character has gained so much of the fairies' trust that they consider them to be their leader.\nFairies everywhere will always be willing to help them."''',
               r'''RETURNF "꾸준한 노력으로 요정들의 절대적인 신뢰를 얻어 지도자로 인정받았습니다.\n어디의 요정이든 언제나 기꺼이 도움을 줄 것입니다."''', 1),
              (r'''RETURNF "Through all their efforts, this character has gained so much of the fairies' trust that they consider them to be their greatest friend.\nFairies everywhere will gladly help them, but would it be possible for anyone to get even closer to the fairies?"''',
               r'''RETURNF "꾸준한 노력으로 요정들의 깊은 신뢰를 얻어 최고의 친구로 인정받았습니다.\n어디의 요정이든 기꺼이 도움을 줄 것입니다. 여기서 더 가까워질 수도 있을까요?"''', 1),
              (r'''RETURNF "This character has befriended the fairies and commands some influence amongst them.\nNearby fairies may decide to help this character from time to time."''',
               r'''RETURNF "요정들과 친분을 쌓아 어느 정도 영향력을 갖게 되었습니다.\n근처의 요정들이 때때로 이 캐릭터를 도와줄 수 있습니다."''', 1),
              (r'''RETURNF "This character has well-defined muscles, and is able to lift a person with ease."''',
               r'''RETURNF "근육이 잘 발달해 있으며 사람 한 명 정도는 가볍게 들어 올릴 수 있습니다."''', 1),
              (r'''RETURNF "This character is well-connected and eager to spread gossip, both good and bad.\nEffects of rumors are doubled."''',
               r'''RETURNF "인맥이 넓고 좋은 소문이든 나쁜 소문이든 퍼뜨리기를 좋아합니다.\n소문의 효과가 2배가 됩니다."''', 1),
              (r'''RETURNF "This character has some experience in brewing alcohol.\nBrewing log is available.\nBrewing volume is slightly increased."''',
               r'''RETURNF "술을 빚어 본 경험이 있습니다.\n양조 기록을 확인할 수 있습니다.\n양조량이 조금 증가합니다."''', 1),
              (r'''RETURNF "This character is a master at brewing alcohol.\nBrewing is slightly faster."''',
               r'''RETURNF "술을 빚는 데 능숙합니다.\n양조 속도가 조금 빨라집니다."''', 1),
              (r'''RETURNF "This character is a certified brewer, with a cool piece of paper proving it.\nAble to create Polished Rice."''',
               r'''RETURNF "공식 자격을 갖춘 양조가입니다. 증명서도 제대로 가지고 있습니다.\n정미를 만들 수 있습니다."''', 1),
              (r'''RETURNF "This character has brewed and tasted every alcohol known to Gensokyo, and then some."''',
               r'''RETURNF "환상향에 알려진 거의 모든 술을 빚고 맛보았으며, 그 이상의 경험까지 갖고 있습니다."''', 1),
          ]

          text, count = apply_exact(text, rules, 'HTML_TALENTS_33')

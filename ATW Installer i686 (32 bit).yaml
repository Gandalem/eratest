description: Play "eraToho The World", AnonTW Mod provided by GitGud on Linux! 32 bit executables.
game_slug: eratoho-the-world
installer_slug: eratw-windows-gitgud-atw-x86
slug: eratw-windows-gitgud-atw-x86
name: eraToho The World
runner: wine
version: Windows GitGud AnonTW x86
script:
  files:
  - archive: https://gitgud.io/Legis1998/anon-tw/-/archive/anon-tw_eng-modding/anon-tw-anon-tw_eng-modding.zip
  - dotnet7: https://download.visualstudio.microsoft.com/download/pr/b840017b-c69f-4724-a152-11020a0039e6/b74aa12e4ee765a3387a7dcd4ba56187/windowsdesktop-runtime-7.0.20-win-x86.exe
  - dotnet8: https://download.visualstudio.microsoft.com/download/pr/bd1c2e28-44dd-47bb-a55c-aedd1f3e8cc4/0a15fac821e64cf7b8ec6d99e54e0997/windowsdesktop-runtime-8.0.8-win-x86.exe
  game:
    exe: "$GAMEDIR/drive_c/Games/eraTW/EmueraLazyLoadingV2 32bit.exe"
    launch_configs:
    - exe: "$GAMEDIR/drive_c/Games/eraTW/EmueraLazyLoadingV2 32bit.exe"
      args: -debug
      name: Debug Mode
  installer:
  - task:
      arch: win32
      description: Preparing wineprefix...
      name: create_prefix
      prefix: $GAMEDIR
  - extract:
      description: Extracting...
      file: $archive
      dst: $GAMEDIR/drive_c/Games/eraTW/
  - task:
      args: /install /quiet /norestart
      arch: win32
      description: Installing .NET 7...
      executable: dotnet7
      name: wineexec
      prefix: $GAMEDIR
  - task:
      args: /install /quiet /norestart
      arch: win32
      description: Installing .NET 8...
      executable: dotnet8
      name: wineexec
      prefix: $GAMEDIR
  - task:
      name: winekill
      prefix: $GAMEDIR
    system:
